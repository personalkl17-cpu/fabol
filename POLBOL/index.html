        <h1>UNIDAD TEMÁTICA No. 7</h1>
        <h2>FUNDAMENTOS JURÍDICOS</h2>
        <h3>INTRODUCCIÓN</h3>
        <p>El estudio de los fundamentos jurídicos de la función policial constituye una condición indispensable para comprender la legitimidad, los límites y las responsabilidades que acompañan el ejercicio de la autoridad pública. En un Estado Constitucional de Derecho, la actuación policial no se justifica únicamente por su finalidad de preservar el orden, sino por su sujeción estricta a la Constitución, al ordenamiento jurídico y a los derechos fundamentales. Esta perspectiva exige que cada intervención se encuentre jurídicamente motivada, sea necesaria para alcanzar un fin legítimo y respete criterios de proporcionalidad, razonabilidad, transparencia y rendición de cuentas. Según Mendoza (2009), el Derecho Constitucional organiza el poder estatal, determina sus límites y garantiza la protección de la persona frente a actuaciones arbitrarias.</p>
        <p>La presente unidad desarrolla, de manera progresiva, los conceptos esenciales vinculados con el Estado Constitucional de Derecho, la Constitución Política del Estado, los principios constitucionales de la función policial, los derechos fundamentales, el ordenamiento jurídico boliviano, la interpretación de la ley, la función pública policial, las responsabilidades del servidor público policial, el uso legítimo de la fuerza, la ética institucional y la seguridad ciudadana.</p>
        <div class="ejemplo-practico"><strong>Ejemplo práctico:</strong> Durante un operativo preventivo en una zona con alta incidencia delictiva, el responsable policial identifica la base constitucional y legal de la intervención, establece objetivos orientados a la protección de la sociedad, dispone mecanismos de supervisión y ordena que cualquier restricción de derechos sea necesaria, proporcional y debidamente documentada.</div>

        <h3>1. EL ESTADO CONSTITUCIONAL DE DERECHO</h3>
        <p>El Estado Constitucional de Derecho representa una forma de organización política en la que el poder público se encuentra jurídicamente limitado por la Constitución, los derechos fundamentales y los mecanismos de control. Para la función policial, este modelo implica que la eficacia operativa debe alcanzarse dentro de parámetros de legalidad, respeto a la dignidad humana y responsabilidad institucional.</p>

        <h4>1.1. Concepto</h4>
        <p>El Estado Constitucional de Derecho es el sistema político-jurídico en el que la Constitución posee fuerza normativa, organiza los órganos del poder, reconoce derechos y establece controles frente a posibles abusos.</p>

        <h4>1.2. Características</h4>
        <p>Sus características centrales son la supremacía constitucional, la separación y coordinación de funciones estatales, el reconocimiento de derechos fundamentales, el control de constitucionalidad, la responsabilidad de los servidores públicos y la existencia de garantías jurisdiccionales.</p>

        <h4>1.3. Principios fundamentales</h4>
        <p>Los principios fundamentales orientan la interpretación de la Constitución y el ejercicio de todas las competencias públicas. Entre ellos destacan la dignidad humana, la libertad, la igualdad, la justicia, la legalidad, la seguridad jurídica, la responsabilidad y el control del poder.</p>

        <h4>1.4. Supremacía constitucional</h4>
        <p>La supremacía constitucional significa que la Constitución ocupa la posición superior del ordenamiento jurídico y que toda norma, acto administrativo, orden institucional o actuación material debe ser compatible con ella.</p>

        <h3>2. CONSTITUCIÓN POLÍTICA DEL ESTADO</h3>
        <p>La Constitución Política del Estado es la norma fundamental que estructura el poder público, reconoce derechos, define los fines estatales y establece el marco de actuación de las instituciones. Para la Policía Boliviana, constituye la fuente primaria de legitimidad, competencia y responsabilidad.</p>

        <h4>2.1. Estructura</h4>
        <p>La estructura constitucional organiza sistemáticamente sus contenidos en disposiciones relativas a bases fundamentales, derechos, garantías, organización funcional y territorial del Estado, régimen económico y mecanismos de reforma.</p>

        <h4>2.2. Valores</h4>
        <p>Los valores constitucionales expresan ideales superiores que orientan la convivencia y la acción estatal, como la justicia, la igualdad, la libertad, la solidaridad, la dignidad, la unidad y la paz social.</p>

        <h4>2.3. Principios</h4>
        <p>Los principios constitucionales son mandatos de optimización que orientan la creación, interpretación y aplicación de las normas. Entre ellos se encuentran legalidad, igualdad, pluralismo, seguridad jurídica, responsabilidad y respeto a los derechos.</p>

        <h4>2.4. Fines esenciales del Estado</h4>
        <p>Los fines esenciales del Estado comprenden la protección de la persona, la preservación de la convivencia, la realización de la justicia, la seguridad, el bienestar colectivo y el cumplimiento de los derechos.</p>

        <h3>3. PRINCIPIOS CONSTITUCIONALES QUE RIGEN LA FUNCIÓN POLICIAL</h3>
        <p>Los principios constitucionales constituyen criterios obligatorios para toda actuación policial. Permiten verificar no solo si existe competencia legal, sino también si la decisión fue justa, adecuada, motivada y respetuosa de los derechos.</p>

        <h4>3.1. Legalidad</h4>
        <p>La legalidad exige que toda actuación policial se encuentre autorizada por una norma vigente, sea ejecutada por autoridad competente y respete el procedimiento establecido.</p>

        <h4>3.2. Igualdad</h4>
        <p>La igualdad impone brindar protección y aplicar la ley sin discriminación, pero también adoptar medidas diferenciadas cuando existan condiciones objetivas de vulnerabilidad.</p>

        <h4>3.3. Seguridad jurídica</h4>
        <p>La seguridad jurídica consiste en la previsibilidad de las normas y de la actuación estatal. Exige procedimientos claros, decisiones motivadas, registros confiables y respeto a las competencias.</p>

        <h4>3.4. Debido proceso</h4>
        <p>El debido proceso reúne garantías destinadas a impedir decisiones arbitrarias, entre ellas derecho a defensa, autoridad competente, presunción de inocencia, motivación, plazo razonable y respeto al procedimiento.</p>

        <h4>3.5. Proporcionalidad</h4>
        <p>La proporcionalidad exige que toda medida restrictiva sea idónea para el fin legítimo, necesaria frente a alternativas menos gravosas y equilibrada respecto del beneficio esperado.</p>

        <h4>3.6. Razonabilidad</h4>
        <p>La razonabilidad exige que las decisiones se apoyen en hechos verificables, criterios objetivos y una relación lógica entre problema, finalidad y medida.</p>

        <h3>4. DERECHOS FUNDAMENTALES Y GARANTÍAS CONSTITUCIONALES</h3>
        <p>Los derechos fundamentales protegen ámbitos esenciales de la persona y delimitan el ejercicio del poder estatal. Las garantías constitucionales proporcionan mecanismos para prevenir, detener o reparar vulneraciones.</p>

        <h4>4.1. Derechos civiles</h4>
        <p>Los derechos civiles comprenden vida, integridad, libertad, privacidad, honra, propiedad, circulación y otras facultades vinculadas con la autonomía personal.</p>

        <h4>4.2. Derechos políticos</h4>
        <p>Los derechos políticos permiten participar en la formación y control del poder público mediante voto, organización, deliberación y acceso a funciones públicas.</p>

        <h4>4.3. Derechos sociales</h4>
        <p>Los derechos sociales buscan condiciones materiales de vida digna y comprenden salud, educación, trabajo, vivienda, seguridad social y protección de grupos vulnerables.</p>

        <h4>4.4. Garantías constitucionales</h4>
        <p>Las garantías constitucionales son procedimientos y mecanismos de protección que permiten reclamar frente a actos u omisiones que lesionen derechos.</p>

        <h3>5. INTRODUCCIÓN AL DERECHO</h3>
        <p>La introducción al Derecho proporciona las categorías necesarias para comprender normas, instituciones, fuentes, sujetos, deberes y consecuencias jurídicas.</p>

        <h4>5.1. Concepto</h4>
        <p>El Derecho es el conjunto sistemático de normas, principios e instituciones que regulan la convivencia, atribuyen facultades, imponen deberes y establecen mecanismos para resolver conflictos.</p>

        <h4>5.2. Finalidad</h4>
        <p>La finalidad del Derecho es ordenar la convivencia, prevenir conflictos, proteger bienes jurídicos, proporcionar seguridad y realizar valores como justicia e igualdad.</p>

        <h4>5.3. Características</h4>
        <p>El Derecho se caracteriza por su bilateralidad, heteronomía, coercibilidad, generalidad, obligatoriedad e institucionalidad.</p>

        <h4>5.4. Clasificación</h4>
        <p>El Derecho puede clasificarse en público y privado, interno e internacional, sustantivo y adjetivo, entre otras categorías.</p>

        <h4>5.5. Fuentes del Derecho</h4>
        <p>Las fuentes del Derecho son los procesos y formas de producción, manifestación e interpretación de las normas, como Constitución, ley, reglamento, jurisprudencia, costumbre y doctrina.</p>

        <h3>6. EL ORDENAMIENTO JURÍDICO BOLIVIANO</h3>
        <p>El ordenamiento jurídico boliviano es el sistema organizado de normas, principios, instituciones y procedimientos vigentes en el Estado.</p>

        <h4>6.1. Jerarquía normativa</h4>
        <p>La jerarquía normativa ordena las disposiciones según su fuerza jurídica. Una norma inferior no puede modificar ni contradecir a otra superior.</p>

        <h4>6.2. Pirámide normativa</h4>
        <p>La pirámide normativa representa gráficamente la organización escalonada del Derecho: en la cúspide se encuentra la Constitución y, en niveles inferiores, las leyes, reglamentos y actos particulares.</p>

        <h4>6.3. Control de constitucionalidad</h4>
        <p>El control de constitucionalidad verifica que normas y actos se ajusten a la Constitución.</p>

        <h4>6.4. Bloque de constitucionalidad</h4>
        <p>El bloque de constitucionalidad integra normas y principios que, aun no estar contenidos materialmente en el texto constitucional, sirven como parámetro superior de validez e interpretación.</p>

        <h3>7. INTERPRETACIÓN Y APLICACIÓN DE LA LEY</h3>
        <p>Interpretar y aplicar la ley supone identificar su significado, vigencia, ámbito y relación con otras normas.</p>

        <h4>7.1. Interpretación jurídica</h4>
        <p>La interpretación jurídica determina el sentido y alcance de una norma mediante criterios gramaticales, sistemáticos, históricos, teleológicos y constitucionales.</p>

        <h4>7.2. Vigencia de la ley</h4>
        <p>La vigencia indica el periodo durante el cual una ley produce efectos obligatorios.</p>

        <h4>7.3. Ámbito espacial</h4>
        <p>El ámbito espacial determina el territorio o jurisdicción en el que una norma es aplicable.</p>

        <h4>7.4. Ámbito temporal</h4>
        <p>El ámbito temporal define qué norma corresponde aplicar según el momento en que ocurrió el hecho y las reglas sobre retroactividad, ultraactividad y sucesión normativa.</p>

        <h4>7.5. Integración jurídica</h4>
        <p>La integración jurídica permite resolver lagunas mediante analogía, principios generales, jurisprudencia y criterios sistemáticos.</p>

        <h3>8. ACTO JURÍDICO Y HECHO JURÍDICO</h3>
        <p>El acto jurídico y el hecho jurídico explican cómo determinados acontecimientos producen consecuencias reconocidas por el Derecho.</p>

        <h4>8.1. Conceptos</h4>
        <p>El hecho jurídico es un acontecimiento natural o humano al que la norma atribuye consecuencias. El acto jurídico es una manifestación de voluntad dirigida a producir efectos jurídicos reconocidos por el ordenamiento.</p>

        <h4>8.2. Diferencias</h4>
        <p>La diferencia central reside en la voluntad orientada a generar consecuencias jurídicas.</p>

        <h4>8.3. Efectos jurídicos</h4>
        <p>Los efectos jurídicos consisten en crear, modificar, transmitir o extinguir derechos, deberes, competencias y responsabilidades.</p>

        <h3>9. FUNCIÓN PÚBLICA POLICIAL</h3>
        <p>La función pública policial es una actividad estatal permanente destinada a proteger a la sociedad, conservar el orden, hacer cumplir la ley y auxiliar a la población.</p>

        <h4>9.1. Naturaleza jurídica</h4>
        <p>La naturaleza jurídica de la función policial es pública, institucional, reglada y orientada al interés general.</p>

        <h4>9.2. Finalidad constitucional</h4>
        <p>La finalidad constitucional consiste en defender a la sociedad, preservar el orden público, garantizar el cumplimiento de las leyes y contribuir a la seguridad.</p>

        <h4>9.3. Principios institucionales</h4>
        <p>Los principios institucionales orientan disciplina, jerarquía, unidad de mando, profesionalismo, servicio, legalidad, imparcialidad y responsabilidad.</p>

        <h4>9.4. Servicio a la sociedad</h4>
        <p>El servicio a la sociedad exige disponibilidad, trato digno, orientación, auxilio y respuesta oportuna.</p>

        <h3>10. DEBERES, OBLIGACIONES Y RESPONSABILIDADES DEL SERVIDOR PÚBLICO POLICIAL</h3>
        <p>El servidor policial está sujeto a deberes constitucionales, obligaciones legales y regímenes de responsabilidad que garantizan disciplina, legalidad y reparación.</p>

        <h4>10.1. Deberes constitucionales</h4>
        <p>Los deberes constitucionales comprenden respetar y proteger derechos, cumplir la Constitución, servir al interés general, actuar con imparcialidad y someterse al control.</p>

        <h4>10.2. Obligaciones legales</h4>
        <p>Las obligaciones legales desarrollan deberes específicos sobre procedimiento, custodia, documentación, preservación de evidencia, comunicación y cooperación con autoridades.</p>

        <h4>10.3. Responsabilidad administrativa</h4>
        <p>La responsabilidad administrativa deriva del incumplimiento de normas de gestión, control, uso de recursos y desempeño de funciones.</p>

        <h4>10.4. Responsabilidad disciplinaria</h4>
        <p>La responsabilidad disciplinaria surge por infracciones al régimen interno, deberes profesionales, disciplina y ética institucional.</p>

        <h4>10.5. Responsabilidad penal</h4>
        <p>La responsabilidad penal se configura cuando la conducta del servidor reúne los elementos de un delito.</p>

        <h4>10.6. Responsabilidad civil</h4>
        <p>La responsabilidad civil busca reparar daños patrimoniales o extrapatrimoniales causados por conducta ilícita.</p>

        <h3>11. USO LEGÍTIMO DE LA FUERZA Y APLICACIÓN DE LA LEY</h3>
        <p>El uso de la fuerza es una facultad excepcional orientada a cumplir una finalidad legal cuando otros medios resultan insuficientes. Su legitimidad depende de legalidad, necesidad, proporcionalidad, precaución, control y rendición de cuentas.</p>

        <h4>11.1. Principio de legalidad</h4>
        <p>La legalidad en el uso de la fuerza exige competencia, finalidad legítima y empleo de medios autorizados. La fuerza nunca puede utilizarse como castigo, represalia o intimidación.</p>

        <h4>11.2. Necesidad</h4>
        <p>La necesidad exige que la fuerza sea indispensable para alcanzar el objetivo y que no exista una alternativa menos lesiva eficaz.</p>

        <h4>11.3. Proporcionalidad</h4>
        <p>La proporcionalidad relaciona la intensidad de la fuerza con el nivel de amenaza, resistencia y bien protegido.</p>

        <h4>11.4. Rendición de cuentas</h4>
        <p>La rendición de cuentas exige registro, explicación, supervisión, investigación y corrección de toda intervención con fuerza.</p>

        <h3>12. ÉTICA, INTEGRIDAD Y TRANSPARENCIA EN LA FUNCIÓN POLICIAL</h3>
        <p>La ética pública orienta el ejercicio de la autoridad hacia el bien común y complementa la obligación jurídica.</p>

        <h4>12.1. Ética pública</h4>
        <p>La ética pública exige actuar con honestidad, imparcialidad, respeto, responsabilidad y prioridad del interés general.</p>

        <h4>12.2. Valores institucionales</h4>
        <p>Los valores institucionales consolidan identidad profesional y orientan decisiones: disciplina, honor, lealtad constitucional, servicio, valentía, solidaridad y respeto.</p>

        <h4>12.3. Probidad</h4>
        <p>La probidad consiste en administrar autoridad, información y recursos con rectitud, evitando conflictos de interés y beneficios indebidos.</p>

        <h4>12.4. Lucha contra la corrupción</h4>
        <p>La lucha contra la corrupción combina prevención, controles, transparencia, denuncia, investigación y sanción.</p>

        <h3>13. RÉGIMEN CONSTITUCIONAL DE LA POLICÍA BOLIVIANA</h3>
        <p>El régimen constitucional define la posición, misión, funciones y organización de la Policía Boliviana dentro del Estado.</p>

        <h4>13.1. Base constitucional</h4>
        <p>La base constitucional otorga existencia jurídica, legitimidad y límites a la institución.</p>

        <h4>13.2. Misión constitucional</h4>
        <p>La misión constitucional orienta la defensa de la sociedad, conservación del orden y cumplimiento de las leyes.</p>

        <h4>13.3. Funciones</h4>
        <p>Las funciones comprenden prevención, auxilio, mantenimiento del orden, investigación, control y cooperación con otras autoridades, según competencia.</p>

        <h4>13.4. Organización</h4>
        <p>La organización policial se estructura mediante jerarquía, unidades, especialidades, mando y coordinación territorial.</p>

        <h4>13.5. Relación con la sociedad</h4>
        <p>La relación con la sociedad debe basarse en confianza, proximidad, transparencia, respeto y cooperación.</p>

        <h3>14. SEGURIDAD CIUDADANA Y FUNCIÓN POLICIAL</h3>
        <p>La seguridad ciudadana es una condición de convivencia en la que las personas pueden ejercer derechos con riesgos razonablemente controlados.</p>

        <h4>14.1. Concepto</h4>
        <p>La seguridad ciudadana comprende prevención y reducción de violencia, delito y riesgos que afectan la convivencia.</p>

        <h4>14.2. Corresponsabilidad</h4>
        <p>La corresponsabilidad reconoce que la seguridad requiere participación coordinada de instituciones públicas, gobiernos territoriales, comunidad, familias y sector privado.</p>

        <h4>14.3. Prevención</h4>
        <p>La prevención busca anticipar riesgos, reducir oportunidades y fortalecer factores protectores mediante acciones sociales, situacionales, comunitarias e institucionales.</p>

        <h4>14.4. Participación ciudadana</h4>
        <p>La participación ciudadana permite identificar problemas, definir prioridades, controlar resultados y construir soluciones compartidas.</p>

        <h4>14.5. Policía Comunitaria</h4>
        <p>La Policía Comunitaria es un modelo de proximidad basado en alianzas, resolución de problemas, confianza y prevención.</p>

        <h3>15. CONCLUSIÓN</h3>
        <p>Los fundamentos jurídicos de la función policial demuestran que la autoridad legítima no se define únicamente por la capacidad de imponer decisiones, sino por la obligación de actuar dentro de la Constitución, respetar los derechos fundamentales y responder por los resultados de cada intervención. El Estado Constitucional de Derecho convierte la legalidad, la igualdad, la seguridad jurídica, el debido proceso, la proporcionalidad y la razonabilidad en criterios operativos que deben estar presentes desde la planificación hasta la evaluación del servicio.</p>
        <div class="ejemplo-practico"><strong>Ejemplo práctico:</strong> Durante una intervención preventiva en una concentración pública, el personal aplica la normativa constitucional, respeta los derechos de las personas, utiliza únicamente medidas necesarias y proporcionales, documenta sus decisiones y coordina con la comunidad y otras instituciones para mantener la seguridad sin apartarse de la legalidad.</div>

        <h1>UNIDAD TEMÁTICA No. 8</h1>
        <h2>DERECHOS HUMANOS Y FUNCIÓN POLICIAL</h2>
        <h3>I. INTRODUCCIÓN</h3>
        <p>Los derechos humanos aplicados a la función policial constituyen el marco ético, jurídico y operativo que orienta toda actuación destinada a prevenir el delito, mantener el orden público, proteger a las personas y hacer cumplir la ley. Su incorporación en la formación policial no debe limitarse al conocimiento declarativo de normas, sino traducirse en criterios concretos para planificar intervenciones, efectuar controles, practicar aprehensiones, custodiar personas, gestionar conflictos y emplear la fuerza. En este sentido, la legitimidad institucional depende de que cada decisión policial respete la dignidad humana, reduzca riesgos previsibles y pueda ser explicada y justificada conforme a la legalidad. Según el Comité Internacional de la Cruz Roja (CICR, s. f.), las reglas y normas internacionales aplicables a la función policial vinculan el ejercicio de las facultades coercitivas con obligaciones permanentes de respeto, protección y garantía de los derechos humanos.</p>
        <p>La unidad articula tres dimensiones interdependientes: la evolución histórica y los sistemas de protección; la atención diferenciada a grupos en situación de vulnerabilidad; y la regulación ética y normativa del uso de la fuerza.</p>
        <div class="ejemplo-practico"><strong>Ejemplo práctico:</strong> Durante un control policial en una terminal terrestre, el personal identifica a una adolescente desorientada, a una persona con discapacidad auditiva y a un ciudadano que se resiste verbalmente a la identificación. La intervención adecuada exige adaptar la comunicación, priorizar medidas de protección, evitar respuestas discriminatorias y utilizar únicamente el nivel de coerción indispensable, documentando las decisiones adoptadas.</div>

        <h3>II. DERECHOS HUMANOS: HISTORIA Y SISTEMA</h3>
        <p>La historia y los sistemas de derechos humanos explican cómo la dignidad humana pasó de constituir una aspiración ética a convertirse en un conjunto de obligaciones jurídicas exigibles frente al poder público. Este eje vincula antecedentes históricos, instrumentos universales y regionales, instituciones de protección y garantías nacionales, permitiendo comprender que la actuación policial está sometida simultáneamente a la Constitución, la ley y los estándares internacionales. Según la Organización de las Naciones Unidas (ONU, 1948), el reconocimiento de la dignidad y de los derechos iguales e inalienables de todas las personas constituye la base de la libertad, la justicia y la paz.</p>
        <div class="ejemplo-practico"><strong>Ejemplo práctico:</strong> En una intervención por presunta comisión de un delito, el funcionario policial informa el motivo de la actuación, respeta la presunción de inocencia, evita tratos humillantes y garantiza el acceso a mecanismos de reclamación.</div>

        <h4>1. ANTECEDENTES Y EVOLUCIÓN HISTÓRICA</h4>
        <p>La evolución de los derechos humanos expresa un proceso progresivo de limitación del poder y reconocimiento de la dignidad inherente a toda persona. Los antecedentes históricos muestran que las libertades y garantías no surgieron de manera inmediata ni uniforme, sino como resultado de conflictos sociales, transformaciones políticas y acuerdos jurídicos que ampliaron gradualmente la protección frente a la arbitrariedad.</p>

        <h4>1.1.1. Ámbito universal: Cilindro de Ciro, Carta Magna, Declaración de 1789 y Declaración Universal de los Derechos Humanos (1948)</h4>
        <p>En el ámbito universal, el Cilindro de Ciro suele estudiarse como un antecedente remoto de tolerancia y liberación; la Carta Magna como un límite inicial al poder monárquico; la Declaración de los Derechos del Hombre y del Ciudadano de 1789 como afirmación de libertad, igualdad y soberanía; y la Declaración Universal de 1948 como formulación contemporánea de derechos aplicables a todas las personas.</p>

        <h4>1.1.2. Ámbito nacional: Revolución de 1952, periodos dictatoriales, retorno a la democracia y Constitución Política del Estado de 2009</h4>
        <p>En Bolivia, la construcción histórica de los derechos humanos se relaciona con la ampliación de la ciudadanía, las reformas sociales posteriores a 1952, las graves restricciones ocurridas durante periodos dictatoriales, la recuperación democrática y la consolidación de un modelo constitucional orientado a la dignidad, la igualdad y el pluralismo.</p>

        <h4>2. DECLARACIÓN UNIVERSAL DE LOS DERECHOS HUMANOS Y SUS GENERACIONES</h4>
        <p>La Declaración Universal de los Derechos Humanos constituye un referente común para comprender la integralidad de los derechos. La clasificación por generaciones posee una finalidad didáctica: permite observar la aparición histórica de derechos civiles y políticos; económicos, sociales y culturales; y derechos de solidaridad, colectivos y tecnológicos.</p>

        <h4>2.1. Derechos civiles y políticos</h4>
        <p>Los derechos civiles y políticos protegen la vida, integridad, libertad, seguridad, privacidad, igualdad ante la ley, debido proceso, libertad de expresión, reunión y participación pública.</p>

        <h4>2.2. Derechos económicos, sociales y culturales</h4>
        <p>Los derechos económicos, sociales y culturales comprenden, entre otros, trabajo, salud, educación, seguridad social, alimentación, vivienda y participación cultural.</p>

        <h4>2.3. Derechos de solidaridad y tecnológicos</h4>
        <p>Los derechos de solidaridad abarcan intereses colectivos como la paz, el desarrollo, el ambiente y la protección de los pueblos; los derechos tecnológicos responden a desafíos asociados con datos personales, vigilancia, inteligencia artificial y seguridad digital.</p>

        <h4>2.4. Derechos en progreso</h4>
        <p>La expresión "en progreso" alude al carácter dinámico del reconocimiento y desarrollo de los derechos humanos.</p>

        <h3>3. MECANISMOS DE PROTECCIÓN</h3>
        <p>Los mecanismos de protección son procedimientos e instituciones destinados a prevenir, investigar, reparar y evitar la repetición de vulneraciones.</p>

        <h4>3.1. Sistemas internacionales: Sistema Universal (ONU) y Sistemas Regionales</h4>
        <p>El Sistema Universal, desarrollado en el marco de la ONU, comprende tratados, comités, procedimientos especiales y mecanismos de revisión. Los sistemas regionales adaptan la protección a contextos geográficos específicos: el interamericano mediante la Comisión y la Corte Interamericanas; el europeo mediante el Convenio Europeo; el africano a través de la Carta de Banjul; y el árabe por medio de su carta regional.</p>

        <h4>3.2. Sistema nacional: Defensoría del Pueblo y Garantías Jurisdiccionales</h4>
        <p>El sistema nacional articula instituciones de control y garantías jurisdiccionales para responder frente a amenazas o vulneraciones.</p>

        <h3>4. PROHIBICIÓN ABSOLUTA DE LA TORTURA</h3>
        <p>La tortura está prohibida de manera absoluta. Ninguna emergencia, orden superior, sospecha delictiva, necesidad investigativa o presión operativa puede justificarla.</p>
        <div class="ejemplo-practico"><strong>Ejemplo práctico:</strong> Un investigador se niega a golpear o amenazar a un sospechoso para obtener una confesión, informa al superior de la orden ilícita y emplea técnicas legales de entrevista, preservando el derecho al silencio y la integridad.</div>

        <h3>5. APLICACIÓN ESTRICTA DE NORMATIVAS INTERNACIONALES CONTRA LA TORTURA Y LOS TRATOS CRUELES, INHUMANOS O DEGRADANTES</h3>
        <p>La aplicación estricta de la normativa internacional exige prevención operativa, supervisión, registro de custodia, examen médico, acceso a defensa, condiciones dignas de detención e investigación pronta e imparcial.</p>

        <h4>5.1. Grupos en situación de vulnerabilidad y enfoque de género</h4>
        <p>Los grupos en situación de vulnerabilidad requieren una actuación policial diferenciada porque determinadas condiciones personales, sociales, económicas, etarias, culturales o de género pueden incrementar la exposición a discriminación, violencia, exclusión o barreras de acceso a la justicia.</p>

        <h3>6. PROTECCIÓN A POBLACIONES ESPECÍFICAS</h3>
        <p>La protección diferenciada parte del principio de igualdad material: tratar de forma idéntica situaciones desiguales puede reproducir exclusión.</p>

        <h4>6.1.1. Niñez y adolescencia: aplicación de la Convención sobre los Derechos del Niño</h4>
        <p>La intervención con niñas, niños y adolescentes debe regirse por interés superior, no discriminación, derecho a ser escuchados, supervivencia y desarrollo.</p>

        <h4>6.1.2. Comunidad LGTB: garantía de los derechos a la identidad y al libre desarrollo de la personalidad</h4>
        <p>La protección de personas lesbianas, gais, bisexuales y trans exige garantizar identidad, privacidad, igualdad y libre desarrollo de la personalidad.</p>

        <h4>6.1.3. Personas con discapacidad: promoción de la accesibilidad, inclusión social e igualdad de oportunidades</h4>
        <p>La protección de personas con discapacidad requiere accesibilidad física, comunicacional y procedimental, así como ajustes razonables.</p>

        <h4>6.1.4. Adultos mayores: cobertura de seguridad de ingresos y vida digna</h4>
        <p>Las personas adultas mayores tienen derecho a seguridad, salud, autonomía y vida digna.</p>

        <h4>6.1.5. Mujeres e igualdad de género: marco de la CEDAW e instrumentos regionales</h4>
        <p>El enfoque de género permite identificar desigualdades, relaciones de poder y patrones de violencia que afectan de manera desproporcionada a las mujeres.</p>

        <h4>6.2. Uso de la fuerza y mantenimiento del orden público</h4>
        <p>El uso de la fuerza y el mantenimiento del orden público constituyen ámbitos de especial responsabilidad estatal, debido a que implican la posibilidad de restringir derechos y generar afectaciones a la integridad personal.</p>

        <h3>7. MARCO ÉTICO Y NORMATIVO</h3>
        <p>El uso de la fuerza es una facultad excepcional vinculada al deber de proteger la vida, hacer cumplir la ley y restablecer el orden. Su legitimidad depende de un marco ético y normativo que determine cuándo, cómo y hasta dónde puede intervenir la Policía.</p>

        <h4>7.1.1. Principios policiales de Robert Peel</h4>
        <p>Los principios atribuidos a Robert Peel destacan que la misión policial es prevenir el delito y el desorden; que la eficacia depende de la cooperación pública; y que la fuerza debe emplearse solo cuando la persuasión, el consejo y la advertencia resulten insuficientes.</p>

        <h4>7.1.2. Código de Conducta para Funcionarios Encargados de Hacer Cumplir la Ley (FEHCL)</h4>
        <p>El Código de Conducta establece deberes de servicio a la comunidad, protección de la dignidad, respeto de derechos, uso excepcional de la fuerza, confidencialidad, atención médica, prohibición de corrupción y deber de informar violaciones.</p>

        <h3>8. PRINCIPIOS DEL USO DE LA FUERZA</h3>
        <p>Los principios del uso de la fuerza constituyen criterios acumulativos: legalidad, necesidad, proporcionalidad, precaución, diferenciación y rendición de cuentas.</p>
        <div class="ejemplo-practico"><strong>Ejemplo práctico:</strong> Para detener a una persona agresiva con un objeto contundente, los policías establecen distancia, dan órdenes claras, utilizan cobertura y medios menos letales disponibles; cesan la fuerza cuando la amenaza queda controlada y prestan asistencia.</div>

        <h3>9. LEGALIDAD: FUNDAMENTACIÓN ESTRICTA EN LA NORMATIVA LEGAL VIGENTE</h3>
        <p>La legalidad exige que toda fuerza tenga base normativa, persiga un objetivo legítimo y sea ejecutada por personal competente mediante medios autorizados.</p>

        <h3>10. NECESIDAD: APLICACIÓN ÚNICAMENTE CUANDO LOS MEDIOS NO LETALES O PERSUASIVOS RESULTEN INEFICACES</h3>
        <p>La necesidad implica que la fuerza solo puede utilizarse cuando otros medios razonables sean ineficaces o no ofrezcan posibilidad real de alcanzar el objetivo.</p>

        <h3>11. PROPORCIONALIDAD: EQUILIBRIO ENTRE LA GRAVEDAD DE LA AMENAZA O RESISTENCIA Y EL NIVEL DE FUERZA APLICADO</h3>
        <p>La proporcionalidad exige equilibrio entre la gravedad de la amenaza o resistencia, el objetivo legítimo y el nivel de fuerza.</p>

        <h3>III. USO DIFERENCIADO Y PROGRESIVO</h3>
        <p>El uso diferenciado y progresivo es un modelo de decisión operacional que relaciona el nivel de cooperación, resistencia o agresión con la respuesta policial razonablemente necesaria.</p>

        <h3>12. RESPUESTA GRADUAL DE LA FUERZA, PRIORIZANDO EL EMPLEO DE MEDIOS Y ARMAMENTOS MENOS LETALES</h3>
        <p>El uso diferenciado y progresivo organiza opciones de intervención según conducta, amenaza y contexto, priorizando presencia, comunicación, control y medios menos letales.</p>

        <h3>13. MODELO DE INTERVENCIÓN POLICIAL QUE GRADÚA EL NIVEL DE FUERZA</h3>
        <p>El modelo de intervención policial relaciona la percepción de riesgo, la conducta del sujeto y las opciones tácticas disponibles.</p>

        <h3>14. GESTIÓN DE CONFLICTOS Y CONTROL DE MULTITUDES</h3>
        <p>La gestión de conflictos busca prevenir escalamiento mediante información, negociación, comunicación y coordinación.</p>

        <h3>15. CLASIFICACIÓN Y DIFERENCIACIÓN ENTRE AGLOMERACIÓN, MULTITUD Y DISTURBIOS</h3>
        <p>Una aglomeración es una concentración circunstancial de personas sin coordinación significativa; una multitud presenta interacción, finalidad o identidad compartida; y un disturbio implica conductas que alteran gravemente el orden, pudiendo ser leve o grave según violencia, daños, armas y riesgo.</p>

        <h3>16. INTERVENCIÓN TÁCTICA ORIENTADA AL RESTABLECIMIENTO DEL ORDEN PÚBLICO CON RESPETO IRRESTRICTO A LOS DERECHOS HUMANOS</h3>
        <p>La intervención táctica debe perseguir un objetivo legítimo, controlar riesgos y restablecer el orden con el menor daño posible.</p>

        <h3>17. CONCLUSIÓN</h3>
        <p>Los derechos humanos aplicados a la función policial constituyen una estructura práctica de decisión que vincula historia, normas, protección diferenciada, ética profesional y empleo legítimo de la fuerza. La evolución universal y nacional demuestra que el poder estatal adquiere legitimidad cuando se somete a límites, controles y garantías.</p>
        <div class="ejemplo-practico"><strong>Ejemplo práctico:</strong> Ante una persona alterada que no porta armas ni agrede, el personal prioriza comunicación y contención, mantiene distancia de seguridad y emplea únicamente el nivel de fuerza estrictamente necesario si la situación escala, justificando cada medida según legalidad, necesidad, proporcionalidad y respeto a la dignidad humana.</div>

        <h1>UNIDAD TEMÁTICA No. 9</h1>
        <h2>DERECHO PENAL Y DERECHO PROCESAL PENAL APLICADOS A LA FUNCIÓN POLICIAL</h2>
        <h3>INTRODUCCIÓN</h3>
        <p>La actuación policial dentro del sistema penal exige mucho más que capacidad operativa: requiere conocimiento jurídico, disciplina procedimental y comprensión de los límites que protegen la dignidad humana. El Derecho Penal identifica las conductas prohibidas y sus consecuencias, mientras que el Derecho Procesal Penal establece el camino legítimo para investigar, acusar y juzgar.</p>
        <p>Según Bolivia (1999), el Código de Procedimiento Penal organiza la investigación penal mediante reglas que vinculan la intervención policial con la dirección funcional del Ministerio Público, el control jurisdiccional y el respeto de las garantías de las partes.</p>
        <p>Esto nos quiere decir que el trabajo policial debe reunir simultáneamente tres condiciones: oportunidad para impedir daños y asegurar indicios; legalidad para evitar arbitrariedades; y calidad técnica para que las actuaciones sean comprensibles, reproducibles y útiles en las etapas posteriores.</p>
        <div class="ejemplo-practico"><strong>Ejemplo práctico:</strong> Una patrulla llega a un comercio donde se reporta un robo. Primero protege a las personas y neutraliza riesgos; luego delimita el lugar, identifica testigos, comunica al fiscal, registra indicios y aprehende únicamente si concurren presupuestos legales. Durante todo el procedimiento informa derechos, evita afirmaciones de culpabilidad y documenta cada actuación.</div>

        <h3>1. FUNDAMENTOS DEL DERECHO PENAL Y DEL DERECHO PROCESAL PENAL</h3>
        <p>Este eje establece la base conceptual que permite distinguir el contenido sustantivo del Derecho Penal de las reglas procesales que hacen posible su aplicación legítima.</p>
        <p>Según Zaffaroni (s. f.), el poder punitivo debe someterse a categorías y límites que permitan distinguir la intervención legítima de la arbitrariedad.</p>

        <h4>1.1. Concepto y función del Derecho Penal</h4>
        <p>El Derecho Penal es el conjunto de normas que define las conductas consideradas delitos, establece consecuencias jurídicas y fija límites al poder punitivo del Estado.</p>

        <h4>1.2. Concepto y función del Derecho Procesal Penal</h4>
        <p>El Derecho Procesal Penal regula los actos, etapas, sujetos, plazos y garantías mediante los cuales se investiga un hecho, se determina la responsabilidad y se ejecutan las decisiones judiciales.</p>

        <h4>1.3. Relación entre ambos y su importancia en la función policial</h4>
        <p>El Derecho Penal determina qué conductas pueden ser sancionadas, mientras que el Derecho Procesal Penal establece cómo deben investigarse y juzgarse. Ambos se complementan: sin norma penal no existe delito definido; sin proceso válido no puede imponerse legítimamente una consecuencia.</p>

        <h3>2. PRINCIPIOS RECTORES APLICABLES A LA ACTUACIÓN POLICIAL</h3>
        <p>Los principios rectores son límites y orientaciones obligatorias que aseguran que la intervención policial sea legítima, racional y compatible con el Estado constitucional de derecho.</p>

        <h4>2.1. Principio de legalidad</h4>
        <p>El principio de legalidad exige que toda intervención policial tenga fundamento en una norma previa, clara y aplicable.</p>

        <h4>2.2. Presunción de inocencia</h4>
        <p>La presunción de inocencia obliga a tratar a toda persona como no culpable mientras no exista sentencia firme.</p>

        <h4>2.3. Debido proceso</h4>
        <p>El debido proceso comprende el conjunto de garantías que aseguran una investigación y un juzgamiento imparciales.</p>

        <h4>2.4. Objetividad e imparcialidad</h4>
        <p>La objetividad exige investigar tanto los elementos que apoyan una hipótesis incriminatoria como aquellos que pueden descartarla o favorecer al investigado.</p>

        <h4>2.5. Proporcionalidad e intervención mínima</h4>
        <p>La proporcionalidad exige que la intensidad de la actuación policial guarde relación con el riesgo, la gravedad del hecho y la finalidad perseguida.</p>

        <h4>2.6. Non bis in idem</h4>
        <p>El principio non bis in idem prohíbe perseguir o sancionar penalmente dos veces a una misma persona por el mismo hecho y con el mismo fundamento.</p>

        <h4>2.7. Respeto a los Derechos Humanos</h4>
        <p>El respeto a los Derechos Humanos atraviesa toda la función policial: protección de la vida e integridad, prohibición de tortura, trato digno, igualdad, privacidad y acceso a garantías.</p>

        <h4>2.8. Legalidad de la prueba</h4>
        <p>La legalidad de la prueba exige que los elementos de convicción sean obtenidos, preservados y documentados sin vulnerar derechos ni desconocer procedimientos.</p>

        <h3>3. LA FUNCIÓN POLICIAL DENTRO DEL PROCESO PENAL</h3>
        <p>La función policial en el proceso penal comprende tareas preventivas, investigativas, técnicas y de protección, desarrolladas bajo dirección funcional del Ministerio Público y control jurisdiccional.</p>

        <h4>3.1. La Policía Boliviana como órgano auxiliar del Ministerio Público</h4>
        <p>En la investigación penal, la Policía actúa como órgano auxiliar del Ministerio Público, ejecutando diligencias bajo dirección funcional fiscal.</p>

        <h4>3.2. Prevención del delito y protección de víctimas</h4>
        <p>La prevención del delito comprende acciones destinadas a evitar la consumación, reducir riesgos y neutralizar amenazas; la protección de víctimas busca impedir nuevas agresiones, facilitar atención y preservar su participación procesal.</p>

        <h4>3.3. Conservación del lugar del hecho y recolección de indicios</h4>
        <p>La conservación del lugar del hecho evita alteraciones, contaminación o pérdida de información.</p>

        <h4>3.4. Identificación de autores y partícipes</h4>
        <p>La identificación de autores y partícipes requiere establecer quién ejecutó la conducta, quién determinó su realización y quién prestó colaboración relevante.</p>

        <h4>3.5. Aprehensión en flagrancia</h4>
        <p>La aprehensión en flagrancia es una intervención inmediata frente a una persona sorprendida durante la comisión del hecho o en circunstancias próximas que la vinculan directamente.</p>

        <h4>3.6. Ejecución de actos investigativos ordenados por el Fiscal</h4>
        <p>Los actos ordenados por el fiscal deben ejecutarse con precisión, oportunidad y apego al alcance de la instrucción.</p>

        <h4>3.7. Elaboración de informes técnicos y custodia de evidencias</h4>
        <p>Los informes técnicos documentan hechos observados, procedimientos aplicados, resultados y conclusiones dentro del ámbito de competencia.</p>

        <h3>4. POLICÍA JUDICIAL E INVESTIGACIÓN PRELIMINAR</h3>
        <p>La Policía Judicial materializa la capacidad investigativa del Estado durante la fase inicial del proceso penal.</p>

        <h4>4.1. Concepto y alcance de la Policía Judicial</h4>
        <p>La Policía Judicial comprende las unidades y servidores que desarrollan funciones de investigación penal bajo dirección del Ministerio Público.</p>

        <h4>4.2. Investigación preliminar</h4>
        <p>La investigación preliminar es la fase inicial destinada a verificar la existencia del hecho, identificar posibles responsables, proteger a las víctimas y asegurar elementos que podrían perderse.</p>

        <h4>4.3. Requisa personal y de vehículos</h4>
        <p>La requisa es una medida de búsqueda limitada sobre una persona o vehículo cuando existen razones legalmente relevantes para presumir la presencia de objetos vinculados con un hecho.</p>

        <h4>4.4. Actuaciones fundamentadas</h4>
        <p>Una actuación fundamentada expresa los hechos concretos, la norma habilitante, la finalidad y la necesidad de la medida.</p>

        <h4>4.5. Preservación de la cadena de custodia</h4>
        <p>La cadena de custodia es el sistema de identificación, registro, embalaje, traslado, almacenamiento y entrega que asegura la trazabilidad de una evidencia.</p>

        <h4>4.6. Coordinación con el Instituto de Investigaciones Forenses (IDIF)</h4>
        <p>La coordinación con el IDIF permite aplicar conocimientos científicos a la investigación mediante pericias médicas, biológicas, químicas, balísticas, documentológicas y otras.</p>

        <h3>5. JURISDICCIÓN, COMPETENCIA Y ACCIÓN PENAL</h3>
        <p>Jurisdicción, competencia y acción penal determinan quién puede conocer un caso, en qué ámbito territorial o funcional y bajo qué modalidad se activa la persecución penal.</p>

        <h4>5.1. Jurisdicción penal</h4>
        <p>La jurisdicción penal es la potestad estatal de conocer y resolver conflictos derivados de hechos delictivos mediante jueces y tribunales.</p>

        <h4>5.2. Competencia territorial y funcional</h4>
        <p>La competencia distribuye la jurisdicción según territorio, materia, etapa o función.</p>

        <h4>5.3. Acción penal pública</h4>
        <p>La acción penal pública corresponde a delitos cuya persecución es promovida por el Ministerio Público en defensa del interés social, sin depender exclusivamente de la voluntad de la víctima.</p>

        <h4>5.4. Acción penal pública a instancia de parte</h4>
        <p>La acción pública a instancia de parte exige una manifestación inicial de la persona legitimada para activar la persecución, después de la cual interviene el Ministerio Público conforme a la ley.</p>

        <h4>5.5. Acción penal privada</h4>
        <p>La acción penal privada se refiere a delitos cuya persecución depende principalmente de la iniciativa de la persona ofendida, mediante los mecanismos previstos ante la autoridad judicial.</p>

        <h4>5.6. Conversión y extinción de la acción penal</h4>
        <p>La conversión modifica, en los casos permitidos, la modalidad de ejercicio de la acción; la extinción pone fin a la posibilidad de continuar la persecución por causas legalmente previstas.</p>

        <h3>6. DERECHOS Y GARANTÍAS DURANTE LA INVESTIGACIÓN</h3>
        <p>Las garantías procesales protegen simultáneamente la dignidad de las personas y la validez de la investigación.</p>

        <h4>6.1. Derechos del imputado</h4>
        <p>El imputado tiene derecho a conocer el hecho atribuido, contar con defensa, guardar silencio, ser tratado dignamente, comunicarse y cuestionar las actuaciones que lo afectan.</p>

        <h4>6.2. Derechos de la víctima</h4>
        <p>La víctima tiene derecho a protección, información, trato digno, participación, reparación y acceso a mecanismos institucionales.</p>

        <h4>6.3. Derecho a la defensa y a guardar silencio</h4>
        <p>El derecho a la defensa permite asistencia técnica y contradicción; el derecho a guardar silencio protege a la persona frente a la autoincriminación forzada.</p>

        <h4>6.4. Prohibición de obtención ilícita de pruebas</h4>
        <p>Está prohibido obtener pruebas mediante tortura, coacción, invasiones arbitrarias, engaños incompatibles con derechos o incumplimiento de autorizaciones legales.</p>

        <h4>6.5. Control jurisdiccional de las actuaciones policiales</h4>
        <p>El control jurisdiccional permite que un juez revise la legalidad de medidas, restricciones y actuaciones realizadas durante la investigación.</p>

        <h3>7. TEORÍA DEL DELITO APLICADA A LA FUNCIÓN POLICIAL</h3>
        <p>La teoría del delito ofrece una estructura analítica para examinar, de manera ordenada, si una conducta puede ser penalmente relevante.</p>

        <h4>7.1. Conducta</h4>
        <p>La conducta es el comportamiento humano voluntario, activo u omisivo, que constituye el punto de partida del análisis del delito.</p>

        <h4>7.2. Tipicidad</h4>
        <p>La tipicidad es la correspondencia entre la conducta observada y la descripción legal de un delito.</p>

        <h4>7.3. Antijuridicidad</h4>
        <p>La antijuridicidad expresa la contradicción de la conducta típica con el orden jurídico.</p>

        <h4>7.4. Culpabilidad</h4>
        <p>La culpabilidad permite atribuir personalmente el hecho antijurídico a quien podía comprender su ilicitud y actuar de otra manera.</p>

        <h4>7.5. Autoría y participación</h4>
        <p>La autoría corresponde a quien realiza o controla el hecho; la participación comprende formas de inducción o cooperación.</p>

        <h4>7.6. Iter criminis</h4>
        <p>El iter criminis describe las fases del desarrollo del delito, desde la idea y preparación hasta la ejecución, tentativa y consumación.</p>

        <h4>7.7. Concurso de delitos</h4>
        <p>El concurso de delitos se presenta cuando una o varias conductas pueden integrar más de una figura penal.</p>

        <h3>8. MEDIDAS COERCITIVAS Y ACTUACIONES POLICIALES</h3>
        <p>Las medidas coercitivas restringen derechos para asegurar fines procesales y, por ello, deben aplicarse con base legal, necesidad, proporcionalidad, motivación y control.</p>

        <h4>8.1. Arresto, aprehensión y detención en flagrancia</h4>
        <p>Arresto, aprehensión y detención son figuras distintas de restricción de libertad, con presupuestos, finalidades y autoridades competentes diferentes.</p>

        <h4>8.2. Incautación de objetos</h4>
        <p>La incautación asegura objetos vinculados con el delito, instrumentos, efectos o elementos útiles para la investigación.</p>

        <h4>8.3. Preservación de evidencias</h4>
        <p>La preservación de evidencias comprende medidas físicas, documentales y técnicas destinadas a impedir pérdida, contaminación, sustitución o degradación.</p>

        <h4>8.4. Registro del lugar del hecho</h4>
        <p>El registro del lugar del hecho es la documentación sistemática de su estado, distribución, accesos, objetos, huellas y relaciones espaciales.</p>

        <h4>8.5. Fundamentación y plazos procesales (Ley N.º 1970)</h4>
        <p>La fundamentación explica las razones fácticas y jurídicas de una actuación; los plazos procesales limitan temporalmente el ejercicio del poder y garantizan celeridad.</p>

        <h3>9. PARTICIPACIÓN POLICIAL DURANTE EL JUICIO ORAL</h3>
        <p>La participación policial en juicio proyecta la calidad de toda la investigación preliminar.</p>

        <h4>9.1. El policía como testigo</h4>
        <p>El policía que comparece como testigo declara sobre hechos que percibió y actuaciones que realizó.</p>

        <h4>9.2. Presentación y ratificación de informes técnicos</h4>
        <p>La ratificación permite explicar la metodología, fuentes, resultados y límites de un informe técnico.</p>

        <h4>9.3. Custodia de evidencias</h4>
        <p>Durante el juicio, la custodia continúa garantizando identidad e integridad de las evidencias hasta su exhibición, devolución o destino final.</p>

        <h4>9.4. Seguridad del tribunal</h4>
        <p>La seguridad del tribunal comprende prevención de riesgos, control de accesos, protección de autoridades, partes y público, y respuesta proporcional ante incidentes.</p>

        <h4>9.5. Principios de objetividad e imparcialidad en la etapa de juicio</h4>
        <p>En juicio, la objetividad e imparcialidad exigen que el policía declare sin favorecer a una parte, adapte su respuesta a lo realmente conocido y respete la valoración del tribunal.</p>

        <h3>10. CONCLUSIÓN</h3>
        <p>El Derecho Penal y el Derecho Procesal Penal constituyen un sistema inseparable para la función policial. El primero delimita las conductas penalmente relevantes y las categorías necesarias para comprenderlas; el segundo define las vías legítimas para investigarlas, probarlas y someterlas a decisión jurisdiccional.</p>
        <div class="ejemplo-practico"><strong>Ejemplo práctico:</strong> Al sorprender a una persona en flagrancia, el policía diferencia la conducta penalmente relevante de las medidas procesales aplicables, realiza la aprehensión dentro de sus atribuciones, informa derechos, preserva los elementos vinculados al hecho, mantiene la cadena de custodia y pone el caso a conocimiento de la autoridad competente.</div>
