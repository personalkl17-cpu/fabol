        <h1>UNIDAD TEMÁTICA No. 10</h1>
        <h2>GÉNERO Y VIOLENCIA INTRAFAMILIAR</h2>
        <h3>INTRODUCCIÓN</h3>
        <p>La violencia en razón de género y la violencia intrafamiliar constituyen fenómenos complejos que afectan la vida, la integridad, la libertad, la dignidad y el desarrollo de las personas, especialmente de las mujeres. Su abordaje exige comprender simultáneamente el marco constitucional, las obligaciones internacionales del Estado, la legislación penal y procesal, y los procedimientos operativos que orientan la intervención policial. Desde esta perspectiva, la función policial no se limita a recibir denuncias o ejecutar actos investigativos; comprende también prevención, detección temprana, protección inmediata, evaluación de riesgo, preservación de evidencias, coordinación interinstitucional y trato digno a la víctima.</p>
        <p>Esto significa que cada actuación policial debe interpretarse como parte de una respuesta estatal integral. La rapidez sin técnica puede afectar la investigación; la técnica sin enfoque humano puede producir revictimización; y la atención sin coordinación puede dejar a la víctima expuesta a nuevas agresiones. Por ello, el presente desarrollo organiza los contenidos desde los fundamentos jurídicos y conceptuales hasta los principales actos investigativos y etapas procesales, vinculando cada tema con su aplicación profesional.</p>
        <div class="marco-normativo"><strong>Marco Normativo / Cita:</strong> Según la Constitución Política del Estado (Bolivia, 2009), el derecho a la vida y a la integridad física, psicológica y sexual obliga al Estado a adoptar medidas de prevención, atención, sanción y erradicación de la violencia, particularmente aquella ejercida contra las mujeres.</div>
        <div class="ejemplo-practico"><strong>Ejemplo práctico:</strong> Una patrulla atiende un llamado por agresión en un domicilio. Además de separar a las partes y controlar el peligro inmediato, el personal policial verifica lesiones, identifica a niñas, niños u otras personas en riesgo, comunica el caso a la FELCV y al Ministerio Público, preserva los indicios y orienta a la víctima sobre medidas de protección.</div>

        <h3>1. MARCO JURÍDICO NACIONAL</h3>
        <p>El marco jurídico nacional integra las normas constitucionales, orgánicas, sustantivas y procesales que determinan las obligaciones estatales y policiales frente a la violencia de género. Su lectura debe ser sistemática: la Constitución fija derechos y mandatos; las leyes especiales desarrollan mecanismos de prevención y protección; y los códigos establecen responsabilidades, procedimientos y consecuencias jurídicas.</p>
        <p>Esto quiere decir que la actuación institucional debe traducir el contenido normativo o conceptual en decisiones concretas, verificables y compatibles con los derechos humanos. En la práctica policial, el conocimiento de este punto permite identificar riesgos, seleccionar diligencias pertinentes, evitar omisiones y documentar adecuadamente cada intervención.</p>
        <div class="marco-normativo"><strong>Marco Normativo / Cita:</strong> Según la Constitución Política del Estado y la Ley N.º 348 (Bolivia, 2009, 2013), la respuesta frente a la violencia contra las mujeres debe asegurar protección efectiva, acceso a la justicia, debida diligencia y actuación coordinada de las instituciones competentes.</div>
        <div class="ejemplo-practico"><strong>Ejemplo práctico:</strong> Ante una denuncia de violencia familiar, el servidor policial aplica la Ley N.º 348, pero también observa garantías constitucionales, reglas procesales, deberes de coordinación fiscal y tipos penales relacionados.</div>

        <h4>1.1. Constitución Política del Estado Plurinacional de Bolivia</h4>
        <p>La Constitución es la norma suprema que orienta toda intervención pública. En materia de violencia de género reconoce derechos fundamentales, proscribe la violencia y asigna a la Policía Boliviana una misión de defensa de la sociedad, conservación del orden público y cumplimiento de la ley. Estos mandatos exigen actuaciones legales, proporcionales, oportunas y respetuosas de la dignidad humana.</p>
        <div class="marco-normativo"><strong>Marco Normativo / Cita:</strong> Según Bolivia (2009), los derechos fundamentales vinculan directamente a todas las autoridades, por lo que la prevención, atención y protección frente a la violencia no dependen de formalidades excesivas ni pueden postergarse cuando existe riesgo.</div>
        <div class="ejemplo-practico"><strong>Ejemplo práctico:</strong> Una funcionaria policial prioriza la seguridad de una mujer amenazada, activa medidas urgentes y evita exigir documentos innecesarios antes de brindarle atención.</div>

        <h4>1.1.1. Artículo 15.II</h4>
        <p>Este precepto constitucional establece de forma expresa el derecho de las mujeres a no sufrir violencia física, sexual o psicológica, tanto en la familia como en la sociedad, e impone al Estado el deber de adoptar medidas para prevenir, eliminar y sancionar la violencia de género y generacional. Su alcance transforma la protección en una obligación positiva y no solo en una prohibición abstracta.</p>
        <div class="marco-normativo"><strong>Marco Normativo / Cita:</strong> Según el artículo 15.II de la Constitución Política del Estado (Bolivia, 2009), el Estado debe prevenir, eliminar y sancionar la violencia de género y generacional, garantizando a las mujeres una vida libre de violencia.</div>
        <div class="ejemplo-practico"><strong>Ejemplo práctico:</strong> En un caso de amenazas reiteradas por la expareja, la Policía no espera una agresión física para intervenir, porque el riesgo psicológico y la posibilidad de escalamiento activan el deber preventivo.</div>

        <h4>1.1.2. Artículo 251.I</h4>
        <p>El artículo 251.I define la misión específica de la Policía Boliviana como fuerza pública. En casos de violencia, esta misión se concreta en proteger a la víctima, restablecer condiciones de seguridad, hacer cumplir las medidas de protección, prevenir nuevos hechos y realizar actuaciones investigativas dentro de la dirección funcional del Ministerio Público.</p>
        <div class="marco-normativo"><strong>Marco Normativo / Cita:</strong> Según el artículo 251.I de la Constitución Política del Estado (Bolivia, 2009), la Policía Boliviana tiene la misión de defender a la sociedad, conservar el orden público y cumplir las leyes en todo el territorio nacional.</div>
        <div class="ejemplo-practico"><strong>Ejemplo práctico:</strong> La FELCV ejecuta una medida de alejamiento y verifica su cumplimiento para impedir que el agresor vuelva al domicilio de la víctima.</div>

        <h4>1.2. Ley N.º 734, Ley Orgánica de la Policía Nacional</h4>
        <p>Esta ley estructura la naturaleza, misión, funciones y atribuciones institucionales. Aplicada a la violencia intrafamiliar, fundamenta la intervención policial preventiva, auxiliadora e investigativa, así como el deber de cooperación con otras autoridades.</p>
        <div class="marco-normativo"><strong>Marco Normativo / Cita:</strong> Según la Ley N.º 734 (Bolivia, 1985), la Policía es una institución fundamental del Estado encargada de defender a la sociedad, mantener el orden público y hacer cumplir las leyes.</div>
        <div class="ejemplo-practico"><strong>Ejemplo práctico:</strong> Una patrulla interviene ante gritos y pedidos de auxilio en un inmueble, protege a la víctima y comunica el hecho a la unidad especializada.</div>

        <h4>1.2.1. Artículo 1</h4>
        <p>El artículo 1 delimita la naturaleza institucional y la finalidad esencial de la Policía. En el contexto de violencia de género, implica que la defensa de la sociedad incluye la protección diferenciada de personas expuestas a relaciones desiguales de poder y a riesgos graves dentro del ámbito familiar.</p>
        <div class="marco-normativo"><strong>Marco Normativo / Cita:</strong> Según el artículo 1 de la Ley N.º 734 (Bolivia, 1985), la Policía cumple una función pública esencial orientada a la seguridad, el orden y la protección de la sociedad.</div>
        <div class="ejemplo-practico"><strong>Ejemplo práctico:</strong> El personal policial brinda protección inmediata a una mujer y sus hijos, aun cuando el agresor sostenga que se trata de un asunto privado.</div>

        <h4>1.2.2. Artículo 7 inc. a), c), i)</h4>
        <p>Estos incisos reúnen funciones vinculadas con el cumplimiento de la ley, el auxilio y la cooperación institucional. En violencia intrafamiliar permiten comprender que la actuación policial debe ser preventiva, protectora e investigativa, evitando respuestas fragmentadas o meramente administrativas.</p>
        <div class="marco-normativo"><strong>Marco Normativo / Cita:</strong> Según el artículo 7 de la Ley N.º 734 (Bolivia, 1985), la Policía debe preservar el orden, prevenir hechos contrarios a la ley y cooperar con las autoridades competentes en el ejercicio de sus funciones.</div>
        <div class="ejemplo-practico"><strong>Ejemplo práctico:</strong> Después de proteger a la víctima, el investigador coordina con el fiscal, solicita valoración médico-forense y documenta la escena.</div>

        <h4>1.3. Ley N.º 348 "Ley Integral para Garantizar a las Mujeres una Vida Libre de Violencia"</h4>
        <p>La Ley N.º 348 constituye el eje normativo especializado. Define la violencia, reconoce múltiples formas de agresión, establece principios de atención y distribuye responsabilidades entre Policía, Ministerio Público, órganos judiciales, servicios de salud y entidades territoriales. Su enfoque integral exige prevenir, atender, proteger, investigar y sancionar.</p>
        <div class="marco-normativo"><strong>Marco Normativo / Cita:</strong> Según la Ley N.º 348 (Bolivia, 2013), la erradicación de la violencia contra las mujeres es una prioridad nacional y una responsabilidad de todas las instituciones públicas y privadas que intervienen en su prevención y atención.</div>
        <div class="ejemplo-practico"><strong>Ejemplo práctico:</strong> Una denuncia por control económico, insultos y golpes se analiza integralmente, sin reducir el caso únicamente a la lesión física visible.</div>

        <h4>1.3.1. Artículo 44</h4>
        <p>Regula la necesidad de investigación especializada, pronta y eficaz de los hechos de violencia, evitando demoras que aumenten el riesgo o provoquen pérdida de evidencia. La actuación debe orientarse a esclarecer el hecho, identificar al responsable y proteger a la víctima.</p>
        <div class="marco-normativo"><strong>Marco Normativo / Cita:</strong> Según el artículo 44 de la Ley N.º 348 (Bolivia, 2013), la respuesta institucional debe ser especializada, oportuna y orientada a garantizar protección efectiva, investigación diligente y acceso a la justicia.</div>
        <div class="ejemplo-practico"><strong>Ejemplo práctico:</strong> El investigador entrevista a testigos el mismo día, solicita cámaras del lugar y asegura el certificado médico antes de que la evidencia se pierda.</div>

        <h4>1.3.2. Artículo 45</h4>
        <p>Refuerza la dirección funcional del Ministerio Público y la coordinación con la Policía. La investigación debe responder a una estrategia fiscal, pero la Policía conserva el deber de ejecutar actos urgentes e irreproducibles y comunicar de inmediato sus resultados.</p>
        <div class="marco-normativo"><strong>Marco Normativo / Cita:</strong> Según el artículo 45 de la Ley N.º 348 (Bolivia, 2013), la respuesta institucional debe ser especializada, oportuna y orientada a garantizar protección efectiva, investigación diligente y acceso a la justicia.</div>
        <div class="ejemplo-practico"><strong>Ejemplo práctico:</strong> La Policía informa al fiscal de turno, ejecuta el registro del lugar y remite el acta, muestrario fotográfico e indicios recolectados.</div>

        <h4>1.3.3. Artículo 46</h4>
        <p>Consolida garantías de atención y límites a prácticas que puedan desalentar la denuncia, culpabilizar a la víctima o promover acuerdos incompatibles con la protección de derechos. La prioridad es la seguridad y el acceso efectivo a la justicia.</p>
        <div class="marco-normativo"><strong>Marco Normativo / Cita:</strong> Según el artículo 46 de la Ley N.º 348 (Bolivia, 2013), la respuesta institucional debe ser especializada, oportuna y orientada a garantizar protección efectiva, investigación diligente y acceso a la justicia.</div>
        <div class="ejemplo-practico"><strong>Ejemplo práctico:</strong> El personal evita preguntar por qué la víctima no se retiró antes del domicilio y centra la entrevista en hechos, riesgo y necesidades de protección.</div>

        <h4>1.3.4. Artículo 53</h4>
        <p>Establece la FELCV como organismo especializado de la Policía Boliviana para prevención, auxilio, investigación, identificación y aprehensión de presuntos responsables, bajo dirección funcional fiscal.</p>
        <div class="marco-normativo"><strong>Marco Normativo / Cita:</strong> Según el artículo 53 de la Ley N.º 348 (Bolivia, 2013), la respuesta institucional debe ser especializada, oportuna y orientada a garantizar protección efectiva, investigación diligente y acceso a la justicia.</div>
        <div class="ejemplo-practico"><strong>Ejemplo práctico:</strong> La FELCV asume un caso de violencia familiar, coordina la valoración de riesgo y realiza actos investigativos bajo dirección fiscal.</div>

        <h4>1.3.5. Artículo 54</h4>
        <p>Organiza la recepción accesible y continua de denuncias, orientación y derivación. La plataforma debe evitar barreras, asegurar registro inmediato y activar mecanismos de protección e investigación.</p>
        <div class="marco-normativo"><strong>Marco Normativo / Cita:</strong> Según el artículo 54 de la Ley N.º 348 (Bolivia, 2013), la respuesta institucional debe ser especializada, oportuna y orientada a garantizar protección efectiva, investigación diligente y acceso a la justicia.</div>
        <div class="ejemplo-practico"><strong>Ejemplo práctico:</strong> Una mujer presenta denuncia verbal; la plataforma la registra, activa atención inmediata y deriva al equipo investigador sin exigir memorial.</div>

        <h4>1.3.6. Artículo 55</h4>
        <p>Las unidades móviles acercan la respuesta policial a lugares alejados o de difícil acceso, permitiendo intervención rápida, recepción de denuncias y protección en contextos donde no existe presencia permanente.</p>
        <div class="marco-normativo"><strong>Marco Normativo / Cita:</strong> Según el artículo 55 de la Ley N.º 348 (Bolivia, 2013), la respuesta institucional debe ser especializada, oportuna y orientada a garantizar protección efectiva, investigación diligente y acceso a la justicia.</div>
        <div class="ejemplo-practico"><strong>Ejemplo práctico:</strong> Una unidad móvil se desplaza a una comunidad rural para recibir una denuncia y trasladar a la víctima a un lugar seguro.</div>

        <h4>1.3.7. Artículo 57</h4>
        <p>La división especializada organiza la investigación de delitos vinculados con violencia contra las mujeres, asignando personal capacitado y procedimientos diferenciados según la naturaleza del hecho.</p>
        <div class="marco-normativo"><strong>Marco Normativo / Cita:</strong> Según el artículo 57 de la Ley N.º 348 (Bolivia, 2013), la respuesta institucional debe ser especializada, oportuna y orientada a garantizar protección efectiva, investigación diligente y acceso a la justicia.</div>
        <div class="ejemplo-practico"><strong>Ejemplo práctico:</strong> Un caso de violencia sexual es asignado a personal entrenado en entrevista sensible, evidencia biológica y coordinación forense.</div>

        <h4>1.3.8. Artículo 58</h4>
        <p>Comprende actuaciones policiales inmediatas de protección, auxilio, preservación de la escena, identificación de testigos, recolección inicial de información y coordinación con autoridades competentes.</p>
        <div class="marco-normativo"><strong>Marco Normativo / Cita:</strong> Según el artículo 58 de la Ley N.º 348 (Bolivia, 2013), la respuesta institucional debe ser especializada, oportuna y orientada a garantizar protección efectiva, investigación diligente y acceso a la justicia.</div>
        <div class="ejemplo-practico"><strong>Ejemplo práctico:</strong> La patrulla separa al agresor, verifica lesiones, identifica el arma utilizada y preserva el lugar hasta la llegada del investigador.</div>

        <h4>1.3.9. Artículo 59</h4>
        <p>Reconoce que determinados hechos deben investigarse aun sin impulso constante de la víctima, porque la violencia afecta derechos fundamentales y puede estar acompañada de miedo, dependencia o coacción.</p>
        <div class="marco-normativo"><strong>Marco Normativo / Cita:</strong> Según el artículo 59 de la Ley N.º 348 (Bolivia, 2013), la respuesta institucional debe ser especializada, oportuna y orientada a garantizar protección efectiva, investigación diligente y acceso a la justicia.</div>
        <div class="ejemplo-practico"><strong>Ejemplo práctico:</strong> Aunque la víctima manifiesta temor y duda, la autoridad continúa los actos esenciales cuando existen indicios de delito de acción pública.</div>

        <h4>1.3.10. Artículo 60</h4>
        <p>Exige condiciones materiales, personal capacitado y recursos adecuados para una atención eficaz, reservada, continua y especializada. Sin estas condiciones, el acceso a la justicia se vuelve meramente formal.</p>
        <div class="marco-normativo"><strong>Marco Normativo / Cita:</strong> Según el artículo 60 de la Ley N.º 348 (Bolivia, 2013), la respuesta institucional debe ser especializada, oportuna y orientada a garantizar protección efectiva, investigación diligente y acceso a la justicia.</div>
        <div class="ejemplo-practico"><strong>Ejemplo práctico:</strong> La unidad dispone de ambiente privado para entrevistas, personal femenino cuando corresponde y medios de transporte para acciones urgentes.</div>

        <h4>1.4. Ley Orgánica del Ministerio Público (Ley N.º 260)</h4>
        <p>La Ley N.º 260 regula la función fiscal y la dirección de la investigación penal. En violencia de género, la coordinación fiscal-policial debe responder a los principios de objetividad, celeridad, protección de víctimas y búsqueda de la verdad material.</p>
        <div class="marco-normativo"><strong>Marco Normativo / Cita:</strong> Según la Ley N.º 260 (Bolivia, 2012), el Ministerio Público dirige la investigación penal y ejerce la acción penal pública, debiendo coordinar con la Policía y proteger los derechos de víctimas y testigos.</div>
        <div class="ejemplo-practico"><strong>Ejemplo práctico:</strong> El fiscal define la estrategia investigativa y la FELCV ejecuta entrevistas, inspecciones, requerimientos y secuestros legalmente dispuestos.</div>

        <h4>1.4.1. Artículo 77</h4>
        <p>La dirección funcional implica que el fiscal orienta jurídicamente la investigación y la Policía ejecuta diligencias técnicas, manteniendo comunicación continua y documentada.</p>
        <div class="marco-normativo"><strong>Marco Normativo / Cita:</strong> Según el artículo 77 de la Ley N.º 260 (Bolivia, 2012), la investigación penal requiere coordinación efectiva entre el Ministerio Público y la Policía, con registro formal de las actuaciones y respeto de las garantías procesales.</div>
        <div class="ejemplo-practico"><strong>Ejemplo práctico:</strong> En un caso de lesiones, el investigador remite un informe cronológico con entrevistas, fotografías, certificado forense e identificación de riesgos, evitando opiniones personales.</div>

        <h4>1.4.2. Artículo 78</h4>
        <p>Los informes policiales deben ser claros, objetivos, cronológicos y sustentados en actuaciones verificables; no pueden contener conclusiones especulativas ni omitir datos relevantes.</p>
        <div class="marco-normativo"><strong>Marco Normativo / Cita:</strong> Según el artículo 78 de la Ley N.º 260 (Bolivia, 2012), la investigación penal requiere coordinación efectiva entre el Ministerio Público y la Policía, con registro formal de las actuaciones y respeto de las garantías procesales.</div>
        <div class="ejemplo-practico"><strong>Ejemplo práctico:</strong> En un caso de lesiones, el investigador remite un informe cronológico con entrevistas, fotografías, certificado forense e identificación de riesgos, evitando opiniones personales.</div>

        <h4>1.4.3. Artículo 79</h4>
        <p>Los actos urgentes deben practicarse sin demora cuando existe riesgo para la víctima, peligro de fuga o posibilidad de pérdida de evidencia, comunicándolos inmediatamente al fiscal.</p>
        <div class="marco-normativo"><strong>Marco Normativo / Cita:</strong> Según el artículo 79 de la Ley N.º 260 (Bolivia, 2012), la investigación penal requiere coordinación efectiva entre el Ministerio Público y la Policía, con registro formal de las actuaciones y respeto de las garantías procesales.</div>
        <div class="ejemplo-practico"><strong>Ejemplo práctico:</strong> En un caso de lesiones, el investigador remite un informe cronológico con entrevistas, fotografías, certificado forense e identificación de riesgos, evitando opiniones personales.</div>

        <h4>1.4.4. Artículo 80</h4>
        <p>La coordinación exige responsabilidad funcional, cumplimiento de requerimientos legales y respeto a los límites de competencia de cada institución.</p>
        <div class="marco-normativo"><strong>Marco Normativo / Cita:</strong> Según el artículo 80 de la Ley N.º 260 (Bolivia, 2012), la investigación penal requiere coordinación efectiva entre el Ministerio Público y la Policía, con registro formal de las actuaciones y respeto de las garantías procesales.</div>
        <div class="ejemplo-practico"><strong>Ejemplo práctico:</strong> En un caso de lesiones, el investigador remite un informe cronológico con entrevistas, fotografías, certificado forense e identificación de riesgos, evitando opiniones personales.</div>

        <h4>1.5. Código de Procedimiento Penal</h4>
        <p>El Código de Procedimiento Penal establece las reglas que garantizan legalidad, debido proceso, control judicial y eficacia de la investigación. Su aplicación en violencia de género debe evitar formalismos que impidan proteger a la víctima, sin sacrificar la validez probatoria de los actos.</p>
        <div class="marco-normativo"><strong>Marco Normativo / Cita:</strong> Según la Ley N.º 1970 (Bolivia, 1999), toda actuación investigativa debe respetar la legalidad, la defensa, la objetividad y las reglas de incorporación de la prueba al proceso penal.</div>
        <div class="ejemplo-practico"><strong>Ejemplo práctico:</strong> El investigador obtiene una declaración, secuestra un objeto y documenta su cadena de custodia conforme a procedimiento para que pueda ser valorado judicialmente.</div>

        <h4>1.5.1. Artículo 259</h4>
        <p>Este artículo se vincula con la denuncia y su recepción como mecanismo de conocimiento de un posible hecho delictivo. La autoridad debe registrar la información relevante, identificar al denunciante cuando corresponda y remitir oportunamente los antecedentes, sin convertir la denuncia en una declaración exhaustiva o revictimizante.</p>
        <div class="marco-normativo"><strong>Marco Normativo / Cita:</strong> Según el artículo 259 del Código de Procedimiento Penal (Bolivia, 1999), la denuncia puede poner en conocimiento de la autoridad un hecho presuntamente delictivo y activar la investigación correspondiente.</div>
        <div class="ejemplo-practico"><strong>Ejemplo práctico:</strong> Una vecina comunica telefónicamente una agresión; la Policía registra los datos esenciales, acude al lugar y activa la acción directa.</div>

        <h4>1.6. Código Penal</h4>
        <p>El Código Penal tipifica conductas que lesionan la vida, integridad, libertad sexual, familia y función pública. En hechos de violencia, la calificación jurídica inicial es provisional y debe construirse a partir de evidencia objetiva y bajo dirección fiscal.</p>
        <div class="marco-normativo"><strong>Marco Normativo / Cita:</strong> Según el Código Penal boliviano, la responsabilidad penal se determina conforme a la conducta, los elementos del tipo, la culpabilidad y las circunstancias acreditados durante la investigación.</div>
        <div class="ejemplo-practico"><strong>Ejemplo práctico:</strong> Una agresión con lesiones y amenazas se documenta integralmente para que el fiscal determine los tipos penales aplicables.</div>

        <h4>1.6.1. Artículo 154 Bis</h4>
        <p>Este tipo penal sanciona el incumplimiento de deberes de protección a mujeres en situación de violencia cuando una servidora o servidor público omite, rehúsa o retarda injustificadamente actos propios de su función. Su finalidad es combatir la indiferencia institucional y reforzar la debida diligencia.</p>
        <div class="marco-normativo"><strong>Marco Normativo / Cita:</strong> Según el artículo 154 Bis del Código Penal, incorporado por la Ley N.º 348 (Bolivia, 2013), el incumplimiento de deberes de protección frente a la violencia puede generar responsabilidad penal de la autoridad o servidor público.</div>
        <div class="ejemplo-practico"><strong>Ejemplo práctico:</strong> Un funcionario que, sin justificación, se niega a registrar una denuncia y deja a la víctima expuesta a nuevas agresiones puede incurrir en responsabilidad.</div>

        <h3>2. MARCO JURÍDICO INTERNACIONAL</h3>
        <p>El marco internacional complementa y orienta la interpretación del derecho interno. Sus estándares exigen igualdad sustantiva, no discriminación, debida diligencia, acceso a la justicia, protección efectiva y transformación de patrones socioculturales que toleran la violencia.</p>
        <div class="marco-normativo"><strong>Marco Normativo / Cita:</strong> Según la CEDAW y la Convención de Belém do Pará (ONU, 1979; OEA, 1994), la violencia contra las mujeres constituye una forma de discriminación y una violación de derechos humanos que obliga al Estado a prevenir, investigar, sancionar y reparar.</div>
        <div class="ejemplo-practico"><strong>Ejemplo práctico:</strong> La Policía interpreta una amenaza reiterada no como conflicto privado, sino como una situación que activa obligaciones estatales de protección y debida diligencia.</div>

        <h4>2.1. Convención sobre la Eliminación de todas las Formas de Discriminación contra la Mujer (CEDAW)</h4>
        <p>La CEDAW obliga a eliminar normas, prácticas y estereotipos que produzcan discriminación. Su enfoque permite analizar cómo la violencia limita el ejercicio real de derechos y cómo las respuestas institucionales aparentemente neutras pueden perjudicar de manera desproporcionada a las mujeres.</p>
        <div class="marco-normativo"><strong>Marco Normativo / Cita:</strong> Según la ONU (1979), los Estados deben adoptar medidas apropiadas para eliminar la discriminación contra la mujer en las esferas política, social, económica, cultural, civil y familiar.</div>
        <div class="ejemplo-practico"><strong>Ejemplo práctico:</strong> Una unidad policial revisa sus formularios y protocolos para evitar preguntas basadas en estereotipos sobre comportamiento, vestimenta o vida privada de la víctima.</div>

        <h4>2.1.1. Recomendación General N.º 19 del Comité CEDAW</h4>
        <p>La Recomendación General N.º 19 reconoció que la violencia basada en el sexo es una forma de discriminación que impide a las mujeres disfrutar derechos en igualdad. También vinculó la responsabilidad estatal con la falta de diligencia para prevenir, investigar y sancionar actos de violencia.</p>
        <div class="marco-normativo"><strong>Marco Normativo / Cita:</strong> Según el Comité CEDAW (ONU, 1992), la violencia contra la mujer es una forma de discriminación comprendida por la Convención y puede comprometer la responsabilidad del Estado cuando este no actúa con la debida diligencia.</div>
        <div class="ejemplo-practico"><strong>Ejemplo práctico:</strong> La inacción ante denuncias reiteradas de amenazas se considera una falla estatal, aun cuando el agresor sea un particular.</div>

        <h4>2.1.2. Observaciones finales del Comité CEDAW dirigidas al Estado Boliviano</h4>
        <p>Las observaciones finales examinan avances y deficiencias en la aplicación de la Convención. Para la función policial, orientan a fortalecer capacitación, datos, especialización, coordinación, acceso territorial, protección y eliminación de obstáculos que provocan impunidad o revictimización.</p>
        <div class="marco-normativo"><strong>Marco Normativo / Cita:</strong> Según el Comité CEDAW, las recomendaciones dirigidas a Bolivia deben traducirse en políticas y prácticas institucionales que mejoren la prevención, la investigación y el acceso efectivo de las mujeres a la justicia.</div>
        <div class="ejemplo-practico"><strong>Ejemplo práctico:</strong> La FELCV utiliza registros desagregados para identificar zonas de mayor riesgo y orientar patrullajes preventivos y recursos.</div>

        <h4>2.2. Convención Interamericana para Prevenir, Sancionar y Erradicar la Violencia contra la Mujer</h4>
        <p>Esta Convención define la violencia contra la mujer en los ámbitos público y privado y reconoce el derecho a una vida libre de violencia. Exige actuar con debida diligencia y adoptar medidas jurídicas, administrativas, educativas y operativas.</p>
        <div class="marco-normativo"><strong>Marco Normativo / Cita:</strong> Según la OEA (1994), toda mujer tiene derecho a una vida libre de violencia y los Estados deben actuar con debida diligencia para prevenir, investigar y sancionar la violencia contra la mujer.</div>
        <div class="ejemplo-practico"><strong>Ejemplo práctico:</strong> Ante una agresión en el hogar, la autoridad no minimiza el hecho por ocurrir en un espacio privado y activa protección e investigación.</div>

        <h3>3. MARCO CONCEPTUAL</h3>
        <p>El marco conceptual proporciona categorías para identificar, describir y analizar la violencia. Una correcta comprensión evita reducirla a lesiones visibles y permite reconocer dinámicas de poder, control, dependencia y escalamiento.</p>
        <div class="marco-normativo"><strong>Marco Normativo / Cita:</strong> Según la Ley N.º 348 (Bolivia, 2013), la violencia comprende acciones u omisiones que causan daño o sufrimiento y puede manifestarse en múltiples ámbitos y modalidades.</div>
        <div class="ejemplo-practico"><strong>Ejemplo práctico:</strong> Una entrevista identifica insultos, aislamiento, control de dinero, amenazas y agresiones físicas como partes de un mismo patrón.</div>

        <h4>3.1. Definiciones</h4>
        <p>Las definiciones unifican criterios institucionales y permiten que operadores policiales, fiscales, médicos y judiciales comprendan el mismo fenómeno con términos compatibles.</p>
        <div class="marco-normativo"><strong>Marco Normativo / Cita:</strong> Según la Ley N.º 348 (Bolivia, 2013), la interpretación de los conceptos debe favorecer la protección efectiva de los derechos de las mujeres.</div>
        <div class="ejemplo-practico"><strong>Ejemplo práctico:</strong> El investigador registra hechos concretos y los vincula con categorías legales sin imponer etiquetas no sustentadas.</div>

        <h4>3.1.1. Definición de violencia de acuerdo a la Ley N.º 348</h4>
        <p>La violencia es toda acción u omisión, abierta o encubierta, que causa muerte, sufrimiento o daño físico, sexual, psicológico, económico o patrimonial a una mujer, genera perjuicio en su patrimonio, economía, trabajo u otro ámbito, por el solo hecho de ser mujer.</p>
        <div class="marco-normativo"><strong>Marco Normativo / Cita:</strong> Según el artículo 6.1 de la Ley N.º 348 (Bolivia, 2013), la violencia puede producirse por acción u omisión y afectar dimensiones físicas, sexuales, psicológicas, económicas y patrimoniales.</div>
        <div class="ejemplo-practico"><strong>Ejemplo práctico:</strong> El agresor impide a su pareja trabajar, retiene su salario y la amenaza; aunque no exista golpe, los hechos pueden constituir violencia.</div>

        <h4>3.1.2. Definición de derechos humanos</h4>
        <p>Los derechos humanos son facultades y garantías inherentes a toda persona, universales, indivisibles, interdependientes y exigibles. En violencia de género protegen vida, integridad, libertad, igualdad, dignidad, salud y acceso a la justicia.</p>
        <div class="marco-normativo"><strong>Marco Normativo / Cita:</strong> Según la Constitución Política del Estado y los instrumentos internacionales citados, los derechos humanos obligan a las autoridades a respetar, proteger y garantizar a todas las personas sin discriminación.</div>
        <div class="ejemplo-practico"><strong>Ejemplo práctico:</strong> La víctima recibe atención sin discriminación por edad, idioma, situación económica, ocupación o lugar de residencia.</div>

        <h4>3.1.3. Definición de género</h4>
        <p>El género alude a roles, expectativas, relaciones y significados socialmente construidos respecto de mujeres y hombres. Su análisis permite identificar desigualdades de poder que normalizan control, subordinación y violencia.</p>
        <div class="marco-normativo"><strong>Marco Normativo / Cita:</strong> Según la CEDAW (ONU, 1979), los Estados deben modificar patrones socioculturales basados en ideas de inferioridad o superioridad de los sexos y en funciones estereotipadas.</div>
        <div class="ejemplo-practico"><strong>Ejemplo práctico:</strong> El policía evita considerar normal que el esposo controle las amistades, vestimenta o ingresos de la mujer.</div>

        <h4>3.1.4. Definición de violencia de género</h4>
        <p>Es la violencia dirigida contra una persona por razones vinculadas con el género o que la afecta de manera desproporcionada, sustentada en desigualdades, estereotipos y relaciones de poder.</p>
        <div class="marco-normativo"><strong>Marco Normativo / Cita:</strong> Según el Comité CEDAW, la violencia por razón de género es una forma de discriminación que limita gravemente el goce de derechos y libertades.</div>
        <div class="ejemplo-practico"><strong>Ejemplo práctico:</strong> Las amenazas por negarse a continuar una relación revelan una pretensión de control basada en subordinación de género.</div>

        <h4>3.1.5. Definición de violencia contra las mujeres</h4>
        <p>Comprende cualquier conducta basada en género que cause o pueda causar muerte, daño o sufrimiento físico, sexual, psicológico, económico o patrimonial, en ámbitos públicos o privados.</p>
        <div class="marco-normativo"><strong>Marco Normativo / Cita:</strong> Según la Convención de Belém do Pará (OEA, 1994), la violencia contra la mujer incluye el daño físico, sexual o psicológico ocurrido en la familia, la comunidad o perpetrado o tolerado por el Estado.</div>
        <div class="ejemplo-practico"><strong>Ejemplo práctico:</strong> Una funcionaria pública que humilla y obstaculiza deliberadamente a una víctima puede generar violencia institucional.</div>

        <h4>3.1.6. Definición de situación de violencia</h4>
        <p>Es el contexto concreto en el que una mujer experimenta hechos, amenazas, controles o riesgos vinculados con violencia. Debe analizarse como proceso y no solo como episodio aislado.</p>
        <div class="marco-normativo"><strong>Marco Normativo / Cita:</strong> Según el Protocolo de la FELCV (Policía Boliviana, 2014), la atención debe considerar antecedentes, frecuencia, gravedad, amenazas, acceso a armas, dependencia y presencia de personas vulnerables.</div>
        <div class="ejemplo-practico"><strong>Ejemplo práctico:</strong> Una bofetada se evalúa junto con amenazas previas, estrangulamiento, celos extremos y acceso del agresor a un arma.</div>

        <h4>3.2. Tipos de violencia contra las mujeres</h4>
        <p>La clasificación legal permite reconocer manifestaciones diversas y acumulativas. Los tipos no son excluyentes: un mismo hecho puede producir daños físicos, psicológicos, sexuales, económicos y sociales.</p>
        <div class="marco-normativo"><strong>Marco Normativo / Cita:</strong> Según la Ley N.º 348 (Bolivia, 2013), la violencia contra las mujeres adopta múltiples formas que deben ser identificadas y atendidas de manera integral.</div>
        <div class="ejemplo-practico"><strong>Ejemplo práctico:</strong> En una relación pueden coexistir golpes, amenazas, control del dinero, aislamiento y coerción sexual.</div>

        <h4>3.2.1. Violencia física</h4>
        <p>Acción que ocasiona lesión o daño corporal interno, externo o ambos, temporal o permanente, mediante fuerza, objetos, sustancias u otros medios.</p>
        <div class="marco-normativo"><strong>Marco Normativo / Cita:</strong> Según la Ley N.º 348 (Bolivia, 2013), la violencia física comprende conductas que afectan la integridad corporal de la mujer.</div>
        <div class="ejemplo-practico"><strong>Ejemplo práctico:</strong> Empujones, golpes, quemaduras o estrangulamiento son documentados mediante fotografías, entrevista y valoración forense.</div>

        <h4>3.2.2. Violencia psicológica</h4>
        <p>Conjunto de acciones sistemáticas de desvalorización, intimidación, control, aislamiento, amenazas o humillación que deterioran estabilidad emocional y autodeterminación.</p>
        <div class="marco-normativo"><strong>Marco Normativo / Cita:</strong> Según la Ley N.º 348 (Bolivia, 2013), la violencia psicológica puede producir daño emocional, disminución de autoestima y perturbación del desarrollo personal.</div>
        <div class="ejemplo-practico"><strong>Ejemplo práctico:</strong> El agresor amenaza con quitarle a sus hijos, revisa su teléfono y la insulta diariamente.</div>

        <h4>3.2.3. Violencia sexual</h4>
        <p>Conducta que vulnera el derecho a decidir libremente sobre la vida sexual, mediante fuerza, intimidación, coerción, engaño o abuso de poder.</p>
        <div class="marco-normativo"><strong>Marco Normativo / Cita:</strong> Según la Ley N.º 348 y la Convención de Belém do Pará, ninguna relación afectiva o conyugal elimina el consentimiento sexual.</div>
        <div class="ejemplo-practico"><strong>Ejemplo práctico:</strong> La víctima refiere que fue obligada a mantener relaciones mediante amenazas; el caso se investiga sin cuestionar su vínculo con el agresor.</div>

        <h4>3.2.4. Violencia patrimonial y económica</h4>
        <p>Acciones u omisiones que controlan, limitan, dañan, sustraen o destruyen recursos, ingresos, documentos, bienes o derechos patrimoniales de la mujer.</p>
        <div class="marco-normativo"><strong>Marco Normativo / Cita:</strong> Según la Ley N.º 348 (Bolivia, 2013), el control económico y la afectación patrimonial son formas de violencia que restringen autonomía y capacidad de decisión.</div>
        <div class="ejemplo-practico"><strong>Ejemplo práctico:</strong> El agresor retiene documentos, vende bienes comunes y prohíbe a la víctima trabajar.</div>

        <h4>3.2.5. Violencia feminicida</h4>
        <p>Forma extrema de violencia que viola el derecho fundamental a la vida y puede culminar en muerte violenta por razones de género. Requiere valoración prioritaria de amenazas, tentativas y escalamiento.</p>
        <div class="marco-normativo"><strong>Marco Normativo / Cita:</strong> Según la Ley N.º 348 (Bolivia, 2013), la violencia feminicida representa la expresión más grave de dominación y riesgo contra la vida de las mujeres.</div>
        <div class="ejemplo-practico"><strong>Ejemplo práctico:</strong> Amenazas de muerte, estrangulamiento previo y acceso a armas elevan el nivel de riesgo y exigen protección urgente.</div>

        <h4>3.2.6. Violencia mediática</h4>
        <p>Difusión de mensajes o imágenes que promueven explotación, humillación, discriminación o estereotipos lesivos para las mujeres.</p>
        <div class="marco-normativo"><strong>Marco Normativo / Cita:</strong> Según la Ley N.º 348 (Bolivia, 2013), los medios no deben reproducir contenidos que naturalicen subordinación o violencia contra las mujeres.</div>
        <div class="ejemplo-practico"><strong>Ejemplo práctico:</strong> La publicación no consentida de imágenes íntimas se registra, preservando capturas, enlaces y datos digitales.</div>

        <h4>3.2.7. Violencia simbólica</h4>
        <p>Mensajes, valores, signos o prácticas que transmiten y reproducen dominación, desigualdad y subordinación, muchas veces de forma normalizada.</p>
        <div class="marco-normativo"><strong>Marco Normativo / Cita:</strong> Según la Ley N.º 348 (Bolivia, 2013), la violencia simbólica opera mediante patrones que legitiman la inferiorización y el control de las mujeres.</div>
        <div class="ejemplo-practico"><strong>Ejemplo práctico:</strong> Un mensaje institucional que culpa a la víctima por su vestimenta reproduce un estereotipo y debe ser corregido.</div>

        <h4>3.2.8. Violencia contra la dignidad y honra del nombre</h4>
        <p>Conductas verbales, escritas o públicas que desacreditan, difaman, humillan o dañan la reputación y dignidad de la mujer.</p>
        <div class="marco-normativo"><strong>Marco Normativo / Cita:</strong> Según la Ley N.º 348 (Bolivia, 2013), la dignidad y la honra forman parte de los bienes jurídicos protegidos frente a expresiones degradantes.</div>
        <div class="ejemplo-practico"><strong>Ejemplo práctico:</strong> La expareja publica acusaciones falsas para aislarla social y laboralmente.</div>

        <h4>3.2.9. Violencia contra los derechos reproductivos</h4>
        <p>Acciones que limitan la información, atención o decisión libre sobre reproducción, embarazo, anticoncepción y maternidad.</p>
        <div class="marco-normativo"><strong>Marco Normativo / Cita:</strong> Según la Ley N.º 348 (Bolivia, 2013), las mujeres tienen derecho a decidir libre y responsablemente sobre su vida reproductiva.</div>
        <div class="ejemplo-practico"><strong>Ejemplo práctico:</strong> El agresor destruye anticonceptivos y obliga a la mujer a embarazarse.</div>

        <h4>3.2.10. Violencia en servicios de salud</h4>
        <p>Trato deshumanizado, negligente, discriminatorio o coercitivo durante la atención sanitaria, especialmente en salud sexual y reproductiva.</p>
        <div class="marco-normativo"><strong>Marco Normativo / Cita:</strong> Según la Ley N.º 348 (Bolivia, 2013), la atención de salud debe respetar dignidad, consentimiento, privacidad e igualdad.</div>
        <div class="ejemplo-practico"><strong>Ejemplo práctico:</strong> Una víctima de violencia sexual es atendida sin comentarios culpabilizantes y con preservación adecuada de evidencia clínica.</div>

        <h4>3.2.11. Violencia laboral</h4>
        <p>Discriminación, hostigamiento, acoso, exclusión o restricción de oportunidades por condición de mujer, embarazo, maternidad u otros factores de género.</p>
        <div class="marco-normativo"><strong>Marco Normativo / Cita:</strong> Según la Ley N.º 348 (Bolivia, 2013), la violencia laboral afecta estabilidad, ingresos, dignidad y desarrollo profesional.</div>
        <div class="ejemplo-practico"><strong>Ejemplo práctico:</strong> Una trabajadora es amenazada con despido por rechazar insinuaciones sexuales del superior.</div>

        <h4>3.2.12. Violencia en el Sistema Educativo Plurinacional</h4>
        <p>Actos de discriminación, acoso, abuso, castigo o exclusión que afectan a mujeres y niñas en espacios educativos.</p>
        <div class="marco-normativo"><strong>Marco Normativo / Cita:</strong> Según la Ley N.º 348 (Bolivia, 2013), la comunidad educativa debe prevenir y responder a prácticas violentas y discriminatorias.</div>
        <div class="ejemplo-practico"><strong>Ejemplo práctico:</strong> Una estudiante denuncia acoso de un docente; se protege su identidad y se coordina la investigación correspondiente.</div>

        <h4>3.2.13. Violencia en el ejercicio político y liderazgo de la mujer</h4>
        <p>Acciones destinadas a impedir, restringir o menoscabar la participación, representación o liderazgo de las mujeres.</p>
        <div class="marco-normativo"><strong>Marco Normativo / Cita:</strong> Según la Ley N.º 348 (Bolivia, 2013), el ejercicio político de las mujeres debe desarrollarse libre de presión, amenaza y discriminación.</div>
        <div class="ejemplo-practico"><strong>Ejemplo práctico:</strong> Una concejala recibe amenazas para obligarla a renunciar; la denuncia se registra y se evalúa riesgo.</div>

        <h4>3.2.14. Violencia institucional</h4>
        <p>Acciones u omisiones de servidoras, servidores o instituciones que retrasan, obstaculizan o impiden el ejercicio de derechos y el acceso a servicios.</p>
        <div class="marco-normativo"><strong>Marco Normativo / Cita:</strong> Según la Ley N.º 348 (Bolivia, 2013), las instituciones deben evitar prácticas que reproduzcan violencia, impunidad o revictimización.</div>
        <div class="ejemplo-practico"><strong>Ejemplo práctico:</strong> Negarse a recibir una denuncia por falta de fotocopias constituye una barrera institucional indebida.</div>

        <h4>3.2.15. Violencia en la familia</h4>
        <p>Agresión física, psicológica, sexual, económica o de otra naturaleza dentro de relaciones familiares, afectivas, conyugales o análogas.</p>
        <div class="marco-normativo"><strong>Marco Normativo / Cita:</strong> Según la Ley N.º 348 (Bolivia, 2013), el ámbito familiar no excluye responsabilidad ni reduce la gravedad de la violencia.</div>

        <h4>3.2.16. Violencia contra los derechos y la libertad sexual</h4>
        <p>Conductas que limitan la autodeterminación sexual, el consentimiento y la libertad de decidir sobre relaciones y prácticas sexuales.</p>
        <div class="marco-normativo"><strong>Marco Normativo / Cita:</strong> Según la Ley N.º 348 (Bolivia, 2013), toda mujer tiene derecho a ejercer su sexualidad libre de coerción, violencia y discriminación.</div>
        <div class="ejemplo-practico"><strong>Ejemplo práctico:</strong> El agresor obliga a la víctima a realizar actos sexuales mediante amenazas económicas.</div>

        <h4>3.2.17. Cualquier otra forma de violencia</h4>
        <p>Cláusula abierta que permite reconocer conductas no descritas de manera expresa cuando produzcan daño o restricción de derechos por razones de género.</p>
        <div class="marco-normativo"><strong>Marco Normativo / Cita:</strong> Según la Ley N.º 348 (Bolivia, 2013), la enumeración de tipos de violencia no debe utilizarse para excluir nuevas modalidades de agresión.</div>
        <div class="ejemplo-practico"><strong>Ejemplo práctico:</strong> El control tecnológico mediante aplicaciones de rastreo se analiza como violencia aunque no figure con esa denominación específica.</div>

        <h3>4. INTERVENCIÓN POLICIAL EN SITUACIONES DE VIOLENCIA CONTRA LAS MUJERES Y LA FAMILIA</h3>
        <p>La intervención policial articula prevención, protección, acción directa e investigación. Debe ser inmediata, especializada, imparcial y centrada en la seguridad de la víctima.</p>
        <div class="marco-normativo"><strong>Marco Normativo / Cita:</strong> Según el Protocolo de la FELCV (Policía Boliviana, 2014), la actuación debe proteger la vida e integridad, evitar nuevas agresiones y asegurar elementos útiles para la investigación.</div>
        <div class="ejemplo-practico"><strong>Ejemplo práctico:</strong> Una patrulla controla al agresor, auxilia a la víctima, preserva el lugar y comunica al fiscal.</div>

        <h4>4.1. Ámbito de aplicación</h4>
        <p>Comprende hechos de violencia contra mujeres y miembros de la familia en espacios públicos o privados, independientemente de convivencia actual, vínculo formal o condición social.</p>
        <div class="marco-normativo"><strong>Marco Normativo / Cita:</strong> Según la Ley N.º 348 (Bolivia, 2013), la protección se aplica a diversas relaciones y contextos donde se ejerce violencia contra las mujeres.</div>
        <div class="ejemplo-practico"><strong>Ejemplo práctico:</strong> La FELCV interviene aunque la víctima y el agresor ya no vivan juntos.</div>

        <h4>4.2. Prevención de la violencia contra las mujeres</h4>
        <p>La prevención identifica factores de riesgo, modifica condiciones que favorecen la violencia y fortalece redes de protección antes de que ocurra o se repita el daño.</p>
        <div class="marco-normativo"><strong>Marco Normativo / Cita:</strong> Según la Ley N.º 348 y el Protocolo FELCV, la prevención es una obligación permanente que combina información, coordinación, capacitación y presencia institucional.</div>
        <div class="ejemplo-practico"><strong>Ejemplo práctico:</strong> La unidad desarrolla charlas, patrullajes focalizados y seguimiento de medidas de protección.</div>

        <h4>4.2.1. Coordinación</h4>
        <p>La coordinación conecta Policía, Fiscalía, salud, servicios legales, defensorías y redes comunitarias para evitar vacíos de protección.</p>
        <div class="marco-normativo"><strong>Marco Normativo / Cita:</strong> Según el Protocolo FELCV (Policía Boliviana, 2014), la respuesta integral exige intercambio oportuno de información y derivaciones responsables.</div>
        <div class="ejemplo-practico"><strong>Ejemplo práctico:</strong> La Policía coordina refugio temporal, atención médica y comunicación fiscal en una misma intervención.</div>

        <h4>4.2.2. Difusión</h4>
        <p>La difusión informa sobre derechos, rutas de denuncia, servicios disponibles y señales de riesgo, utilizando lenguaje accesible y canales adecuados.</p>
        <div class="marco-normativo"><strong>Marco Normativo / Cita:</strong> Según la Ley N.º 348 (Bolivia, 2013), la información pública es un componente preventivo esencial para reducir tolerancia social y facilitar denuncias.</div>
        <div class="ejemplo-practico"><strong>Ejemplo práctico:</strong> La FELCV realiza una campaña radial en idioma local con números de emergencia y pasos para pedir ayuda.</div>

        <h4>4.2.3. Capacitación</h4>
        <p>La capacitación desarrolla competencias jurídicas, técnicas y humanas para identificar violencia, evaluar riesgo, entrevistar sin revictimizar y preservar evidencia.</p>
        <div class="marco-normativo"><strong>Marco Normativo / Cita:</strong> Según el Código de Conducta y el Protocolo FELCV (Policía Boliviana, 2014, 2015), el personal debe actuar con profesionalismo, respeto, confidencialidad y enfoque de derechos.</div>
        <div class="ejemplo-practico"><strong>Ejemplo práctico:</strong> El personal practica simulaciones de entrevista y acción directa en casos de alto riesgo.</div>

        <h4>4.2.4. Evitar nuevas agresiones</h4>
        <p>La prioridad inmediata es impedir repetición o escalamiento mediante separación, control del agresor, protección, traslado seguro, medidas legales y seguimiento.</p>
        <div class="marco-normativo"><strong>Marco Normativo / Cita:</strong> Según la Ley N.º 348 (Bolivia, 2013), las autoridades deben adoptar medidas eficaces para proteger a la víctima y prevenir nuevos hechos.</div>
        <div class="ejemplo-practico"><strong>Ejemplo práctico:</strong> Se acompaña a la víctima a retirar pertenencias con resguardo policial y se verifica la prohibición de acercamiento.</div>

        <h4>4.3. Detección de violencia contra las mujeres</h4>
        <p>La detección consiste en reconocer indicadores físicos, emocionales, conductuales, sociales y contextuales aun cuando la víctima no formule una denuncia directa.</p>
        <div class="marco-normativo"><strong>Marco Normativo / Cita:</strong> Según el Protocolo FELCV (Policía Boliviana, 2014), el personal debe observar señales de temor, control, lesiones incompatibles y relatos condicionados.</div>
        <div class="ejemplo-practico"><strong>Ejemplo práctico:</strong> Durante una intervención, la mujer responde mirando al acompañante y presenta lesiones antiguas; el policía conversa con ella en privado.</div>

        <h4>4.4. Acción directa en casos de violencia contra las mujeres</h4>
        <p>La acción directa es la respuesta inicial destinada a proteger, controlar la situación, identificar participantes, preservar el lugar y comunicar a la autoridad competente.</p>
        <div class="marco-normativo"><strong>Marco Normativo / Cita:</strong> Según el Código de Procedimiento Penal y el Protocolo FELCV, los primeros intervinientes deben realizar actos urgentes sin contaminar la escena ni exceder sus atribuciones.</div>
        <div class="ejemplo-practico"><strong>Ejemplo práctico:</strong> La patrulla separa a las partes, solicita ambulancia, identifica testigos y protege un cuchillo sin manipularlo innecesariamente.</div>

        <h4>4.4.1. Actuaciones oportunas de comprobación de los hechos</h4>
        <p>Comprenden observación, verificación inicial, entrevistas breves, identificación de lesiones, registro del lugar y aseguramiento de indicios, priorizando actos que pueden perderse.</p>
        <div class="marco-normativo"><strong>Marco Normativo / Cita:</strong> Según el Protocolo FELCV (Policía Boliviana, 2014), la oportunidad y documentación de la primera intervención condicionan la calidad de la investigación posterior.</div>
        <div class="ejemplo-practico"><strong>Ejemplo práctico:</strong> Se fotografían daños y manchas antes de limpiar el lugar y se registran las palabras espontáneas de testigos.</div>

        <h3>5. REACCIÓN DE LA VÍCTIMA</h3>
        <p>Las reacciones pueden incluir miedo, silencio, ambivalencia, confusión, llanto, aparente calma o retractación. No existe una respuesta única y ninguna reacción determina por sí sola la veracidad.</p>
        <div class="marco-normativo"><strong>Marco Normativo / Cita:</strong> Según el Protocolo FELCV, el trauma y la dependencia pueden producir respuestas variables que deben ser comprendidas sin prejuicios.</div>
        <div class="ejemplo-practico"><strong>Ejemplo práctico:</strong> Una víctima relata de forma fragmentada; el entrevistador no la acusa de contradicción y permite pausas.</div>

        <h4>5.1. Definición de víctima</h4>
        <p>Víctima es la persona que sufre daño físico, psicológico, sexual, económico o patrimonial como consecuencia de una conducta violenta o delictiva.</p>
        <div class="marco-normativo"><strong>Marco Normativo / Cita:</strong> Según la normativa penal y la Ley N.º 348, la víctima es titular de derechos de información, protección, participación y trato digno.</div>
        <div class="ejemplo-practico"><strong>Ejemplo práctico:</strong> La mujer recibe información sobre el estado del caso y medidas disponibles.</div>

        <h4>5.2. Diferentes reacciones de mujeres víctimas de violencia</h4>
        <p>La conducta puede variar por miedo, trauma, dependencia económica, amenazas, vínculo afectivo, presión familiar o experiencias previas con instituciones.</p>
        <div class="marco-normativo"><strong>Marco Normativo / Cita:</strong> Según el Protocolo FELCV, la retractación o demora en denunciar no elimina automáticamente el riesgo ni invalida los hechos.</div>
        <div class="ejemplo-practico"><strong>Ejemplo práctico:</strong> La víctima vuelve con el agresor por dependencia económica; la Policía mantiene evaluación objetiva de riesgo.</div>

        <h4>5.3. Evaluación del riesgo preliminar</h4>
        <p>Proceso inmediato para estimar probabilidad y gravedad de nuevas agresiones considerando amenazas, armas, estrangulamiento, escalamiento, celos, separación, consumo de sustancias y vulnerabilidades.</p>
        <div class="marco-normativo"><strong>Marco Normativo / Cita:</strong> Según el Protocolo FELCV, la evaluación de riesgo orienta la urgencia y tipo de protección requerida.</div>
        <div class="ejemplo-practico"><strong>Ejemplo práctico:</strong> Amenazas de muerte y arma disponible determinan riesgo alto y activan medidas urgentes.</div>

        <h4>5.4. Medidas de protección a víctimas de violencia</h4>
        <p>Son decisiones destinadas a neutralizar riesgos, limitar al agresor y garantizar seguridad, pudiendo incluir alejamiento, prohibición de contacto, salida del domicilio y resguardo.</p>
        <div class="marco-normativo"><strong>Marco Normativo / Cita:</strong> Según la Ley N.º 348, las medidas de protección deben ser inmediatas, adecuadas y efectivas frente al riesgo concreto.</div>
        <div class="ejemplo-practico"><strong>Ejemplo práctico:</strong> La Policía notifica y supervisa la prohibición de acercamiento.</div>

        <h3>6. RECEPCIÓN DE LA DENUNCIA</h3>
        <p>La recepción es un acto de acceso a la justicia que debe ser sencillo, inmediato, gratuito, confidencial y libre de discriminación.</p>
        <div class="marco-normativo"><strong>Marco Normativo / Cita:</strong> Según la Ley N.º 348 y el Código de Procedimiento Penal, la denuncia activa deberes de registro, protección, comunicación e investigación.</div>
        <div class="ejemplo-practico"><strong>Ejemplo práctico:</strong> La unidad recibe una denuncia verbal sin exigir abogado ni memorial.</div>

        <h4>6.1. Definición de denuncia</h4>
        <p>Es la comunicación a una autoridad sobre un hecho presuntamente delictivo, realizada por la víctima, un tercero o por cualquier medio permitido.</p>
        <div class="marco-normativo"><strong>Marco Normativo / Cita:</strong> Según el artículo 259 del Código de Procedimiento Penal, la denuncia pone en conocimiento hechos que pueden dar lugar a investigación.</div>

        <h4>6.2. Formas de presentación de denuncia</h4>
        <p>Puede originarse por acción directa, comunicación verbal o escrita, llamada telefónica, denuncia anónima o información en redes sociales, debiendo verificarse y registrarse.</p>
        <div class="marco-normativo"><strong>Marco Normativo / Cita:</strong> Según el Protocolo FELCV, el medio de comunicación no debe impedir la respuesta cuando existen datos razonables de riesgo o delito.</div>
        <div class="ejemplo-practico"><strong>Ejemplo práctico:</strong> Una publicación en redes que anuncia una agresión inmediata genera verificación policial.</div>

        <h4>6.3. Lineamientos y actuaciones generales ante una situación de violencia</h4>
        <p>Son criterios de atención que aseguran dignidad, accesibilidad, protección y calidad del registro.</p>
        <div class="marco-normativo"><strong>Marco Normativo / Cita:</strong> Según la Ley N.º 348 y el Código de Conducta Policial, la atención debe ser respetuosa, diligente, confidencial y libre de estereotipos.</div>
        <div class="ejemplo-practico"><strong>Ejemplo práctico:</strong> El personal explica el procedimiento y confirma necesidades urgentes antes de ampliar datos.</div>

        <h4>6.3.1. No revictimización</h4>
        <p>Implica evitar repeticiones innecesarias del relato, culpabilización, confrontaciones indebidas y exposición de información íntima.</p>
        <div class="marco-normativo"><strong>Marco Normativo / Cita:</strong> Según el Protocolo FELCV, la intervención debe reducir daños secundarios producidos por el sistema.</div>
        <div class="ejemplo-practico"><strong>Ejemplo práctico:</strong> Se usa una declaración previamente registrada y no se obliga a repetir detalles ante múltiples funcionarios.</div>

        <h4>6.3.2. No formalismo</h4>
        <p>La protección no puede depender de requisitos innecesarios cuando existe riesgo o noticia de delito.</p>
        <div class="marco-normativo"><strong>Marco Normativo / Cita:</strong> Según la Ley N.º 348, la atención debe facilitar el acceso y evitar barreras burocráticas.</div>
        <div class="ejemplo-practico"><strong>Ejemplo práctico:</strong> Se recibe la denuncia aunque la víctima no tenga cédula en ese momento.</div>

        <h4>6.3.3. Gratuidad de la atención</h4>
        <p>Ningún servicio esencial de recepción, orientación, protección o investigación puede condicionarse a pago.</p>
        <div class="marco-normativo"><strong>Marco Normativo / Cita:</strong> Según la Ley N.º 348, la atención institucional a mujeres en situación de violencia debe ser gratuita.</div>
        <div class="ejemplo-practico"><strong>Ejemplo práctico:</strong> No se exige dinero por formularios, copias iniciales ni recepción de denuncia.</div>

        <h4>6.3.4. Espacio adecuado</h4>
        <p>La entrevista debe realizarse en un ambiente privado, seguro, accesible y sin presencia del agresor.</p>

        <h3>7. LINEAMIENTOS EN LOS PRINCIPALES ACTOS INVESTIGATIVOS</h3>
        <p>Los actos investigativos deben planificarse, documentarse y ejecutarse con legalidad, objetividad, enfoque de género y respeto de la cadena de custodia.</p>

        <h4>7.1. Recepción de la declaración</h4>
        <p>La declaración recoge información relevante mediante preguntas abiertas, secuencia lógica, privacidad y respeto al ritmo de la víctima.</p>

        <h4>7.2. Acciones a realizar</h4>
        <p>Incluyen planificación, identificación de fuentes, requerimientos, entrevistas, inspecciones, pericias y coordinación fiscal.</p>

        <h4>7.3. Documentar las respuestas de la víctima</h4>
        <p>El registro debe ser fiel, completo, claro y distinguir palabras de la víctima de interpretaciones del investigador.</p>

        <h4>7.4. Investigación preliminar</h4>
        <p>Busca verificar el hecho, identificar responsables, proteger a la víctima y reunir elementos iniciales para decisión fiscal.</p>

        <h4>7.5. Elaboración de actas</h4>
        <p>Las actas documentan lugar, fecha, participantes, procedimiento, hallazgos y firmas, garantizando trazabilidad.</p>

        <h4>7.6. Recolección de indicios y evidencias</h4>
        <p>Debe realizarse con método, protección personal, fijación previa, embalaje individual y registro de procedencia.</p>

        <h4>7.7. Certificado médico forense</h4>
        <p>Documento pericial que registra lesiones, incapacidad y hallazgos relevantes; debe integrarse con otras evidencias.</p>

        <h4>7.8. Cadena de custodia</h4>
        <p>Sistema de control que documenta identidad, recolección, embalaje, traslado, recepción, análisis y destino de cada evidencia.</p>

        <h3>8. ETAPAS DE LA INVESTIGACIÓN Y PLAZOS PROCESALES</h3>
        <p>El proceso penal avanza por etapas con finalidades y controles específicos. El cumplimiento de plazos evita dilaciones, protege derechos y permite decisiones oportunas.</p>

        <h4>8.1. Definición de la etapa preliminar</h4>
        <p>Fase inicial destinada a verificar la noticia criminal, proteger a la víctima y reunir elementos básicos para una decisión procesal.</p>

        <h4>8.2. Inicio y culminación de la etapa preliminar</h4>
        <p>Comienza con conocimiento del hecho y concluye con la determinación fiscal correspondiente conforme a los elementos reunidos y plazos legales.</p>

        <h4>8.3. Ampliación de la etapa preliminar</h4>
        <p>Procede excepcionalmente cuando la complejidad o diligencias pendientes justifican mayor tiempo, mediante fundamento y control legal.</p>

        <h4>8.4. Informe preliminar</h4>
        <p>Documento policial objetivo que expone hechos conocidos, diligencias, resultados, evidencias, riesgos y aspectos pendientes.</p>

        <h4>8.5. Inicio de la etapa preparatoria</h4>
        <p>Se orienta a reunir elementos suficientes para sustentar acusación, salida alternativa u otra decisión conforme a ley.</p>

        <h4>8.6. Culminación de la etapa preparatoria</h4>
        <p>Concluye cuando el fiscal adopta una determinación fundamentada sobre el destino procesal del caso.</p>

        <h4>8.7. Informe conclusivo</h4>
        <p>Integra cronología, diligencias, resultados, evidencias, dificultades y conclusiones técnicas sin sustituir la valoración jurídica fiscal.</p>

        <h4>8.8. Juicio oral</h4>
        <p>Etapa pública y contradictoria donde se produce y valora la prueba ante la autoridad judicial.</p>

        <h4>8.9. Testimonio en juicio oral</h4>
        <p>El testimonio policial debe ser veraz, preciso, imparcial y limitado a hechos observados o actuaciones documentadas.</p>

        <h3>9. CONCLUSIÓN</h3>
        <p>El estudio de género y violencia intrafamiliar demuestra que la respuesta policial eficaz depende de la integración entre normas, conceptos, habilidades de atención y técnica investigativa. La Constitución Política del Estado establece el derecho de las mujeres a vivir libres de violencia y asigna a la Policía una misión de protección social; la Ley N.º 348 desarrolla un sistema integral; la Ley Orgánica del Ministerio Público y el Código de Procedimiento Penal ordenan la investigación; y los instrumentos internacionales incorporan los estándares de igualdad, no discriminación y debida diligencia.</p>
        <div class="marco-normativo"><strong>Marco Normativo / Cita:</strong> Según la Constitución Política del Estado, la Ley N.º 348, la CEDAW y la Convención de Belém do Pará, la violencia contra las mujeres exige una respuesta estatal inmediata, coordinada, especializada y orientada a prevenir, investigar, sancionar y reparar.</div>
        <div class="ejemplo-practico"><strong>Ejemplo práctico:</strong> En un caso de alto riesgo, la aplicación integral del contenido estudiado permite que la Policía proteja a la víctima, active medidas de protección, preserve evidencia, coordine atención médica y fiscal, elabore informes objetivos y sostenga técnicamente su actuación en juicio oral.</div>

        <div class="mapa-raiz">GÉNERO Y VIOLENCIA INTRAFAMILIAR</div>
        <div class="mapa-ramas">
            <div class="mapa-rama">
                <h4>Marco Jurídico Nacional</h4>
                <ul>
                    <li>CPE: Art. 15.II, 251.I</li>
                    <li>Ley 734 (Ley Orgánica)</li>
                    <li>Ley 348 (vida libre de violencia)</li>
