<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>15 Temas — Defensa de Grado CE.FO.TE.S. 2026</title>
<style>
:root{
  --bg1:#0f1708; --bg2:#1e2c11; --bg3:#141e0a;
  --gold:#c9a227; --gold-l:#e8c95a; --gold-d:#8a6f12;
  --cream:#f2ecd8; --muted:#a9b78e;
  --line:rgba(201,162,39,.30);
  --card:rgba(255,255,255,.055); --card-2:rgba(201,162,39,.09);
  --font:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%;background:#050803;font-family:var(--font);color:var(--cream)}

/* ================= HEADER + MENÚ ================= */
.topbar{
  position:sticky;top:0;z-index:100;
  background:linear-gradient(180deg,rgba(15,23,8,.98),rgba(15,23,8,.92));
  backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);
  padding:10px 24px;
  display:flex;align-items:center;gap:18px;flex-wrap:wrap;
}
.topbar .brand{
  display:flex;align-items:center;gap:12px;
  font-size:12px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;
  color:var(--gold-l);
}
.topbar .brand img{width:38px;height:38px;object-fit:contain}
.topbar .brand .sep{width:1px;height:28px;background:var(--line)}
.topbar .brand .title{font-size:11px;color:var(--muted);letter-spacing:.05em;font-weight:600;text-transform:none}

.menu-wrap{
  flex:1;min-width:280px;max-width:640px;position:relative;
}
.menu-toggle{
  width:100%;
  background:rgba(201,162,39,.10);
  border:1px solid var(--line);
  border-radius:10px;
  padding:10px 14px;
  color:var(--cream);font-family:inherit;
  font-size:13.5px;font-weight:700;
  text-align:left;cursor:pointer;
  display:flex;align-items:center;gap:10px;
  transition:all .25s;
}
.menu-toggle:hover{background:rgba(201,162,39,.20);border-color:var(--gold)}
.menu-toggle .num{
  background:var(--gold);color:#1a2410;
  font-size:11px;font-weight:900;
  padding:2px 8px;border-radius:20px;letter-spacing:.05em;
}
.menu-toggle .lbl{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.menu-toggle .arrow{
  transition:transform .3s;font-size:11px;color:var(--gold);
}
.menu-toggle.open .arrow{transform:rotate(180deg)}

.menu-panel{
  position:absolute;top:calc(100% + 8px);left:0;right:0;
  background:linear-gradient(150deg,#0d1406,#1f2c12);
  border:1px solid var(--line);
  border-radius:12px;
  box-shadow:0 20px 50px rgba(0,0,0,.75);
  max-height:70vh;overflow-y:auto;
  padding:8px;
  display:none;
  z-index:110;
}
.menu-panel.open{display:block;animation:fadeMenu .25s ease}
@keyframes fadeMenu{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.menu-panel button{
  width:100%;text-align:left;
  background:transparent;border:none;
  color:var(--cream);font-family:inherit;
  font-size:13px;padding:10px 12px;
  border-radius:8px;cursor:pointer;
  display:flex;align-items:center;gap:12px;
  transition:all .18s;
  border-left:3px solid transparent;
}
.menu-panel button:hover{background:rgba(201,162,39,.12);border-left-color:var(--gold)}
.menu-panel button.active{
  background:rgba(201,162,39,.20);border-left-color:var(--gold-l);
  font-weight:800;color:var(--gold-l);
}
.menu-panel button .n{
  width:28px;height:28px;flex-shrink:0;
  display:grid;place-items:center;
  background:rgba(201,162,39,.15);
  border-radius:7px;
  font-size:11px;font-weight:800;color:var(--gold);
}
.menu-panel button.active .n{background:var(--gold);color:#1a2410}

/* ================= STAGE / DECK ================= */
.stage{
  padding:24px 16px 100px;
  display:flex;justify-content:center;
}
.deck{
  width:1280px;height:720px;position:relative;
  box-shadow:0 30px 90px rgba(0,0,0,.75);
  border-radius:8px;overflow:hidden;
  background:linear-gradient(150deg,var(--bg1),var(--bg2) 55%,var(--bg3));
  border:1px solid rgba(201,162,39,.35);
  transform-origin:center top;
  transition:transform .2s ease;
}
/* LOGO UNIPOL fijo */
.deck-logo-unipol{
  position:absolute;top:12px;right:18px;width:78px;height:78px;z-index:30;
  object-fit:contain;pointer-events:none;
  filter:drop-shadow(0 4px 10px rgba(0,0,0,.7));
}
.icon{width:22px;height:22px;flex-shrink:0;stroke:var(--gold);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.icon.lg{width:30px;height:30px}

/* ================= SLIDE ================= */
.slide{
  position:absolute;inset:0;padding:32px 58px 44px;
  display:flex;flex-direction:column;
  opacity:0;visibility:hidden;transform:translateY(14px) scale(.99);
  transition:opacity .5s ease,transform .5s ease,visibility .5s;
  background:linear-gradient(150deg,var(--bg1),var(--bg2) 55%,var(--bg3));
}
.slide.active{opacity:1;visibility:visible;transform:none}
.slide::before{
  content:"";position:absolute;left:0;top:0;bottom:0;width:7px;
  background:linear-gradient(180deg,var(--gold),var(--gold-d));
}

/* PORTADA DE TEMA */
.slide.tcover{
  justify-content:center;align-items:center;text-align:center;padding:44px 80px;
  background:radial-gradient(760px 420px at 50% 42%, rgba(201,162,39,.18), transparent 70%),
    linear-gradient(150deg,#0d1406,#1f2c12 55%,#0d1406);
}
.slide.tcover::before{background:linear-gradient(180deg,var(--gold),#1f5c1f)}
.tnum{font-size:12.5px;font-weight:800;letter-spacing:.24em;text-transform:uppercase;color:var(--gold);margin-bottom:4px}
.cefotes-logo{width:145px;height:145px;margin:4px 0 8px;object-fit:contain;filter:drop-shadow(0 10px 28px rgba(0,0,0,.7))}
.tcover-title{font-size:30px;line-height:1.15;font-weight:900;letter-spacing:-.5px;color:var(--cream);max-width:1050px;margin-bottom:8px}
.tcover-sub{font-size:13px;color:var(--muted);max-width:880px;line-height:1.5;margin-bottom:16px}
.tcover-foot{display:flex;gap:44px;justify-content:center;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:14px;width:100%;max-width:1000px}
.tcover-foot div{font-size:12px;color:var(--muted);line-height:1.5;text-align:center}
.tcover-foot strong{display:block;color:var(--cream);font-size:13.5px;font-weight:700}
.tcover-foot em{font-style:normal;color:var(--gold);font-size:10px;letter-spacing:.14em;text-transform:uppercase;display:block;margin-bottom:3px;font-weight:800}

/* SLIDE INTERIOR */
.kicker{font-size:11px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);margin-bottom:4px}
.stitle{font-size:26px;line-height:1.12;font-weight:800;color:var(--cream);letter-spacing:-.3px;padding-bottom:8px;border-bottom:2px solid var(--line);margin-bottom:12px}
.sbody{
  flex:1;
  display:flex;
  flex-direction:column;
  gap:14px;
  min-height:0;
  overflow:visible;
  justify-content:space-evenly;   /* ← ESTO ES LA CLAVE */
  padding:6px 0;                  /* pequeño respiro arriba/abajo */
}

/* COMPONENTES */
ul.bullets{list-style:none;display:flex;flex-direction:column;gap:6px}
ul.bullets li{position:relative;padding-left:22px;font-size:13.8px;line-height:1.45;color:var(--cream)}
ul.bullets li::before{content:"";position:absolute;left:0;top:6px;width:8px;height:8px;border-radius:2px;background:var(--gold);transform:rotate(45deg)}
ul.bullets li b{color:var(--gold-l)}

.cards{display:grid;gap:9px}
.cards.c2{grid-template-columns:repeat(2,1fr)}
.cards.c3{grid-template-columns:repeat(3,1fr)}
.cards.c4{grid-template-columns:repeat(4,1fr)}
.card{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--gold);border-radius:9px;padding:10px 12px;display:flex;flex-direction:column;gap:4px}
.card-head{display:flex;align-items:center;gap:7px}
.card-head .icon{width:17px;height:17px}
.card-head h4{font-size:12.8px;color:var(--gold-l);font-weight:800;letter-spacing:.02em;line-height:1.18}
.card p{font-size:11.6px;line-height:1.4;color:var(--cream);opacity:.94}

.quote{background:var(--card-2);border-left:4px solid var(--gold-l);border-radius:9px;padding:11px 15px;font-size:13.4px;line-height:1.45;color:var(--cream);font-style:italic}
.quote span{display:block;margin-top:4px;font-size:11.5px;font-style:normal;color:var(--gold-l);font-weight:700}

.highlight{
  background:linear-gradient(135deg,rgba(201,162,39,.20),rgba(201,162,39,.06));
  border:1px solid rgba(201,162,39,.42);border-radius:9px;
  padding:10px 14px;font-size:13px;line-height:1.42;color:var(--cream);
  display:flex;align-items:center;gap:10px;
}
.highlight b{color:var(--gold-l)}

.pill{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:8px;padding:7px 11px;font-size:11.8px;color:var(--cream)}
.pill .icon{width:17px;height:17px}
.pill b{color:var(--gold-l)}
.pills-row{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.pills-row.c2{grid-template-columns:repeat(2,1fr)}
.pills-row.c4{grid-template-columns:repeat(4,1fr)}

.icon-strip{display:flex;justify-content:space-around;align-items:center;gap:12px;background:var(--card-2);border:1px solid var(--line);border-radius:10px;padding:9px 14px}
.icon-strip .item{display:flex;flex-direction:column;align-items:center;gap:4px;flex:1;text-align:center}
.icon-strip .item .icon{width:24px;height:24px;stroke:var(--gold-l)}
.icon-strip .item span{font-size:10.3px;color:var(--cream);font-weight:700;letter-spacing:.02em;line-height:1.2}

/* CIERRE */
.cierre-idea{
  display:flex;align-items:center;gap:10px;
  background:linear-gradient(135deg,rgba(201,162,39,.22),rgba(201,162,39,.06));
  border:1px solid rgba(201,162,39,.42);
  border-left:5px solid var(--gold-l);
  border-radius:10px;padding:10px 14px;
  font-size:12.8px;line-height:1.4;color:var(--cream);
}
.cierre-idea .tag{
  flex-shrink:0;display:inline-flex;align-items:center;gap:6px;
  background:var(--gold);color:#1a2410;
  font-size:10px;font-weight:900;letter-spacing:.12em;
  padding:4px 9px;border-radius:20px;text-transform:uppercase;
}
.cierre-idea .tag svg{width:12px;height:12px;stroke:#1a2410;fill:none;stroke-width:2.4}
.cierre-idea b{color:var(--gold-l)}

/* Pie de slide */
.slide-number{position:absolute;right:58px;bottom:14px;font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.08em}
.footer-brand{position:absolute;left:58px;bottom:14px;font-size:10.5px;color:var(--muted);letter-spacing:.12em;text-transform:uppercase}

/* ================= CONTROLES ================= */
.progress{position:fixed;left:0;right:0;bottom:0;height:4px;background:rgba(255,255,255,.08);z-index:50}
.progress__bar{height:100%;width:0;background:linear-gradient(90deg,var(--gold-d),var(--gold-l));transition:width .35s ease}

.controls{
  position:fixed;right:16px;bottom:16px;z-index:60;
  display:flex;gap:8px;align-items:center;
  background:rgba(15,22,8,.85);border:1px solid var(--line);
  backdrop-filter:blur(8px);padding:6px 10px;border-radius:999px;
}
.controls button{
  width:32px;height:32px;border-radius:50%;border:none;cursor:pointer;
  background:rgba(201,162,39,.18);color:var(--cream);font-size:15px;
  display:grid;place-items:center;transition:background .2s;
}
.controls button:hover{background:var(--gold);color:#1a2410}
.controls .counter{
  font-size:12px;color:var(--cream);font-weight:700;
  padding:0 8px;min-width:62px;text-align:center;font-variant-numeric:tabular-nums;
}
.hint{
  position:fixed;left:16px;bottom:16px;z-index:60;
  font-size:11px;color:rgba(242,236,216,.45);letter-spacing:.04em;
}

/* RESPONSIVE */
@media (max-width:1400px){
  .deck{transform:scale(.85)}
}
@media (max-width:1180px){
  .deck{transform:scale(.7)}
}
@media (max-width:960px){
  .deck{transform:scale(.55)}
  .topbar{padding:8px 12px}
  .topbar .brand .title{display:none}
}
@media (max-width:720px){
  .deck{transform:scale(.42)}
  .hint{display:none}
}

/* PRINT */
@media print{
  @page{size:1280px 720px;margin:0}
  html,body{overflow:visible;background:#fff}
  .topbar,.controls,.progress,.hint{display:none !important}
  .stage{padding:0}
  .deck{transform:none !important;width:1280px;height:auto;box-shadow:none;border-radius:0}
  .slide{position:relative;opacity:1 !important;visibility:visible !important;transform:none !important;width:1280px;height:720px;page-break-after:always}
  .slide:last-child{page-break-after:auto}
}
</style>
</head>

const temas = [

   TEMA 1 — DOCTRINA E HISTORIA POLICIAL

{
  id:1, titulo:"DOCTRINA E HISTORIA POLICIAL",

let temaActual = 0;

/* ============================================================
   RENDER: CONSTRUIR SLIDES DEL TEMA ACTIVO
   ============================================================ */
function renderTema(idTema){
  temaActual = idTema;
  slideActual = 0;
  const tema = temas[idTema];
  totalSlides = tema.slides.length;

  const container = document.getElementById('slidesContainer');
  let html = '';

  tema.slides.forEach((sl, i) => {
    if (sl.tipo === 'tcover'){
      html += `
        <section class="slide tcover ${i===0?'active':''}">
          <div class="tnum">Unidad Temática N.º ${String(tema.id).padStart(2,'0')}</div>
          <img src="logo-cefotes.png" alt="CE.FO.TE.S." class="cefotes-logo" onerror="this.style.display='none'">
          <h2 class="tcover-title">${sl.titulo}</h2>
          <p class="tcover-sub">${sl.subtitulo}</p>
          <div class="tcover-foot">
            <div><em>Programa</em><strong>Nivelación Profesional · Técnico Superior</strong></div>
<div><em>Centro</em><strong>CE.FO.TE.S. — Santa Cruz</strong></div>
<div><em>Gestión</em><strong>2026</strong></div>
          </div>
          <div class="slide-number">${String(i+1).padStart(2,'0')}</div>
        </section>
      `;
    } else {
      html += `
        <section class="slide ${i===0?'active':''}">
          <div class="kicker">${sl.kicker}</div>
          <h2 class="stitle">${sl.titulo}</h2>
          <div class="sbody">${sl.contenido}</div>
          <div class="footer-brand">CE.FO.TE.S. · Defensa de Grado 2026</div>
          <div class="slide-number">${String(i+1).padStart(2,'0')}</div>
        </section>
      `;
    }
  });

  container.innerHTML = html;
  render();
}

   ============================================================ */

  const slides = document.querySelectorAll('.slide');
  slides.forEach((s,i)=> s.classList.toggle('active', i === slideActual));
  document.getElementById('counter').textContent = (slideActual+1) + ' / ' + totalSlides;
  const bar = document.getElementById('bar');
  bar.style.width = ((slideActual+1)/totalSlides*100) + '%';
}

/* ============================================================
   NAVEGACIÓN
   ============================================================ */
function ir(n){
  slideActual = Math.max(0, Math.min(totalSlides-1, n));
  render();
}
const siguiente = ()=>ir(slideActual+1);
const anterior   = ()=>ir(slideActual-1);

document.getElementById('next').onclick = siguiente;
document.getElementById('prev').onclick = anterior;
document.getElementById('full').onclick = ()=>{
  if (!document.fullscreenElement) document.documentElement.requestFullscreen();
  else document.exitFullscreen();
};

document.addEventListener('keydown', e=>{
  if (e.target.tagName === 'INPUT') return;
  switch(e.key){
    case 'ArrowRight': case 'ArrowDown': case ' ': case 'PageDown':
      e.preventDefault(); siguiente(); break;
    case 'ArrowLeft': case 'ArrowUp': case 'PageUp':
      e.preventDefault(); anterior(); break;
    case 'Home': e.preventDefault(); ir(0); break;
    case 'End':  e.preventDefault(); ir(totalSlides-1); break;
    case 'f': case 'F':
      if (!document.fullscreenElement) document.documentElement.requestFullscreen();
      else document.exitFullscreen();
      break;
  }
});

/* Swipe táctil */
let touchX = null;
document.addEventListener('touchstart', e=>touchX = e.touches[0].clientX, {passive:true});
document.addEventListener('touchend', e=>{
  if (touchX === null) return;
  const dx = e.changedTouches[0].clientX - touchX;
  if (Math.abs(dx) > 50) dx < 0 ? siguiente() : anterior();
  touchX = null;
}, {passive:true});

/* ============================================================
   MENÚ DESPLEGABLE
   ============================================================ */
function toggleMenu(){
  const panel = document.getElementById('menuPanel');
  const btn = document.getElementById('menuToggle');
  const open = panel.classList.toggle('open');
  btn.classList.toggle('open', open);
}

function construirMenu(){
  const panel = document.getElementById('menuPanel');
  panel.innerHTML = '';
  temas.forEach((t, i)=>{
    const b = document.createElement('button');
    b.innerHTML = `<span class="n">${String(t.id).padStart(2,'0')}</span><span>${t.titulo}</span>`;
    b.dataset.id = i;
    b.onclick = ()=>{
      renderTema(i);
      actualizarMenu(i);
      panel.classList.remove('open');
      document.getElementById('menuToggle').classList.remove('open');
      window.scrollTo({top:0, behavior:'smooth'});
    };
    panel.appendChild(b);
  });
}

function actualizarMenu(i){
  document.querySelectorAll('#menuPanel button').forEach(b=>{
    b.classList.toggle('active', parseInt(b.dataset.id) === i);
  });
  document.getElementById('menuNum').textContent = String(temas[i].id).padStart(2,'0');
  document.getElementById('menuLbl').textContent = temas[i].titulo;
}

/* Cerrar menú al hacer clic fuera */
document.addEventListener('click', e=>{
  const wrap = document.querySelector('.menu-wrap');
  if (wrap && !wrap.contains(e.target)){
    document.getElementById('menuPanel').classList.remove('open');
    document.getElementById('menuToggle').classList.remove('open');
  }
});

/* ============================================================
   AUTOFIT: Ajustar contenido si excede el alto disponible
   ============================================================ */
/* ============================================================
   AUTOFIT v4 — Distribución vertical + escalado inteligente
   Elimina espacios vacíos en TODAS las diapositivas
   ============================================================ */
function fitSlides(){
  document.querySelectorAll('.slide .sbody').forEach(body=>{
    // Resetear estilos previos
    body.style.transform = '';
    body.style.transformOrigin = '';
    body.style.width = '';
    body.style.justifyContent = '';
    body.style.gap = '';

    // Forzar reflow para medir correctamente
    void body.offsetHeight;

    const availH   = body.clientHeight;
    const contentH = body.scrollHeight;

    if (contentH === 0 || availH === 0) return;

    const ratio = availH / contentH;

    /* ========================================================
       CASO 1: El contenido NO CABE → escalar hacia abajo
       ======================================================== */
    if (contentH > availH + 2){
      const scale = Math.max(0.40, (availH - 4) / contentH);
      body.style.transformOrigin = 'top left';
      body.style.transform = `scale(${scale})`;
      body.style.width = `${100/scale}%`;
      body.style.justifyContent = 'flex-start';
      return;
    }

    /* ========================================================
       CASO 2: Contenido MUY pequeño (ocupa < 50%) →
       escalar hacia arriba + distribuir verticalmente
       ======================================================== */
    if (ratio > 2.0){
      const scale = Math.min(2.3, ratio * 0.85);
      body.style.transformOrigin = 'top left';
      body.style.transform = `scale(${scale})`;
      body.style.width = `${100/scale}%`;
      body.style.justifyContent = 'space-evenly';
      return;
    }

    /* ========================================================
       CASO 3: Contenido pequeño-medio (ocupa 50-87%) →
       escalar moderadamente + distribuir
       ======================================================== */
    if (ratio > 1.15){
      const scale = Math.min(1.45, ratio * 0.92);
      body.style.transformOrigin = 'top left';
      body.style.transform = `scale(${scale})`;
      body.style.width = `${100/scale}%`;
      body.style.justifyContent = 'space-evenly';
      return;
    }

    /* ========================================================
       CASO 4: Contenido casi perfecto (ocupa 87-100%) →
       solo distribuir verticalmente el poco espacio sobrante
       ======================================================== */
    if (ratio > 1.02){
      body.style.justifyContent = 'space-evenly';
    }

    /* CASO 5: ratio ≈ 1.0 → no hacer nada (ajuste perfecto) */
  });
}

/* ============================================================
   AJUSTE DE ESCALA DEL DECK SEGÚN VIEWPORT
   ============================================================ */
function resizeDeck(){
  const deck = document.getElementById('deck');
  const stage = deck.parentElement;
  const availW = stage.clientWidth;
  const availH = window.innerHeight - 130;
  const scale = Math.min(availW/1280, availH/720, 1);
  deck.style.transform = `scale(${scale})`;
  deck.style.marginBottom = `${(scale - 1) * 720}px`;
}
window.addEventListener('resize', ()=>{ resizeDeck(); fitSlides(); });

/* ============================================================
   INICIALIZACIÓN
   ============================================================ */
window.addEventListener('load', ()=>{
  construirMenu();
  actualizarMenu(0);
  renderTema(0);
  setTimeout(()=>{ fitSlides(); resizeDeck(); }, 100);
});
construirMenu();
actualizarMenu(0);
renderTema(0);
setTimeout(()=>{ fitSlides(); resizeDeck(); }, 200);
</script>
