// ================= CONTROL DE DIAPOSITIVAS =================
let slideActual = 0;
let totalSlidesActual = 1;

function cambiarSlide(direccion) {
    const slides = document.querySelectorAll('#tab-resumen .slide');
    if (slides.length === 0) return;

    // Ocultar slide actual
    slides[slideActual].classList.remove('active');

    // Calcular nuevo índice
    slideActual += direccion;

    // Limitar
    if (slideActual < 0) slideActual = 0;
    if (slideActual >= slides.length) slideActual = slides.length - 1;

    // Mostrar nuevo slide
    slides[slideActual].classList.add('active');

    // Actualizar indicador
    document.getElementById('slidesIndicador').textContent = 
        `Parte ${slideActual + 1} de ${slides.length}`;

    // Actualizar botones
    document.getElementById('btnAnterior').disabled = slideActual === 0;
    document.getElementById('btnSiguiente').disabled = slideActual === slides.length - 1;

    // Actualizar barra de progreso
    const progreso = ((slideActual + 1) / slides.length) * 100;
    document.getElementById('progressFill').style.width = progreso + '%';
}
// Función para cambiar entre pestañas
// Función para cambiar entre pestañas
function cambiarPestana(tipo) {
    document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));

    if (tipo === 'completo') {
        document.getElementById('tab-completo').classList.add('active');
        document.querySelector('.tab-btn:nth-child(1)').classList.add('active');
    } else {
        document.getElementById('tab-resumen').classList.add('active');
        document.querySelector('.tab-btn:nth-child(2)').classList.add('active');
    }
}
        // Inicializar el menú
        function inicializarMenu() {
            const menuList = document.getElementById('menuList');
            menuList.innerHTML = '';
            temas.forEach(tema => {
                const li = document.createElement('li');
                const button = document.createElement('button');
                button.textContent = tema.titulo;
                button.dataset.id = tema.id;
                button.onclick = () => cargarTema(tema.id);
                li.appendChild(button);
                menuList.appendChild(li);
            });
            // Cargar el primer tema por defecto
            cargarTema(1);
        }

        // Mostrar/ocultar menú en móviles
        function toggleMenu() {
            const sidebar = document.getElementById('sidebar');
            sidebar.classList.toggle('active');
        }

        // Buscador simple (resalta el tema que contiene la palabra)
        function buscarTexto() {
            const query = document.getElementById('buscador').value.toLowerCase();
            if (query.length < 3) return; // Buscar a partir de 3 letras

            // Buscar en el menú
            const botones = document.querySelectorAll('.menu-list button');
            let encontrado = false;
            botones.forEach(btn => {
                if (btn.textContent.toLowerCase().includes(query)) {
                    btn.style.backgroundColor = '#FFC107'; // Resaltar
                    btn.style.color = '#000';
                    if (!encontrado) {
                        // Si se encuentra, podríamos cargar el tema automáticamente, 
                        // pero es mejor que el usuario haga clic. Solo resaltamos.
                        encontrado = true;
                    }
                } else {
                    btn.style.backgroundColor = ''; // Quitar resaltado
                    btn.style.color = '';
                }
            });
            // Nota: Para buscar dentro del contenido de los temas, se necesitaría una lógica más compleja.
            // Esta función solo busca en los títulos del menú, que es lo más práctico para el usuario.
        }
        // ================= FUNCIÓN PARA ABRIR/CERRAR MAPAS CONCEPTUALES =================
        function toggleMapa(idMapa) {
            const contenido = document.getElementById(idMapa);
            const boton = document.querySelector(`[data-mapa="${idMapa}"]`);
            if (!contenido || !boton) return;

            const abierto = contenido.classList.toggle('visible');
            boton.classList.toggle('abierto', abierto);

            const textoBoton = boton.querySelector('.texto');
            if (textoBoton) {
                textoBoton.textContent = abierto
                    ? '🗺️ Ocultar Mapa Conceptual'
                    : '🗺️ Ver Mapa Conceptual';
            }
        }
        // ================= INICIALIZACIÓN =================
        window.onload = inicializarMenu;
    </script>
