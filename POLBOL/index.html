        <h1>UNIDAD TEMÁTICA No. 4</h1>
        <h2>INTRODUCCIÓN A LA INVESTIGACIÓN CRIMINAL</h2>
        <h3>INTRODUCCIÓN</h3>
        <p>La investigación criminal constituye una función esencial del sistema de justicia penal, debido a que permite transformar la noticia de un hecho presuntamente delictivo en información objetiva, verificable y jurídicamente útil. Su desarrollo exige la aplicación coordinada de conocimientos jurídicos, procedimientos policiales, técnicas criminalísticas y métodos científicos orientados al esclarecimiento de los hechos, la identificación de sus intervinientes y la protección de los derechos y garantías constitucionales.</p>
        <div class="ejemplo-practico"><strong>Ejemplo práctico:</strong> Ante el hallazgo de una persona sin vida en un inmueble, el primer servidor policial protege y delimita el lugar del hecho, comunica inmediatamente la intervención al fiscal de turno y evita el ingreso de personas no autorizadas. Posteriormente, el investigador y el personal especializado realizan la inspección técnica ocular, fijan y colectan los indicios, registran la cadena de custodia y formulan hipótesis verificables.</div>

        <h3>1. DEFINICIÓN Y CONCEPTOS GENERALES DE LA INVESTIGACIÓN POLICIAL</h3>
        <p>La investigación policial constituye el conjunto sistemático de actos técnicos, operativos y documentales ejecutados por personal policial competente para conocer un hecho presuntamente delictivo, verificar sus circunstancias, individualizar a sus posibles autores o partícipes y asegurar los elementos relevantes.</p>

        <h3>2. ASPECTOS GENERALES DE LAS ACTUACIONES INICIALES INVESTIGATIVAS DE LOS FISCALES Y LA POLICÍA</h3>
        <p>Las actuaciones iniciales comprenden las decisiones y diligencias urgentes que se activan desde la noticia criminis para proteger personas, preservar el lugar del hecho, impedir la pérdida de información y organizar la investigación.</p>

        <h4>2.1. Normas que rigen al Ministerio Público y la Policía Nacional Boliviana en el proceso penal</h4>
        <p>Este marco normativo reúne las disposiciones constitucionales, procesales, orgánicas e institucionales que regulan la persecución penal y delimitan las competencias del Ministerio Público y de la Policía Boliviana.</p>

        <h4>2.2. Funciones del Ministerio Público y de la Policía Boliviana</h4>
        <p>El Ministerio Público dirige funcionalmente la investigación, define la estrategia jurídica y promueve la acción penal pública; la Policía Boliviana ejecuta diligencias técnico-operativas, preserva escenarios, individualiza personas y recolecta elementos conforme a las instrucciones fiscales y a sus atribuciones legales.</p>

        <h4>2.3. Principios de la relación funcional del fiscal y del policía investigador</h4>
        <p>La relación funcional se sustenta en legalidad, objetividad, coordinación, jerarquía técnica, confianza profesional, comunicación inmediata y responsabilidad compartida.</p>

        <h4>2.4. Protección de derechos y garantías constitucionales en el proceso penal</h4>
        <p>La protección de derechos y garantías exige que toda diligencia respete la dignidad humana, el debido proceso, la presunción de inocencia, la defensa, la privacidad y la prohibición de tratos crueles.</p>

        <h4>2.5. Estrategias de planificación y coordinación</h4>
        <p>La planificación investigativa organiza objetivos, hipótesis, diligencias, responsables, plazos, recursos y mecanismos de evaluación.</p>

        <h4>2.6. El cuaderno de investigaciones</h4>
        <p>El cuaderno de investigaciones es el soporte físico o digital en el que se incorporan, de forma cronológica y ordenada, denuncias, informes, actas, requerimientos, resoluciones, pericias y demás antecedentes de la etapa investigativa.</p>

        <h4>2.7. Actos iniciales</h4>
        <p>Los actos iniciales son las formas procesales mediante las cuales la autoridad toma conocimiento de un posible delito y activa las primeras medidas de investigación.</p>

        <h4>2.7.1. Acción directa o intervención policial preventiva</h4>
        <p>La acción directa o intervención policial preventiva es la actuación inmediata del servidor policial ante un hecho flagrante, una situación de riesgo o una noticia urgente.</p>

        <h4>2.7.2. Denuncia</h4>
        <p>La denuncia es el acto mediante el cual una persona comunica a la autoridad competente la posible comisión de un hecho delictivo, sin asumir necesariamente la condición de parte acusadora.</p>

        <h4>2.7.3. Querella</h4>
        <p>La querella es el acto procesal por el que la víctima o quien tenga legitimación formaliza su intervención como parte, expone el hecho y solicita la persecución penal conforme a ley.</p>

        <h4>2.8. Investigación preliminar</h4>
        <p>La investigación preliminar es la fase inicial de verificación y obtención de información destinada a determinar la existencia del hecho, su relevancia penal, las personas vinculadas y las diligencias necesarias para orientar la etapa preparatoria.</p>

        <h3>3. INVESTIGACIÓN CRIMINAL</h3>
        <p>La investigación criminal es un proceso interdisciplinario y planificado que aplica técnicas policiales, criminalísticas, forenses y jurídicas para reconstruir un hecho presuntamente delictivo.</p>

        <h4>3.1. Concepto de investigación criminal</h4>
        <p>La investigación criminal es un proceso interdisciplinario y planificado que aplica técnicas policiales, criminalísticas, forenses y jurídicas para reconstruir un hecho presuntamente delictivo.</p>

        <h4>3.2. Concepto del lugar del hecho y clasificación</h4>
        <p>El lugar del hecho es el espacio físico o virtual relacionado con la preparación, ejecución, resultado u ocultamiento de una conducta investigada.</p>

        <h4>3.3. Procesamiento y registro del lugar del hecho</h4>
        <p>El procesamiento del lugar del hecho comprende protección, observación, fijación, búsqueda, señalización, recolección, embalaje y entrega de indicios.</p>

        <h4>3.4. Inspección técnica ocular en el lugar del hecho</h4>
        <p>La inspección técnica ocular es el examen sistemático, directo y especializado del lugar del hecho para reconocer su configuración, identificar indicios, establecer relaciones espaciales y orientar hipótesis investigativas.</p>

        <h4>3.5. Reactivos y soluciones para el procesamiento de huellas papilares</h4>
        <p>Los reactivos y soluciones para huellas papilares son sustancias y procedimientos empleados para hacer visibles impresiones latentes según el tipo de residuo, la porosidad, el color y el estado del soporte.</p>

        <h4>3.5.1. Reveladores físicos pulverulentos</h4>
        <p>Los reveladores físicos pulverulentos son polvos finos que se adhieren selectivamente a componentes grasos y húmedos del residuo papilar sobre superficies, principalmente no porosas.</p>

        <h4>3.5.2. Aplicadores de reactivos en polvo</h4>
        <p>Los aplicadores de reactivos en polvo son instrumentos diseñados para depositar el revelador de manera uniforme y con mínima fricción.</p>

        <h4>3.5.3. Técnicas para polvorear huellas latentes</h4>
        <p>Las técnicas de polvoreado consisten en cargar moderadamente el aplicador, retirar el exceso y efectuar movimientos suaves siguiendo el flujo aparente de las crestas.</p>

        <h4>3.5.4. Reveladores químicos</h4>
        <p>Los reveladores químicos reaccionan con componentes específicos del residuo papilar, como aminoácidos, sales o lípidos, produciendo coloración o fluorescencia.</p>

        <h4>3.5.5. Reactivos gaseosos</h4>
        <p>Los reactivos gaseosos actúan por vaporización y deposición sobre residuos papilares.</p>

        <h4>3.5.6. Reveladores líquidos</h4>
        <p>Los reveladores líquidos son formulaciones aplicadas por inmersión, aspersión o humectación controlada para reaccionar o adherirse al residuo papilar.</p>

        <h3>4. INDICIO, EVIDENCIA Y PRUEBA</h3>
        <p>Indicio, evidencia y prueba representan etapas conceptualmente diferenciadas del conocimiento del hecho. El indicio es un signo inicialmente relacionado; la evidencia es el elemento localizado y técnicamente tratado que aporta información; y la prueba es el resultado incorporado y valorado conforme a las reglas del proceso.</p>

        <h4>4.1. La evidencia</h4>
        <p>La evidencia es el elemento material, documental, digital o testimonial obtenido legalmente y vinculado con un hecho investigado, susceptible de análisis y valoración.</p>

        <h4>4.2. La prueba</h4>
        <p>La prueba es el resultado procesalmente incorporado y controvertido ante la autoridad jurisdiccional, apto para sustentar una decisión sobre los hechos.</p>

        <h4>4.3. Clasificación de las evidencias</h4>
        <p>La clasificación de evidencias organiza los elementos según su modo de percepción, naturaleza, relación con el hecho, capacidad demostrativa y tratamiento técnico.</p>

        <h4>4.3.1. La evidencia directa o testifical</h4>
        <p>La evidencia directa o testifical es la información que se refiere de manera inmediata al hecho investigado, particularmente mediante la percepción y declaración de una persona.</p>

        <h4>4.3.2. La evidencia circumstantial</h4>
        <p>La evidencia circumstantial es el conjunto de hechos secundarios acreditados que, enlazados mediante inferencias lógicas, permiten aproximarse a la reconstrucción del hecho principal.</p>

        <h4>4.3.3. La evidencia real, física o material</h4>
        <p>La evidencia real, física o material es el objeto, sustancia, rastro o soporte tangible relacionado con el hecho, cuya observación o examen técnico puede aportar información verificable.</p>

        <h3>5. DEFINICIÓN Y CONCEPTOS GENERALES DE LA PAPILOSCOPIA</h3>
        <p>La papiloscopia es la disciplina de identificación humana que estudia los diseños formados por crestas y surcos papilares en dedos, palmas y plantas.</p>

        <h4>5.1. Principios en los que se funda la papiloscopia</h4>
        <p>Los principios de la papiloscopia son fundamentos biológicos y técnicos que justifican el uso identificativo de los dibujos papilares.</p>

        <h4>5.1.1. Inmutabilidad</h4>
        <p>La inmutabilidad es la propiedad según la cual el diseño papilar conserva sus rasgos esenciales durante la vida, salvo alteraciones profundas que destruyan la dermis.</p>

        <h4>5.1.2. Perennidad</h4>
        <p>La perennidad es la persistencia temporal de las crestas papilares desde su formación prenatal hasta la descomposición de los tejidos.</p>

        <h4>5.1.3. Variedad infinita y universalidad</h4>
        <p>La variedad infinita y universalidad es el principio que reconoce que los dibujos papilares están presentes en todas las personas y ofrecen combinaciones morfológicas suficientemente diversas para individualizarlas.</p>

        <h4>5.2. Ramas de la papiloscopia</h4>
        <p>Las ramas de la papiloscopia se diferencian según la región anatómica o el detalle microscópico estudiado.</p>

        <h4>5.2.1. Dactiloscopia</h4>
        <p>La dactiloscopia es la disciplina de la papiloscopia dedicada al estudio, clasificación, archivo y comparación de los dibujos papilares de los dedos de las manos.</p>

        <h4>5.2.2. Palametoscopia y queiloscopia</h4>
        <p>La palametoscopia estudia los diseños papilares de las palmas de las manos; la queiloscopia examina los surcos y patrones de los labios.</p>

        <h4>5.2.3. Pelmatoscopia y paloscopia</h4>
        <p>La pelmatoscopia estudia las crestas papilares de las plantas de los pies, mientras la paloscopia se orienta al análisis general de rastros plantares.</p>

        <h4>5.2.4. Poroscopia</h4>
        <p>La poroscopia es la rama de la identificación papilar que estudia la forma, dimensión, ubicación y relación de los poros sudoríparos sobre las crestas.</p>

        <h4>5.3. Dibujo papilar</h4>
        <p>El dibujo papilar es la configuración natural de crestas, surcos, poros y particularidades presentes en la piel de fricción.</p>

        <h4>5.3.1. Surco interpapilar</h4>
        <p>El surco interpapilar es la depresión lineal que separa dos crestas papilares contiguas y contribuye a delimitar el diseño observable en una impresión.</p>

        <h4>5.3.2. Cresta papilar</h4>
        <p>La cresta papilar es el relieve epidérmico lineal presente en las superficies de fricción, portador de poros sudoríparos y de particularidades útiles para la identificación.</p>

        <h4>5.4. Impresión papilar</h4>
        <p>La impresión papilar es la reproducción deliberada y controlada del dibujo papilar obtenida mediante entintado, escaneo u otro procedimiento técnico.</p>

        <h4>5.5. Huella papilar</h4>
        <p>La huella papilar es el rastro involuntario visible, latente o plástico que dejan las crestas papilares al entrar en contacto con una superficie.</p>

        <h4>5.6. Dactiloscopia</h4>
        <p>La dactiloscopia es la disciplina de la papiloscopia dedicada al estudio, clasificación, archivo y comparación de los dibujos papilares de los dedos de las manos.</p>

        <h4>5.6.1. Sistema Argentino «Juan Vucetich Covacevich»</h4>
        <p>El sistema de Juan Vucetich es un método decadactilar de clasificación que organiza los dactilogramas en cuatro tipos fundamentales y los expresa mediante símbolos para facilitar archivo, búsqueda e identificación.</p>

        <h4>5.6.2. Toma de impresiones dactilares</h4>
        <p>La toma de impresiones dactilares es el procedimiento técnico destinado a obtener reproducciones nítidas, completas y ordenadas de los diez dedos.</p>

        <h4>5.6.3. Grupos fundamentales</h4>
        <p>Los grupos fundamentales son categorías morfológicas empleadas para clasificar dactilogramas según la presencia y posición de deltas, núcleos y recorridos de crestas.</p>

        <h4>5.6.3.1. Arco</h4>
        <p>El arco es la configuración dactilar en la que las crestas ingresan por un lado del dactilograma, se elevan suavemente en la zona central y salen por el lado opuesto, sin constituir un delta típico.</p>

        <h4>5.6.3.2. Presilla interna</h4>
        <p>La presilla interna es el tipo fundamental con un delta y un núcleo, cuyas crestas forman asas que se abren hacia el lado interno de la mano considerada.</p>

        <h4>5.6.3.3. Presilla externa</h4>
        <p>La presilla externa es el tipo fundamental con un delta y un núcleo, cuyas crestas forman asas que se abren hacia el lado externo de la mano considerada.</p>

        <h4>5.6.3.4. Verticilo</h4>
        <p>El verticilo es el tipo dactiloscópico caracterizado por dos deltas y un núcleo con crestas de recorrido circular, espiralado u ovoide.</p>

        <h4>5.6.4. Adaptación al Sistema Dactiloscópico Boliviano</h4>
        <p>La adaptación al Sistema Dactiloscópico Boliviano aplica los principios del método vucetichista a los procedimientos nacionales de registro, archivo y consulta.</p>

        <h4>5.6.4.1. Individualidad dactiloscópica</h4>
        <p>La individualidad dactiloscópica es la expresión clasificatoria obtenida de los diez dactilogramas de una persona.</p>

        <h4>5.6.4.1.1. Serie</h4>
        <p>La serie es la parte superior o inicial de la fórmula dactiloscópica y se integra con el tipo del pulgar derecho y los valores asignados a los restantes dedos de la mano derecha.</p>

        <h4>5.6.4.1.2. Sección</h4>
        <p>La sección es la parte inferior o complementaria de la fórmula dactiloscópica y se forma con el tipo del pulgar izquierdo y los valores de los demás dedos de esa mano.</p>

        <h4>5.6.5. Técnicas para una comparación dactiloscópica</h4>
        <p>La comparación dactiloscópica confronta una impresión conocida con una huella cuestionada mediante análisis, comparación, evaluación y verificación.</p>

        <h4>5.6.6. Teratología dactilar</h4>
        <p>La teratología dactilar estudia anomalías congénitas o adquiridas que modifican el número, forma, tamaño o superficie papilar de los dedos.</p>

        <h4>5.6.6.1. Anomalías congénitas</h4>
        <p>Las anomalías congénitas son alteraciones presentes desde el desarrollo embrionario que afectan la anatomía o el dibujo papilar.</p>

        <h4>5.6.6.1.1. Polidactilia</h4>
        <p>La polidactilia es la anomalía congénita caracterizada por la presencia de uno o más dedos supernumerarios.</p>

        <h4>5.6.6.1.2. Ectrodactilia</h4>
        <p>La ectrodactilia es la anomalía congénita consistente en la ausencia total o parcial de uno o varios dedos.</p>

        <h4>5.6.6.1.3. Sindactilia</h4>
        <p>La sindactilia es la unión congénita de dos o más dedos por tejido blando o por estructuras óseas.</p>

        <h4>5.6.6.1.4. Macrodactilia</h4>
        <p>La macrodactilia es el crecimiento desproporcionado de uno o varios dedos respecto del tamaño normal de la mano.</p>

        <h4>5.6.6.1.5. Microdactilia</h4>
        <p>La microdactilia es el desarrollo reducido de uno o varios dedos, con dimensiones inferiores a las esperadas.</p>

        <h4>5.6.6.1.6. Bifidas</h4>
        <p>Las bifidas son alteraciones en las que un dedo presenta duplicación o división parcial de sus componentes distales.</p>

        <h4>5.6.6.2. Anomalías adquiridas</h4>
        <p>Las anomalías adquiridas son alteraciones originadas después del nacimiento por traumatismos, enfermedades o intervenciones que afectan la anatomía o el dibujo papilar.</p>

        <h4>5.6.6.2.1. Amputado</h4>
        <p>El amputado es la condición adquirida derivada de la pérdida total o parcial de un dedo, que modifica la fórmula y el registro dactiloscópico.</p>

        <h4>5.6.6.2.2. Cicatriz</h4>
        <p>La cicatriz es la alteración adquirida del tejido papilar que puede introducir líneas, interrupciones o deformaciones permanentes útiles como rasgos complementarios.</p>

        <h4>5.6.6.2.3. Mal de Meleda</h4>
        <p>El mal de Meleda es la queratodermia palmoplantar hereditaria que produce engrosamiento marcado de la piel y puede dificultar la obtención y lectura de impresiones papilares.</p>

        <h3>6. CADENA DE CUSTODIA</h3>
        <p>La cadena de custodia es el sistema documentado de control que acompaña a indicios, evidencias y muestras desde su localización hasta su disposición final.</p>

        <h4>6.1. Reglas generales de la cadena de custodia</h4>
        <p>Las reglas generales exigen identificación inequívoca, mínima manipulación, embalaje compatible, sellado, rotulado, registro cronológico y entrega formal entre responsables.</p>

        <h4>6.2. Reglas que debe cumplir el sistema de cadena de custodia</h4>
        <p>El sistema debe ser continuo, verificable, individualizado, seguro y documentado.</p>

        <h4>6.3. Consideraciones generales</h4>
        <p>Las consideraciones generales comprenden la valoración previa del riesgo, la naturaleza del indicio, las condiciones ambientales, la bioseguridad y la competencia del personal.</p>

        <h4>6.3.1. Importancia de la protección y valoración del lugar del hecho</h4>
        <p>La protección y valoración del lugar del hecho evita el ingreso innecesario, la pérdida, contaminación, desplazamiento o incorporación de elementos ajenos.</p>

        <h4>6.4. Manejo por personal especializado</h4>
        <p>El manejo especializado supone que la búsqueda, recolección y tratamiento sean realizados por personal capacitado, con equipos adecuados y protocolos de bioseguridad.</p>

        <h4>6.4.1. Responsabilidad de la aplicación del sistema de cadena de custodia</h4>
        <p>La responsabilidad recae en toda persona que localiza, recolecta, recibe, transporta, custodia, analiza o dispone un elemento.</p>

        <h4>6.4.2. Individualización y codificación</h4>
        <p>La individualización asigna a cada elemento un identificador único vinculado con el caso, el lugar y el responsable de la colección.</p>

        <h4>6.4.3. Medidas de seguridad durante la colección</h4>
        <p>Las medidas de seguridad durante la colección incluyen uso de elementos de protección personal, cambio de guantes entre indicios, instrumental limpio, control de accesos y separación de muestras incompatibles.</p>

        <h4>6.4.4. Cuidados durante el transporte</h4>
        <p>Durante el transporte deben mantenerse el sellado, la estabilidad física, la temperatura, la ventilación y la posición requeridas por la evidencia.</p>

        <h4>6.4.5. Clasificación de la evidencia por su naturaleza</h4>
        <p>La clasificación por naturaleza distingue evidencias biológicas, químicas, físicas, documentales, digitales, balísticas, lofoscópicas y otras.</p>

        <h4>6.5. Fases, pasos o eslabones de la cadena de custodia</h4>
        <p>Las fases de la cadena de custodia ordenan el ciclo de vida de la evidencia en colección, custodia, análisis y disposición final.</p>

        <h4>6.5.1. Primera fase: la colección</h4>
        <p>La colección comprende localización, fijación, levantamiento, identificación, embalaje, sellado y rotulado inicial.</p>

        <h4>6.5.2. Segunda fase: la custodia</h4>
        <p>La custodia comprende recepción, almacenamiento, control de acceso, conservación y registro de movimientos.</p>

        <h4>6.5.3. Tercera fase: el análisis</h4>
        <p>El análisis es la fase en la que el laboratorio recibe, verifica y examina la evidencia mediante métodos validados.</p>

        <h4>6.5.4. Cuarta fase: disposición final</h4>
        <p>La disposición final consiste en la devolución, conservación prolongada, destrucción o entrega del elemento según decisión legal y protocolo institucional.</p>

        <h4>6.6. Aspectos técnicos de la remisión de evidencias y muestras al laboratorio</h4>
        <p>La remisión al laboratorio requiere solicitud pericial clara, descripción del elemento, pregunta técnica, antecedentes necesarios, embalaje y preservación adecuados, además de documentación de cadena de custodia.</p>

        <h4>6.7. La autopsia médico forense</h4>
        <p>La autopsia médico-forense es el examen sistemático externo e interno de un cadáver practicado por profesional competente para establecer causa y mecanismo de muerte, estimar data, identificar lesiones y obtener muestras.</p>

        <h4>6.7.1. Casos de autopsia obligatoria</h4>
        <p>La autopsia resulta obligatoria o especialmente necesaria en muertes violentas, sospechosas, súbitas, no explicadas, bajo custodia o cuando exista duda sobre causa e identidad.</p>

        <h4>6.8. Levantamiento legal del cadáver</h4>
        <p>El levantamiento legal del cadáver es la diligencia interdisciplinaria realizada en el lugar donde se encuentra el cuerpo para documentar posición, estado, vestimenta, lesiones visibles, signos cadavéricos y relación con el entorno.</p>

        <h4>6.8.1. Examen interno o autopsia propiamente dicha</h4>
        <p>El examen interno comprende la apertura ordenada de cavidades y la revisión de órganos, tejidos y estructuras para identificar lesiones, enfermedades y mecanismos fisiopatológicos.</p>

        <h4>6.8.2. Tanatología forense</h4>
        <p>La tanatología forense es el área médico-legal que estudia la muerte, sus signos, mecanismos, transformaciones cadavéricas y estimación del intervalo post mortem.</p>

        <h3>7. COORDINACIÓN INTERINSTITUCIONAL EN LA INVESTIGACIÓN PENAL</h3>
        <p>La coordinación interinstitucional es el conjunto de mecanismos mediante los cuales Ministerio Público, Policía, institutos forenses, laboratorios y otras entidades articulan competencias, información y recursos.</p>

        <h4>7.1. Finalidad</h4>
        <p>La finalidad es alcanzar una investigación objetiva, eficiente y respetuosa de derechos mediante la integración de capacidades institucionales.</p>

        <h4>7.2. Concepto del cuaderno de investigaciones</h4>
        <p>El cuaderno de investigaciones es el soporte físico o digital en el que se incorporan, de forma cronológica y ordenada, denuncias, informes, actas, requerimientos, resoluciones, pericias y demás antecedentes de la etapa investigativa.</p>

        <h4>7.3. Relación entre fiscal e investigador</h4>
        <p>La relación entre fiscal e investigador es funcional y complementaria: el fiscal orienta jurídicamente, define prioridades y controla legalidad; el investigador propone y ejecuta actos técnico-operativos, informa avances y sustenta necesidades.</p>

        <h4>7.4. Características del cuaderno de investigaciones</h4>
        <p>El cuaderno de investigaciones debe ser cronológico, completo, legible, foliado o indexado, reservado en los límites legales y accesible para control autorizado.</p>

        <h4>7.5. Utilidad del cuaderno de investigaciones</h4>
        <p>Su utilidad radica en concentrar antecedentes, facilitar seguimiento, respaldar decisiones, preparar audiencias y preservar continuidad cuando cambian los responsables.</p>

        <h4>7.6. Contenido</h4>
        <p>El contenido comprende noticia inicial, actas, informes, entrevistas, requerimientos, resoluciones, pericias, registros de cadena de custodia, comunicaciones y demás piezas relevantes.</p>

        <h4>7.7. La coordinación interinstitucional en la etapa preparatoria</h4>
        <p>En la etapa preparatoria, la coordinación articula la teoría del caso provisional con diligencias policiales, periciales y fiscales.</p>

        <h4>7.8. Elaboración del informe conclusivo</h4>
        <p>El informe conclusivo sintetiza las actuaciones realizadas, metodología, resultados, elementos recolectados, personas identificadas y conclusiones investigativas.</p>

        <h4>7.9. Declaración en juicio oral</h4>
        <p>La declaración del investigador en juicio oral comunica de manera clara, objetiva y técnica lo que realizó y observó personalmente.</p>

        <h3>CONCLUSIÓN</h3>
        <p>La investigación criminal constituye un proceso técnico, científico, jurídico y coordinado que permite transformar la noticia de un hecho presuntamente delictivo en información objetiva, verificable y útil para la administración de justicia. Su eficacia depende de la correcta articulación entre el Ministerio Público, la Policía Boliviana y los especialistas forenses, así como del respeto irrestricto de los derechos y garantías constitucionales durante cada actuación investigativa.</p>

        <h1>UNIDAD TEMÁTICA No. 5</h1>
        <h2>EDUCACIÓN VIAL E INVESTIGACIÓN DE ACCIDENTES DE TRÁNSITO</h2>
        <h3>INTRODUCCIÓN</h3>
        <p>La educación vial y la investigación de hechos de tránsito constituyen campos complementarios de la función policial. La primera se orienta a prevenir riesgos mediante la formación de conductores, peatones y demás usuarios de la vía; la segunda busca reconstruir técnicamente un suceso, identificar sus causas y proporcionar elementos objetivos para la determinación de responsabilidades.</p>
        <div class="ejemplo-practico"><strong>Ejemplo práctico:</strong> Ante un atropello ocurrido en una avenida urbana, la educación vial permite valorar si el peatón y el conductor conocían y respetaban las normas de cruce, velocidad y prioridad; paralelamente, la investigación policial establece la posición de los involucrados, las huellas, la visibilidad, el estado del vehículo y las declaraciones disponibles.</div>

        <h3>1. CONSIDERACIONES GENERALES Y LEGALES</h3>
        <p>Comprenden el marco normativo e institucional que delimita la actuación de autoridades, investigadores, conductores y demás usuarios de la vía. Su estudio permite establecer qué órgano puede intervenir, qué norma resulta aplicable y qué consecuencias jurídicas pueden derivarse de un hecho de tránsito.</p>

        <h4>1.1. Definición de jurisdicción y competencia</h4>
        <p>La jurisdicción es la potestad estatal de administrar justicia y resolver controversias mediante órganos legalmente establecidos; la competencia es la medida concreta de esa potestad, distribuida por materia, territorio, grado o función.</p>

        <h4>1.2. Diferencia entre jurisdicción y competencia</h4>
        <p>La diferencia esencial radica en que la jurisdicción es una potestad general atribuida por el ordenamiento jurídico, mientras que la competencia es su distribución práctica.</p>

        <h4>1.3. Aplicación del Código Nacional de Tránsito con relación a la jurisdicción y competencia</h4>
        <p>El Código y Reglamento de Tránsito asignan funciones de regulación, control, investigación y sanción administrativa, articulando la actuación policial con otras autoridades.</p>

        <h4>1.4. Disposiciones relativas a la legislación de tránsito</h4>
        <p>Son el conjunto de reglas que ordenan la circulación, establecen deberes para conductores y peatones, regulan condiciones técnicas de los vehículos y fijan mecanismos de control.</p>

        <h4>1.5. Responsabilidad penal y civil</h4>
        <p>La responsabilidad penal surge cuando la conducta vinculada al tránsito encuadra en un delito y puede atribuirse al autor con base en dolo o culpa; la responsabilidad civil se refiere a la obligación de reparar daños personales, materiales o patrimoniales.</p>

        <h3>2. ELEMENTOS DEL TRÁNSITO</h3>
        <p>El tránsito es un sistema compuesto por la interacción dinámica entre persona, vehículo y vía. La seguridad depende del equilibrio entre estos elementos, porque una falla en cualquiera de ellos puede alterar el desplazamiento y aumentar la probabilidad de un hecho dañoso.</p>

        <h4>2.1. Factor humano</h4>
        <p>Comprende capacidades, decisiones, conocimientos, estados físicos y emocionales de conductores, peatones y pasajeros.</p>

        <h4>2.2. Factor vehículo</h4>
        <p>Se refiere a las condiciones mecánicas, estructurales y de seguridad del automotor.</p>

        <h4>2.3. Factor vía</h4>
        <p>Comprende el diseño geométrico, superficie, señalización, iluminación, visibilidad, drenaje, obstáculos y condiciones ambientales que afectan la circulación.</p>

        <h3>3. NORMAS DE CIRCULACIÓN DE LOS VEHÍCULOS</h3>
        <p>Son reglas obligatorias que organizan desplazamientos, prioridades, maniobras, velocidad y uso del espacio vial.</p>

        <h4>3.1. De la circulación de vehículos</h4>
        <p>La circulación implica el desplazamiento controlado del vehículo conforme al sentido autorizado, carril, señalización y condiciones de seguridad.</p>

        <h4>3.2. Prohibiciones</h4>
        <p>Las prohibiciones viales impiden conductas que generan peligro o desorden, como circular en sentido contrario, conducir bajo efectos de alcohol, realizar maniobras temerarias o utilizar vehículos en condiciones inseguras.</p>

        <h4>3.3. Circulación preferencial</h4>
        <p>Es el régimen de prioridad otorgado a determinados vehículos o usuarios por razones de emergencia, seguridad o servicio público.</p>

        <h4>3.4. Circulación dentro el radio urbano</h4>
        <p>En áreas urbanas la circulación exige especial atención por la alta interacción entre vehículos, peatones, ciclistas, transporte público e intersecciones.</p>

        <h4>3.5. Circulación dentro el área rural</h4>
        <p>En vías rurales existen mayores velocidades operativas, curvas prolongadas, pendientes, animales, baja iluminación y distancias extensas.</p>

        <h4>3.6. Adelantamientos</h4>
        <p>El adelantamiento es una maniobra de sobrepaso que exige visibilidad, distancia, señalización y ausencia de riesgo para quienes circulan en sentido contrario o por el mismo carril.</p>

        <h4>3.7. Estacionamientos, paradas y detenciones</h4>
        <p>La detención es una inmovilización impuesta por el tránsito; la parada es breve y voluntaria para ascenso, descenso o necesidad inmediata; el estacionamiento supone permanencia más prolongada.</p>

        <h4>3.8. Velocidades</h4>
        <p>La velocidad debe ser legal y, además, segura para las condiciones reales. Una velocidad inferior al límite puede resultar imprudente si la visibilidad, la lluvia o la presencia de peatones exigen mayor reducción.</p>

        <h3>4. SEÑALIZACIÓN</h3>
        <p>La señalización vial es el sistema de mensajes visuales, sonoros y manuales destinado a regular, advertir y orientar a los usuarios.</p>

        <h4>4.1. Concepto</h4>
        <p>La señal de tránsito es un dispositivo convencional que comunica una obligación, prohibición, advertencia o información.</p>

        <h4>4.2. Requisitos fundamentales</h4>
        <p>Las señales deben ser necesarias, visibles, legibles, uniformes, comprensibles y ubicadas con anticipación suficiente.</p>

        <h4>4.3. Clasificación de las señales</h4>
        <p>Las señales se clasifican, principalmente, en reglamentarias, preventivas e informativas.</p>

        <h4>4.4. Señales reglamentarias como norma impositiva</h4>
        <p>Las señales reglamentarias establecen obligaciones y prohibiciones de cumplimiento obligatorio.</p>

        <h4>4.5. Otras señales: bocinas, pitos y manuales</h4>
        <p>Además de la señalización fija, existen señales acústicas y manuales emitidas por vehículos o agentes.</p>

        <h3>5. INFRACCIONES Y SANCIONES</h3>
        <p>Las infracciones son incumplimientos de deberes viales; las sanciones son respuestas jurídicas destinadas a corregir, prevenir y reprochar esas conductas.</p>

        <h4>5.1. Concepto de infracción en materia de tránsito</h4>
        <p>Es la acción u omisión que vulnera una disposición de tránsito sin perjuicio de que, por su gravedad o resultado, también pueda constituir delito.</p>

        <h4>5.2. Clasificación de las infracciones</h4>
        <p>Las infracciones pueden ordenarse según gravedad, conducta, riesgo generado o consecuencia.</p>

        <h4>5.3. Concepto de sanción</h4>
        <p>La sanción es la consecuencia prevista por el ordenamiento ante una infracción comprobada.</p>

        <h4>5.4. Clases de sanciones</h4>
        <p>Las sanciones pueden incluir multas, suspensión o restricción de autorizaciones, retención de documentos o vehículos y otras medidas previstas legalmente.</p>

        <h4>5.5. Compensación de las sanciones</h4>
        <p>La compensación alude a mecanismos legalmente previstos para sustituir, cumplir o regularizar determinadas sanciones, sin eliminar la responsabilidad ni permitir acuerdos contrarios a la ley.</p>

        <h4>5.6. Sanción a menores de edad, inmunidad, impunidad</h4>
        <p>La intervención frente a menores debe considerar su régimen especial de protección y responsabilidad.</p>

        <h4>5.7. Sistema actual de sanciones</h4>
        <p>Es el conjunto vigente de infracciones, procedimientos, autoridades y consecuencias aplicables.</p>

        <h3>6. CONSIDERACIONES GENERALES EN INVESTIGACIONES DE HECHOS DE TRÁNSITO</h3>
        <p>La investigación de tránsito es un proceso técnico-jurídico destinado a establecer qué ocurrió, cómo ocurrió, por qué ocurrió y quiénes intervinieron.</p>

        <h4>6.1. Definición de accidente de tránsito</h4>
        <p>Es un suceso no intencional vinculado con la circulación, que produce daños personales o materiales.</p>

        <h4>6.2. Definición de hecho de tránsito</h4>
        <p>Es una categoría amplia que comprende acontecimientos relacionados con la circulación, tengan o no resultado dañoso.</p>

        <h4>6.3. Clases de accidente</h4>
        <p>Los accidentes pueden distinguirse por número de vehículos, forma de contacto, usuarios involucrados, lugar o resultado.</p>

        <h4>6.4. Clasificación de accidentes de tránsito</h4>
        <p>La clasificación organiza los sucesos según criterios normativos y técnicos.</p>

        <h4>6.4.1. Según el Código de Tránsito</h4>
        <p>Es la categorización prevista en la normativa nacional para identificar tipos de sucesos y orientar su tratamiento administrativo o investigativo.</p>

        <h4>6.4.2. Según criterio técnico</h4>
        <p>Es la clasificación basada en dinámica, trayectorias, zonas de contacto y secuencia de acontecimientos.</p>

        <h4>6.5. Terminología del accidente</h4>
        <p>Es el vocabulario especializado utilizado para describir con precisión formas de impacto, pérdida de estabilidad y desplazamientos.</p>

        <h4>6.5.1. Colisión</h4>
        <p>Es el encuentro violento entre dos o más vehículos en movimiento o cuando al menos uno participa activamente en la dinámica.</p>

        <h4>6.5.2. Choque</h4>
        <p>Es el impacto de un vehículo contra un objeto fijo o relativamente inmóvil, como muro, poste, árbol o barrera.</p>

        <h4>6.5.3. Atropello</h4>
        <p>Es el impacto de un vehículo contra una persona, generalmente seguido de proyección, caída o contacto secundario.</p>

        <h4>6.5.4. Atrccionamiento</h4>
        <p>Es la compresión de una persona o vehículo entre dos superficies, una de las cuales suele estar en movimiento.</p>

        <h4>6.5.5. Arrollamiento</h4>
        <p>Ocurre cuando una o más ruedas pasan sobre el cuerpo de una persona u objeto después del contacto inicial.</p>

        <h4>6.5.6. Vuelco</h4>
        <p>Es la pérdida de estabilidad que provoca rotación del vehículo sobre su eje longitudinal o transversal, con apoyo sucesivo en laterales o techo.</p>

        <h4>6.5.7. Embarrancamiento</h4>
        <p>Es la caída o desplazamiento de un vehículo por una pendiente pronunciada, barranco o desnivel profundo fuera de la plataforma vial.</p>

        <h4>6.5.8. Encuentamiento</h4>
        <p>Es la salida parcial o total de la calzada con ingreso del vehículo a una cuneta lateral.</p>

        <h4>6.6. Nomenclatura de impactos</h4>
        <p>Es el sistema para identificar zonas de contacto mediante referencias frontal, posterior, lateral, angular y otras.</p>

        <h3>7. ETAPAS DE LA INVESTIGACIÓN</h3>
        <p>La investigación se organiza en fases sucesivas: averiguación, anotación, análisis, determinación de causas, elaboración de informes y acciones complementarias.</p>

        <h4>7.1. Averiguación de los hechos</h4>
        <p>Es la fase inicial destinada a obtener información sobre participantes, secuencia, condiciones y consecuencias.</p>

        <h4>7.1.1. Entrevista de los protagonistas, testigos, etc.</h4>
        <p>La entrevista busca obtener relatos espontáneos sobre percepciones, acciones y tiempos.</p>

        <h4>7.1.2. Comprobación del estado físico y anímico de los protagonistas del hecho</h4>
        <p>Consiste en observar lesiones, orientación, alteración emocional, fatiga y posibles signos de consumo de sustancias.</p>

        <h4>7.1.3. Comprobación de las condiciones del vehículo</h4>
        <p>Incluye inspección de sistemas de seguridad, daños, carga, documentación y posibles fallas preexistentes.</p>

        <h4>7.1.4. Comprobación de las condiciones de la vía y del tiempo (condiciones atmosféricas)</h4>
        <p>Se documentan geometría, superficie, señalización, iluminación, obstáculos, lluvia, neblina, viento y visibilidad.</p>

        <h4>7.1.5. Comprobación de daños físicos y materiales</h4>
        <p>Comprende el registro de lesiones y daños en vehículos, infraestructura y objetos.</p>

        <h4>7.2. Anotación de los hechos</h4>
        <p>Es la fijación sistemática de observaciones, medidas, imágenes y declaraciones.</p>

        <h4>7.2.1. Medición de huellas</h4>
        <p>Consiste en medir longitud, ancho, orientación y ubicación de huellas de frenado, arrastre, derrape o rodadura.</p>

        <h4>7.2.2. Medición y diagramas del hecho (croquis)</h4>
        <p>El croquis representa posiciones, distancias, orientación, vías e indicios mediante escala o medidas verificables.</p>

        <h4>7.2.3. Fotografía y levantamiento de indicios</h4>
        <p>La fotografía fija la escena de lo general a lo particular; el levantamiento recolecta elementos con embalaje, rotulado y cadena de custodia.</p>

        <h4>7.2.4. Declaración de los protagonistas</h4>
        <p>Es el relato formal obtenido conforme a procedimiento, con identificación del declarante y registro de sus manifestaciones.</p>

        <h4>7.2.5. Informe de Laboratorio y Peritajes</h4>
        <p>Son resultados técnicos emitidos por especialistas sobre alcohol, toxicología, mecánica, lesiones, velocidad, huellas u otras materias.</p>

        <h4>7.3. Análisis de los hechos</h4>
        <p>Es la integración razonada de indicios, declaraciones, daños, huellas y peritajes para formular una secuencia compatible con la evidencia.</p>

        <h4>7.3.1. Estimados y pruebas de velocidad</h4>
        <p>Son procedimientos para aproximar la velocidad mediante huellas, deformaciones, video, tiempos o pruebas controladas.</p>

        <h4>7.3.2. Ayuda técnica de laboratorio</h4>
        <p>Comprende análisis especializados que superan la observación de campo y aportan datos objetivos sobre materiales, fluidos, alcohol, toxicología o componentes.</p>

        <h4>7.3.3. Inspecciones oculares en el lugar del accidente</h4>
        <p>Son observaciones técnicas detalladas de la escena, realizadas para reconocer indicios, condiciones y relaciones espaciales.</p>

        <h4>7.3.4. Reconstrucción del accidente</h4>
        <p>Es la reproducción analítica de la secuencia probable mediante evidencia, cálculos y, cuando procede, simulaciones o pruebas.</p>

        <h4>7.4. Determinación de causas</h4>
        <p>Consiste en identificar factores necesarios, contribuyentes y antecedentes que explican la producción del hecho.</p>

        <h4>7.4.1. Causa directa</h4>
        <p>Es el factor inmediatamente vinculado con la producción del accidente y sin el cual el resultado no habría ocurrido de la misma manera.</p>

        <h4>7.4.2. Causa mediata</h4>
        <p>Es una condición previa que favorece o incrementa la posibilidad del hecho, aunque no constituya el desencadenante inmediato.</p>

        <h4>7.4.3. Causa remota</h4>
        <p>Es un antecedente más distante, de carácter organizacional, formativo o estructural, que contribuye indirectamente al riesgo.</p>

        <h4>7.5. Elaboración de informes</h4>
        <p>El informe expone antecedentes, metodología, hallazgos, análisis y conclusiones.</p>

        <h4>7.6. Acciones complementarias</h4>
        <p>Son diligencias posteriores necesarias para completar, verificar o ampliar la investigación.</p>

        <h4>7.7. Evolución del accidente o cadena de acontecimientos</h4>
        <p>Es la secuencia temporal desde la aparición del peligro hasta la posición final.</p>

        <h4>7.7.1. Punto de sorpresa</h4>
        <p>Es el instante en que el conductor percibe o debió percibir una situación inesperada de peligro.</p>

        <h4>7.7.2. Punto de no escape</h4>
        <p>Es el momento a partir del cual, dadas la velocidad, distancia y capacidad de maniobra, el accidente ya no puede evitarse físicamente.</p>

        <h4>7.7.3. Punto de acontecimiento llave o clave</h4>
        <p>Es el evento decisivo que transforma una situación riesgosa en una secuencia de accidente.</p>

        <h4>7.7.4. Punto de mayor contacto</h4>
        <p>Es la fase de máxima interacción física entre cuerpos, donde se produce la principal transferencia de energía.</p>

        <h4>7.7.5. Punto de descanso</h4>
        <p>Es la posición final en la que vehículos, personas u objetos quedan inmóviles después del accidente.</p>

        <h4>7.8. Causas de un accidente de tránsito</h4>
        <p>Son factores humanos, vehiculares, viales o ambientales que intervienen de forma directa o indirecta en la producción del hecho.</p>

        <h4>7.8.1. Concepto</h4>
        <p>La causa es una condición con relación explicativa demostrable respecto del resultado.</p>

        <h4>7.8.2. Clases de causas y definiciones</h4>
        <p>Las causas se clasifican en directas, mediatas y remotas según proximidad con el resultado.</p>

        <h4>7.8.3. Causa directa</h4>
        <p>Es el desencadenante inmediato y operacional del accidente.</p>

        <h4>7.8.4. Causa mediata</h4>
        <p>Es la condición previa que facilita el error o limita la respuesta.</p>

        <h4>7.8.5. Causa remota</h4>
        <p>Es el antecedente estructural o distante que contribuye a crear el contexto de riesgo.</p>

        <h3>8. CONDICIONES DEL CONDUCTOR</h3>
        <p>Comprenden aptitud física, mental, sensorial y técnica para conducir.</p>

        <h3>9. CONDICIONES DEL VEHÍCULO</h3>
        <p>Incluyen estado mecánico, mantenimiento, sistemas de seguridad, carga, dimensiones y documentación.</p>

        <h3>10. PROCEDIMIENTOS EN INVESTIGACIÓN DE HECHOS DE TRÁNSITO</h3>
        <p>Son actuaciones ordenadas desde la noticia inicial hasta el cierre del informe.</p>

        <h4>10.1. Recepción de la denuncia</h4>
        <p>Es el registro inicial de la noticia del hecho, con datos de lugar, hora, participantes, lesiones y riesgos.</p>

        <h4>10.2. Preparativos</h4>
        <p>Comprenden organización del personal, equipos, formularios, señalización, protección y coordinación con emergencias.</p>

        <h4>10.3. Acción directa</h4>
        <p>Es la intervención inmediata orientada a salvar vidas, eliminar riesgos, proteger el lugar e identificar participantes.</p>

        <h4>10.4. Análisis del lugar del hecho</h4>
        <p>Consiste en observar el escenario de manera global y luego particular, formulando hipótesis provisionales que guían la búsqueda de indicios.</p>

        <h4>10.5. Descripción escrita</h4>
        <p>Es el relato ordenado de características del lugar, vehículos, personas, huellas, clima y actuaciones.</p>

        <h4>10.6. Descripción gráfica</h4>
        <p>Comprende croquis, planos y diagramas que representan relaciones espaciales.</p>

        <h4>10.7. Fotografías</h4>
        <p>Las fotografías deben cubrir vistas generales, medias y de detalle, conservar secuencia y permitir identificar ubicación y escala.</p>

        <h4>10.8. Identificación</h4>
        <p>Consiste en individualizar personas, vehículos, documentos e indicios, evitando confusiones.</p>

        <h4>10.9. Descripción de los daños</h4>
        <p>Debe señalar ubicación, forma, extensión, dirección y características de deformaciones.</p>

        <h4>10.10. Acciones complementarias</h4>
        <p>Incluyen citaciones, secuestros, peritajes, obtención de videos, verificación documental y coordinación interinstitucional.</p>

        <h3>11. CONCLUSIÓN</h3>
        <p>La educación vial y la investigación de hechos de tránsito requieren una visión integral que articule norma, técnica y prevención. El análisis del factor humano, del vehículo y de la vía permite comprender que los accidentes rara vez responden a una sola condición.</p>
        <div class="ejemplo-practico"><strong>Ejemplo práctico:</strong> Tras una colisión en una avenida, el personal asegura el lugar, auxilia a los lesionados, identifica a conductores y testigos, registra posiciones y condiciones de la vía, verifica los vehículos y analiza los factores humano, vehicular y vial para sustentar técnicamente las conclusiones del hecho de tránsito.</div>

        <h1>UNIDAD TEMÁTICA No. 6</h1>
        <h2>PROCEDIMIENTOS POLICIALES</h2>
        <h3>INTRODUCCIÓN</h3>
        <p>Los procedimientos policiales comprenden actuaciones operativas destinadas a orientar la intervención institucional frente a situaciones que afectan la seguridad, el orden, la protección de personas y la prevención o esclarecimiento inicial de hechos. En esta unidad, el análisis se organiza desde una perspectiva policial aplicada, relacionando cada procedimiento con la necesidad de observar el entorno, identificar riesgos, procesar información, coordinar recursos y tomar decisiones oportunas. Debido a que la bibliografía proporcionada en el documento fuente corresponde específicamente al área de Inteligencia Básica Policial, el sustento bibliográfico se utiliza únicamente en aquellos aspectos de análisis, información, planificación y toma de decisiones que dichas fuentes permiten respaldar, sin atribuirles normas o contenidos jurídicos que no fueron proporcionados.</p>
        <p>Fundamento bibliográfico: Según la Policía Boliviana (2025, 2026), la inteligencia básica policial permite transformar información dispersa en conocimiento útil para orientar decisiones institucionales; asimismo, Santamaría Monzón (2025) destaca la importancia de organizar, valorar y analizar la información antes de convertirla en un producto útil para la función policial.</p>
        <p>Análisis operativo: Esto nos quiere decir que un procedimiento policial mejora cuando la actuación no se limita a reaccionar, sino que incorpora observación, análisis de riesgos, selección de alternativas y registro de la información obtenida.</p>
        <div class="ejemplo-practico"><strong>Ejemplo práctico:</strong> Durante un patrullaje, el personal recibe varios reportes sobre conflictos repetidos en una zona. En lugar de intervenir de manera aislada, organiza los antecedentes, identifica horarios y lugares recurrentes y dispone el servicio considerando los riesgos observados.</div>

        <h3>1. USO DE LA FUERZA EN PROCEDIMIENTO Y OPERACIONES POLICIALES</h3>
        <p>El uso de la fuerza dentro de un procedimiento policial debe comprenderse como una respuesta operativa que requiere valoración previa de la conducta observada, del nivel de riesgo existente, del entorno y de los recursos disponibles. La decisión no debe ser automática, porque las circunstancias pueden variar rápidamente y obligan al servidor policial a adaptar su actuación. Desde una perspectiva profesional, la intervención debe procurar control, seguridad, reducción del riesgo y finalización del procedimiento cuando la amenaza ha sido contenida.</p>
        <p>Fundamento bibliográfico: Según la Policía Boliviana (2025, 2026), la toma de decisiones policiales se fortalece cuando se basa en información previamente observada, valorada y analizada, permitiendo identificar amenazas y seleccionar respuestas acordes al escenario.</p>

        <h3>2. MANTENIMIENTO Y RESTABLECIMIENTO DEL ORDEN PÚBLICO</h3>
        <p>El mantenimiento del orden público se orienta a prevenir que una situación colectiva evolucione hacia escenarios de riesgo, mientras que el restablecimiento busca recuperar condiciones de seguridad cuando el orden ya ha sido alterado. Para ello se requiere observación de la dinámica del lugar, identificación de actores, reconocimiento de puntos críticos, coordinación entre equipos y capacidad para adaptar el despliegue policial conforme cambian los acontecimientos.</p>
        <p>Fundamento bibliográfico: Según la Policía Boliviana (2025, 2026), el conocimiento oportuno del escenario y de los factores de amenaza permite orientar mejor el empleo de recursos y anticipar posibles cursos de acción.</p>

        <h4>2.1. Convenios internacionales y el Código de Conducta para Funcionarios Encargados de Hacer Cumplir la Ley</h4>
        <p>Los convenios internacionales y los instrumentos de conducta profesional constituyen referencias que orientan la actuación de los funcionarios encargados de hacer cumplir la ley. En el documento fuente no se incorporan textos internacionales específicos dentro de la bibliografía; por ello, este apartado se desarrolla únicamente desde la necesidad institucional de que el servidor conozca las normas, directrices y límites aplicables antes de intervenir, evitando atribuir contenidos concretos a fuentes no proporcionadas.</p>
        <p>Fundamento bibliográfico: Según la Policía Boliviana (2025, 2026), la producción de conocimiento útil para la función policial exige identificar correctamente las fuentes de información y valorar su pertinencia antes de emplearlas para sustentar una decisión.</p>
        <p>Análisis operativo: Esto nos quiere decir que la intervención policial debe apoyarse en información observada y valorada, utilizando el análisis para comprender el escenario y orientar una respuesta organizada, evitando atribuir a las fuentes contenidos que no se encuentran dentro de la bibliografía proporcionada.</p>
        <div class="ejemplo-practico"><strong>Ejemplo práctico:</strong> Antes de participar en un operativo, el jefe de equipo verifica qué disposiciones institucionales y reglas de actuación corresponden al servicio, comunica las instrucciones y aclara los límites de la intervención al personal.</div>

        <h4>2.2. Principios rectores del uso de la fuerza: Legalidad, Necesidad, Proporcionalidad y Oportunidad</h4>
        <p>Los principios de legalidad, necesidad, proporcionalidad y oportunidad permiten estructurar el análisis de una intervención policial. La legalidad exige actuar dentro de las atribuciones institucionales; la necesidad implica determinar si la intervención resulta indispensable; la proporcionalidad relaciona la respuesta con la intensidad del riesgo; y la oportunidad considera el momento más adecuado para actuar. Estos criterios requieren una lectura correcta del escenario y de la conducta de las personas involucradas.</p>
        <p>Fundamento bibliográfico: Según Santamaría Monzón (2025), el análisis policial requiere valorar la información disponible antes de formular conclusiones, lo que permite reducir decisiones basadas en apreciaciones incompletas o no verificadas.</p>
        <p>Análisis operativo: Esto nos quiere decir que la intervención policial debe apoyarse en información observada y valorada, utilizando el análisis para comprender el escenario y orientar una respuesta organizada, evitando atribuir a las fuentes contenidos que no se encuentran dentro de la bibliografía proporcionada.</p>
        <div class="ejemplo-practico"><strong>Ejemplo práctico:</strong> Un sujeto grita y se muestra desafiante, pero no agrede. El policía diferencia la conducta verbal de una agresión física, evalúa el riesgo real y evita adoptar una medida mayor que la necesaria para controlar la situación.</div>

        <h4>2.3. La Pirámide o Modelo Progresivo y Diferenciado del Uso de la Fuerza</h4>
        <p>El modelo progresivo y diferenciado representa una forma de ordenar la respuesta policial de acuerdo con la evolución del comportamiento, la resistencia y el riesgo. Su utilidad operativa radica en que obliga a observar cambios en la situación y a ajustar la intervención, incrementando o disminuyendo el nivel de respuesta cuando las circunstancias lo requieren. No debe entenderse como una secuencia mecánica, sino como una guía de adaptación.</p>

        <h4>2.4. Técnicas de verbalización y negociación como herramientas prioritarias de disuasión</h4>
        <p>La verbalización y la negociación son herramientas operativas que permiten obtener información, reducir tensión y favorecer soluciones sin escalar innecesariamente el conflicto. Una comunicación clara ayuda a conocer intenciones, necesidades, temores y posibles riesgos, mientras que la escucha activa permite identificar elementos que pueden modificar la estrategia policial.</p>

        <h3>3. PROCEDIMIENTOS OPERATIVOS EN ACCIÓN DIRECTA</h3>
        <p>La acción directa comprende la respuesta policial inicial frente a un hecho que requiere intervención inmediata. Su importancia radica en que las primeras decisiones pueden influir en la protección de las personas, en la conservación de información y en la continuidad posterior del procedimiento. La actuación debe ser ordenada, observando qué ocurrió, quiénes se encuentran presentes, qué riesgos permanecen activos y qué información debe ser comunicada.</p>
        <p>Fundamento bibliográfico: Según la Policía Boliviana (2025, 2026), la obtención y organización oportuna de información permite construir una comprensión inicial del hecho y orientar las acciones posteriores de las unidades responsables.</p>
        <p>Análisis operativo: Esto nos quiere decir que la intervención policial debe apoyarse en información observada y valorada, utilizando el análisis para comprender el escenario y orientar una respuesta organizada, evitando atribuir a las fuentes contenidos que no se encuentran dentro de la bibliografía proporcionada.</p>
        <div class="ejemplo-practico"><strong>Ejemplo práctico:</strong> La patrulla llega a un comercio donde ocurrió un robo. Identifica a la víctima, verifica si existen heridos, observa accesos y rutas de salida, controla que terceros no alteren el lugar y comunica la información principal a la unidad correspondiente.</div>

        <h4>3.1. Conceptualización legal de la Acción Directa conforme al Código de Procedimiento Penal</h4>
        <p>El documento fuente menciona expresamente la conceptualización legal de la acción directa conforme al Código de Procedimiento Penal, pero no incorpora dicho Código dentro de la bibliografía proporcionada. Por esta razón, este desarrollo evita citar artículos o atribuir contenidos jurídicos concretos y se concentra en la función operativa inicial: asegurar el lugar, proteger a las personas, identificar información relevante y facilitar la continuidad de la actuación policial especializada.</p>
        <p>Fundamento bibliográfico: Según la Policía Boliviana (2025, 2026), la información inicial debe ser obtenida de forma ordenada y orientada a una necesidad concreta, de manera que pueda ser utilizada posteriormente por los responsables de la toma de decisiones.</p>
        <p>Análisis operativo: Esto nos quiere decir que la intervención policial debe apoyarse en información observada y valorada, utilizando el análisis para comprender el escenario y orientar una respuesta organizada, evitando atribuir a las fuentes contenidos que no se encuentran dentro de la bibliografía proporcionada.</p>
        <div class="ejemplo-practico"><strong>Ejemplo práctico:</strong> Al llegar a un accidente con posible relevancia penal, la patrulla auxilia, identifica testigos, registra datos básicos del lugar y transmite oportunamente la información a la autoridad o unidad competente.</div>

        <h4>3.2. Protocolo de atención inmediata a la víctima y auxilio a heridos</h4>
        <p>La atención inmediata a víctimas y heridos implica priorizar la seguridad, identificar riesgos que puedan continuar activos y facilitar asistencia dentro de las capacidades del personal interviniente. También exige obtener información sin generar mayor afectación, observando el estado de la persona y evitando interferir innecesariamente con la atención de emergencia.</p>
        <p>Fundamento bibliográfico: Según la Policía Boliviana (2025, 2026), la información útil debe responder a prioridades concretas y ser obtenida de manera oportuna; en una emergencia, ello supone diferenciar entre datos indispensables para proteger a la víctima y datos que pueden recabarse posteriormente.</p>
        <p>Análisis operativo: Esto nos quiere decir que la intervención policial debe apoyarse en información observada y valorada, utilizando el análisis para comprender el escenario y orientar una respuesta organizada, evitando atribuir a las fuentes contenidos que no se encuentran dentro de la bibliografía proporcionada.</p>
        <div class="ejemplo-practico"><strong>Ejemplo práctico:</strong> Una víctima presenta una lesión visible y dificultad para mantenerse de pie. El policía primero asegura la zona y solicita asistencia, recoge únicamente los datos indispensables y deja para después preguntas que no sean necesarias para la protección inmediata.</div>

        <h4>3.3. Preservación y acordonamiento del lugar del hecho</h4>
        <p>La preservación del lugar del hecho busca impedir que información material relevante sea alterada, destruida o contaminada. El primer interviniente debe controlar accesos, limitar desplazamientos innecesarios, observar cambios en la escena y registrar las novedades que puedan ser útiles para las unidades que continuarán la investigación.</p>
        <p>Fundamento bibliográfico: Según Santamaría Monzón (2025), la confiabilidad del análisis depende de la calidad y valoración de la información de origen; por ello, conservar adecuadamente los datos y elementos iniciales resulta esencial para evitar conclusiones posteriores basadas en información alterada.</p>
        <p>Análisis operativo: Esto nos quiere decir que la intervención policial debe apoyarse en información observada y valorada, utilizando el análisis para comprender el escenario y orientar una respuesta organizada, evitando atribuir a las fuentes contenidos que no se encuentran dentro de la bibliografía proporcionada.</p>
        <div class="ejemplo-practico"><strong>Ejemplo práctico:</strong> En una vivienda donde ocurrió un hecho violento, el policía restringe el ingreso, evita mover objetos y registra quiénes estuvieron presentes antes de entregar el lugar al personal especializado.</div>

        <h4>3.4. Estructura, redacción técnica y validez jurídica del Acta de Acción Directa</h4>
        <p>El Acta de Acción Directa debe presentar la información de manera clara, cronológica, objetiva y comprensible. Su redacción debe distinguir los hechos observados directamente de las versiones proporcionadas por terceros, consignar las actuaciones realizadas y evitar expresiones ambiguas o conclusiones no sustentadas. Una buena documentación permite reconstruir la secuencia del procedimiento y facilita su evaluación posterior.</p>
        <p>Fundamento bibliográfico: Según la Policía Boliviana (2025, 2026), la información institucional debe ser organizada y procesada de forma que resulte útil, comprensible y pertinente para quien debe emplearla en una decisión o análisis posterior.</p>
        <p>Análisis operativo: Esto nos quiere decir que la intervención policial debe apoyarse en información observada y valorada, utilizando el análisis para comprender el escenario y orientar una respuesta organizada, evitando atribuir a las fuentes contenidos que no se encuentran dentro de la bibliografía proporcionada.</p>
        <div class="ejemplo-practico"><strong>Ejemplo práctico:</strong> En lugar de escribir que una persona "parecía culpable", el policía describe conductas observables: intentó retirarse al advertir la presencia policial, cambió repetidamente su versión y se encontraba junto al objeto reportado.</div>

        <h3>4. PROCEDIMIENTOS POLICIALES EN OPERATIVOS DE LUCHA CONTRA EL NARCOTRÁFICO</h3>
        <p>Los operativos de lucha contra el narcotráfico requieren un alto nivel de planificación, coordinación, reserva y análisis previo debido a los riesgos asociados a organizaciones, rutas, medios de transporte, lugares de almacenamiento y posibles mecanismos de evasión. Desde el enfoque de inteligencia, resulta fundamental transformar reportes aislados en patrones que ayuden a orientar el despliegue operativo.</p>
        <p>Fundamento bibliográfico: Según la Policía Boliviana (2025, 2026), la inteligencia básica permite identificar actores, relaciones, tendencias y escenarios, proporcionando elementos para planificar operaciones con mayor conocimiento del riesgo.</p>
        <p>Análisis operativo: Esto nos quiere decir que la intervención policial debe apoyarse en información observada y valorada, utilizando el análisis para comprender el escenario y orientar una respuesta organizada, evitando atribuir a las fuentes contenidos que no se encuentran dentro de la bibliografía proporcionada.</p>
        <div class="ejemplo-practico"><strong>Ejemplo práctico:</strong> Una unidad reúne reportes de movimientos inusuales de vehículos en horarios repetidos. Al relacionar placas, lugares, horarios y contactos, identifica un patrón que permite orientar la vigilancia y distribuir mejor los equipos.</div>

        <h3>5. SEGURIDAD DE PERSONAS IMPORTANTES</h3>
        <p>La seguridad de personas importantes se basa en la anticipación de amenazas y vulnerabilidades que puedan afectar a una autoridad o persona protegida. Requiere reconocimiento de lugares, análisis de rutas, identificación de puntos críticos, coordinación con otros servicios y actualización permanente de la información cuando cambian las condiciones.</p>
        <p>Fundamento bibliográfico: Según la Policía Boliviana (2025, 2026), la evaluación de amenazas y escenarios constituye un insumo esencial para orientar medidas preventivas y asignar recursos de acuerdo con el nivel de riesgo.</p>
        <p>Análisis operativo: Esto nos quiere decir que la intervención policial debe apoyarse en información observada y valorada, utilizando el análisis para comprender el escenario y orientar una respuesta organizada, evitando atribuir a las fuentes contenidos que no se encuentran dentro de la bibliografía proporcionada.</p>
        <div class="ejemplo-practico"><strong>Ejemplo práctico:</strong> Antes de un acto público, el equipo verifica accesos, rutas alternativas, lugares de concentración y posibles puntos de riesgo. Si aparece información nueva sobre una amenaza, modifica el dispositivo antes del desplazamiento.</div>

        <h3>6. SEGURIDAD PENITENCIARIA</h3>
        <p>La seguridad penitenciaria comprende medidas de observación, control, prevención y respuesta destinadas a mantener condiciones de seguridad dentro de un establecimiento. Un enfoque policial basado en información permite identificar conflictos emergentes, movimientos inusuales, posibles redes internas y circunstancias que podrían generar alteraciones.</p>
        <p>Fundamento bibliográfico: Según la Policía Boliviana (2025, 2026), el análisis sistemático de información ayuda a detectar patrones y amenazas antes de que se materialicen, favoreciendo decisiones preventivas.</p>
        <p>Análisis operativo: Esto nos quiere decir que la intervención policial debe apoyarse en información observada y valorada, utilizando el análisis para comprender el escenario y orientar una respuesta organizada, evitando atribuir a las fuentes contenidos que no se encuentran dentro de la bibliografía proporcionada.</p>
        <div class="ejemplo-practico"><strong>Ejemplo práctico:</strong> El personal registra que varios incidentes menores ocurren repetidamente en un mismo sector y horario. Al organizar las novedades, identifica un patrón y refuerza la supervisión antes de que se produzca un conflicto mayor.</div>

        <h3>7. CONTROL MIGRATORIO</h3>
        <p>El control migratorio implica verificar información relacionada con identidad, documentación, movimientos y circunstancias que puedan requerir intervención de la autoridad competente. Desde el enfoque policial, la calidad de la actuación depende de comprobar datos, evitar conclusiones precipitadas y comunicar oportunamente las observaciones relevantes.</p>
        <p>Fundamento bibliográfico: Según Santamaría Monzón (2025), la valoración de la información exige analizar tanto la confiabilidad de la fuente como la consistencia del contenido antes de convertirlo en una conclusión útil.</p>
        <p>Análisis operativo: Esto nos quiere decir que la intervención policial debe apoyarse en información observada y valorada, utilizando el análisis para comprender el escenario y orientar una respuesta organizada, evitando atribuir a las fuentes contenidos que no se encuentran dentro de la bibliografía proporcionada.</p>
        <div class="ejemplo-practico"><strong>Ejemplo práctico:</strong> Ante una inconsistencia documental, el funcionario no presume automáticamente una irregularidad delictiva; verifica los datos disponibles, contrasta la información y comunica el resultado a la instancia correspondiente.</div>

        <h3>8. BOMBERÍA Y SALVATAJE</h3>
        <p>La bombería y el salvataje requieren decisiones rápidas sustentadas en observación del entorno, identificación de peligros, priorización de personas expuestas y coordinación de recursos. Incluso en emergencias, organizar la información permite establecer zonas críticas, rutas de acceso, necesidades de apoyo y cambios en el nivel de riesgo.</p>
        <p>Fundamento bibliográfico: Según la Policía Boliviana (2025, 2026), la información oportuna sobre el escenario permite orientar recursos y adoptar decisiones más adecuadas frente a situaciones cambiantes.</p>
        <p>Análisis operativo: Esto nos quiere decir que la intervención policial debe apoyarse en información observada y valorada, utilizando el análisis para comprender el escenario y orientar una respuesta organizada, evitando atribuir a las fuentes contenidos que no se encuentran dentro de la bibliografía proporcionada.</p>
        <div class="ejemplo-practico"><strong>Ejemplo práctico:</strong> En un incendio, el personal identifica la zona de mayor propagación, posibles personas atrapadas, accesos seguros y riesgos adicionales. Esa información se comunica al responsable del operativo para definir prioridades de intervención.</div>

        <h3>9. INTERVENCIÓN POLICIAL EN ALLANAMIENTOS</h3>
        <p>El allanamiento figura en el documento como un procedimiento policial específico, pero la bibliografía entregada no contiene una fuente jurídica especializada sobre esta medida. Por ello, el desarrollo se concentra en aspectos operativos vinculados con planificación, identificación del objetivo, distribución de funciones, análisis de riesgos, control de la información y documentación del procedimiento, sin atribuir requisitos legales concretos a fuentes no proporcionadas.</p>
        <p>Fundamento bibliográfico: Según la Policía Boliviana (2025, 2026), la planificación basada en información reduce incertidumbre y permite prever escenarios, asignar funciones y establecer medidas de seguridad antes de una operación.</p>
        <p>Análisis operativo: Esto nos quiere decir que la intervención policial debe apoyarse en información observada y valorada, utilizando el análisis para comprender el escenario y orientar una respuesta organizada, evitando atribuir a las fuentes contenidos que no se encuentran dentro de la bibliografía proporcionada.</p>
        <div class="ejemplo-practico"><strong>Ejemplo práctico:</strong> Antes de una intervención, el equipo verifica la ubicación, accesos, número aproximado de ocupantes y posibles riesgos. Con esos datos distribuye tareas y define medidas de seguridad para evitar improvisaciones.</div>

        <h3>10. INTELIGENCIA BÁSICA POLICIAL</h3>
        <p>La inteligencia básica policial es el proceso mediante el cual datos obtenidos de distintas fuentes se seleccionan, valoran, integran y analizan hasta convertirse en conocimiento útil para la función policial. Su finalidad es disminuir incertidumbre, comprender amenazas y apoyar decisiones en niveles estratégicos, operacionales o tácticos. La inteligencia no consiste en acumular información, sino en producir conocimiento pertinente para una necesidad institucional.</p>
        <p>Fundamento bibliográfico: Según la Policía Boliviana (2025, 2026), la inteligencia básica policial organiza información sobre hechos, actores, escenarios y tendencias para apoyar la planificación y la toma de decisiones; Santamaría Monzón (2025) resalta la necesidad de valorar y analizar los datos antes de convertirlos en un producto de inteligencia.</p>
        <p>Análisis operativo: Esto nos quiere decir que la intervención policial debe apoyarse en información observada y valorada, utilizando el análisis para comprender el escenario y orientar una respuesta organizada, evitando atribuir a las fuentes contenidos que no se encuentran dentro de la bibliografía proporcionada.</p>
