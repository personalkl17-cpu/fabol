                                <ul>
                                    <li><span class="subtitulo-mapa">1. Antecedentes y Evolución Histórica:</span> <span class="punto-referencial">Ámbito universal (Cilindro de Ciro, Carta Magna, Declaración de 1789, DUDH 1948) y nacional (Revolución de 1952, dictaduras, retorno a la democracia, CPE 2009).</span></li>
                                    <li><span class="subtitulo-mapa">2. Declaración Universal y sus Generaciones:</span> <span class="punto-referencial">Civiles y políticos, económicos/sociales/culturales, solidaridad y tecnológicos, derechos en progreso.</span></li>
                                    <li><span class="subtitulo-mapa">3. Mecanismos de Protección:</span> <span class="punto-referencial">Sistema Universal (ONU), Sistemas Regionales (CIDH, Corte IDH, Europeo, Africano, Árabe), Sistema Nacional (Defensoría del Pueblo, Garantías Jurisdiccionales).</span></li>
                                </ul>
                            </li>
                            <li><span class="nodo-principal">PROHIBICIÓN DE TORTURA Y POBLACIONES ESPECÍFICAS</span>
                                <ul>
                                    <li><span class="subtitulo-mapa">4. Prohibición Absoluta de la Tortura.</span></li>
                                    <li><span class="subtitulo-mapa">5. Aplicación Estricta de Normativas contra la Tortura y Tratos Crueles.</span></li>
                                    <li><span class="subtitulo-mapa">6. Protección a Poblaciones Específicas (Grupos en situación de vulnerabilidad y enfoque de género):</span>
                                        <ul>
                                            <li><span class="punto-referencial">6.1.1. Niñez y adolescencia.</span></li>
                                            <li><span class="punto-referencial">6.1.2. Comunidad LGTB.</span></li>
                                            <li><span class="punto-referencial">6.1.3. Personas con discapacidad.</span></li>
                                            <li><span class="punto-referencial">6.1.4. Adultos mayores.</span></li>
                                            <li><span class="punto-referencial">6.1.5. Mujeres e igualdad de género.</span></li>
                                        </ul>
                                    </li>
                                </ul>
                            </li>
                            <li><span class="nodo-principal">USO DE LA FUERZA Y MARCO ÉTICO</span>
                                <ul>
                                    <li><span class="subtitulo-mapa">7. Marco Ético y Normativo:</span> <span class="punto-referencial">Principios policiales de Robert Peel, Código de Conducta para Funcionarios Encargados de Hacer Cumplir la Ley (FEHCL).</span></li>
                                    <li><span class="subtitulo-mapa">8. Principios del Uso de la Fuerza:</span> <span class="punto-referencial">Legalidad, necesidad, proporcionalidad, precaución, diferenciación, rendición de cuentas.</span></li>
                                    <li><span class="subtitulo-mapa">9. Legalidad:</span> <span class="punto-referencial">Fundamentación estricta en la normativa.</span></li>
                                    <li><span class="subtitulo-mapa">10. Necesidad:</span> <span class="punto-referencial">Aplicación solo cuando medios no letales son ineficaces.</span></li>
                                    <li><span class="subtitulo-mapa">11. Proporcionalidad:</span> <span class="punto-referencial">Equilibrio entre amenaza y nivel de fuerza.</span></li>
                                    <li><span class="subtitulo-mapa">12-16. Uso Diferenciado y Progresivo, Respuesta Gradual, Modelo de Intervención, Gestión de Conflictos y Control de Multitudes, Clasificación (aglomeración, multitud, disturbios), Intervención Táctica para el Restablecimiento del Orden.</span></li>
                                </ul>
                            </li>
                        </ul>
                    </div>
                `,
                guion: "<strong>Mini Guion:</strong> El Tema 8 trata sobre los DDHH en la función policial. Repasamos su evolución histórica, desde el Cilindro de Ciro hasta la DUDH de 1948 y la Constitución de 2009. Existen mecanismos de protección internacionales y nacionales. Un punto absoluto es la prohibición de la tortura. La Policía debe tener un trato diferenciado con grupos vulnerables (niños, LGTB, personas con discapacidad, adultos mayores, mujeres). Finalmente, el uso de la fuerza se rige por principios estrictos: legalidad, necesidad y proporcionalidad. El uso progresivo y diferenciado nos permite elegir la respuesta mínima necesaria, priorizando siempre la vida y los derechos humanos.",
                preguntas: [
                    { p: "¿Qué instrumento de 1948 constituye la formulación contemporánea de derechos aplicables a todas las personas?", r: "La Declaración Universal de los Derechos Humanos (DUDH)." },
                    { p: "¿Cuáles son los dos sistemas regionales de protección de DDHH mencionados?", r: "El Sistema Interamericano (CIDH y Corte IDH) y el Sistema Europeo (Convenio Europeo)." },
                    { p: "¿Qué establece la prohibición absoluta de la tortura?", r: "Que ninguna circunstancia (emergencia, orden superior, etc.) puede justificar la tortura." },
                    { p: "Mencione dos principios del uso de la fuerza.", r: "Legalidad, necesidad, proporcionalidad, precaución, diferenciación y rendición de cuentas." },
                    { p: "¿Qué es el uso diferenciado y progresivo de la fuerza?", r: "Es un modelo de decisión operacional que relaciona el nivel de cooperación o resistencia de una persona con la respuesta policial, priorizando los medios no violentos y aumentando la fuerza solo si es necesario." }
                ]
            },
            // --- TEMA 9 ---
            {
                titulo: "Tema 9: Derecho Penal y Procesal Penal",
                introduccion: "La actuación policial dentro del sistema penal exige mucho más que capacidad operativa: requiere conocimiento jurídico, disciplina procedimental y comprensión de los límites que protegen la dignidad humana. El Derecho Penal identifica las conductas prohibidas y sus consecuencias, mientras que el Derecho Procesal Penal establece el camino legítimo para investigar, acusar y juzgar. La función policial se ubica en la primera línea de esa relación, porque suele intervenir en el momento más próximo al hecho, cuando la información es frágil, las personas se encuentran en situación de riesgo y cada decisión puede influir en la validez posterior del proceso.",
                mapa: `
                    <div class="mapa-conceptual">
                        <ul>
                            <li><span class="nodo-principal">FUNDAMENTOS Y PRINCIPIOS</span>
                                <ul>
                                    <li><span class="subtitulo-mapa">1. Fundamentos:</span> <span class="punto-referencial">Concepto y función del Derecho Penal y Procesal Penal.</span></li>
                                    <li><span class="subtitulo-mapa">2. Principios Rectores:</span> <span class="punto-referencial">Legalidad, presunción de inocencia, debido proceso, objetividad, proporcionalidad, non bis in idem, respeto a DDHH, legalidad de la prueba.</span></li>
                                </ul>
                            </li>
                            <li><span class="nodo-principal">FUNCIÓN POLICIAL EN EL PROCESO Y POLICÍA JUDICIAL</span>
                                <ul>
                                    <li><span class="subtitulo-mapa">3. Función Policial en el Proceso Penal:</span> <span class="punto-referencial">Policía como órgano auxiliar del Ministerio Público, prevención, conservación del lugar, identificación de autores, aprehensión en flagrancia, ejecución de actos investigativos, informes técnicos y custodia de evidencias.</span></li>
                                    <li><span class="subtitulo-mapa">4. Policía Judicial e Investigación Preliminar:</span> <span class="punto-referencial">Concepto, alcance, requisa personal y de vehículos, actuaciones fundamentadas, cadena de custodia, coordinación con el IDIF.</span></li>
                                    <li><span class="subtitulo-mapa">5. Jurisdicción, Competencia y Acción Penal:</span> <span class="punto-referencial">Jurisdicción penal, competencia territorial/funcional, acción penal pública, a instancia de parte, privada, conversión y extinción.</span></li>
                                </ul>
                            </li>
                            <li><span class="nodo-principal">DERECHOS, TEORÍA DEL DELITO Y JUICIO ORAL</span>
                                <ul>
                                    <li><span class="subtitulo-mapa">6. Derechos y Garantías:</span> <span class="punto-referencial">Derechos del imputado, de la víctima, derecho a la defensa y silencio, prohibición de pruebas ilícitas, control jurisdiccional.</span></li>
                                    <li><span class="subtitulo-mapa">7. Teoría del Delito:</span> <span class="punto-referencial">Conducta, tipicidad, antijuridicidad, culpabilidad, autoría y participación, iter criminis, concurso de delitos.</span></li>
                                    <li><span class="subtitulo-mapa">8. Medidas Coercitivas:</span> <span class="punto-referencial">Arresto, aprehensión, detención en flagrancia, incautación de objetos, preservación de evidencias, registro del lugar, fundamentación y plazos.</span></li>
                                    <li><span class="subtitulo-mapa">9. Participación Policial en el Juicio Oral:</span> <span class="punto-referencial">Policía como testigo, presentación y ratificación de informes, custodia de evidencias, seguridad del tribunal, principios de objetividad e imparcialidad.</span></li>
                                </ul>
                            </li>
                        </ul>
                    </div>
                `,
                guion: "<strong>Mini Guion:</strong> El Tema 9 nos sumerge en el Derecho Penal y Procesal Penal. El primero define los delitos y penas; el segundo, el camino legal para investigar y juzgar. La Policía actúa como órgano auxiliar del Ministerio Público, bajo principios como legalidad y presunción de inocencia. En la investigación preliminar, realizamos actos urgentes, preservamos la cadena de custodia y coordinamos con el IDIF. La teoría del delito nos da la estructura para analizar una conducta: tipicidad, antijuridicidad y culpabilidad. También vemos las medidas coercitivas como la aprehensión en flagrancia. Finalmente, en el juicio oral, el policía declara como testigo, ratifica informes y debe ser objetivo e imparcial.",
                preguntas: [
                    { p: "¿Cuál es la diferencia entre Derecho Penal y Derecho Procesal Penal?", r: "El Derecho Penal define las conductas delictivas y sus consecuencias (penas); el Derecho Procesal Penal establece el procedimiento para investigar, acusar y juzgar." },
                    { p: "¿Qué principio impide perseguir o sancionar dos veces a una persona por el mismo hecho?", r: "El principio 'non bis in idem'." },
                    { p: "Mencione los cuatro elementos de la teoría del delito.", r: "Conducta, tipicidad, antijuridicidad y culpabilidad." },
                    { p: "¿Qué es la flagrancia?", r: "Es la situación en la que una persona es sorprendida durante la comisión de un delito o en circunstancias próximas que la vinculan directamente con el hecho." },
                    { p: "¿Cuál es el rol del policía en el juicio oral?", r: "Declarar como testigo sobre hechos que percibió o actuaciones que realizó, ratificar informes técnicos, explicar la custodia de evidencias y actuar con objetividad e imparcialidad." }
                ]
            },
            // --- TEMA 10 ---
            {
                titulo: "Tema 10: Género y Violencia Intrafamiliar",
                introduccion: "La violencia en razón de género y la violencia intrafamiliar constituyen fenómenos complejos que afectan la vida, la integridad, la libertad, la dignidad y el desarrollo de las personas, especialmente de las mujeres. Su abordaje exige comprender simultáneamente el marco constitucional, las obligaciones internacionales del Estado, la legislación penal y procesal, y los procedimientos operativos que orientan la intervención policial. Desde esta perspectiva, la función policial no se limita a recibir denuncias o ejecutar actos investigativos; comprende también prevención, detección temprana, protección inmediata, evaluación de riesgo, preservación de evidencias, coordinación interinstitucional y trato digno a la víctima.",
                mapa: `
                    <div class="mapa-conceptual">
                        <ul>
                            <li><span class="nodo-principal">MARCO JURÍDICO NACIONAL E INTERNACIONAL</span>
                                <ul>
                                    <li><span class="subtitulo-mapa">1. Marco Jurídico Nacional:</span> <span class="punto-referencial">CPE (Art. 15, 251), Ley N.º 734 (Policía), Ley N.º 348 (Ley Integral para Garantizar a las Mujeres una Vida Libre de Violencia - Art. 44, 45, 46, 53, 54, 55, 57, 58, 59, 60), Ley N.º 260 (Ministerio Público), Código de Procedimiento Penal, Código Penal (Art. 154 Bis).</span></li>
                                    <li><span class="subtitulo-mapa">2. Marco Jurídico Internacional:</span> <span class="punto-referencial">CEDAW, Convención de Belém do Pará.</span></li>
                                </ul>
                            </li>
                            <li><span class="nodo-principal">MARCO CONCEPTUAL Y TIPOS DE VIOLENCIA</span>
                                <ul>
                                    <li><span class="subtitulo-mapa">3. Marco Conceptual:</span> <span class="punto-referencial">Definiciones (violencia, DDHH, género, violencia de género, violencia contra las mujeres, situación de violencia).</span></li>
                                    <li><span class="subtitulo-mapa">3.2. Tipos de Violencia contra las Mujeres:</span> <span class="punto-referencial">Física, psicológica, sexual, patrimonial y económica, feminicida, mediática, simbólica, contra la dignidad y honra, contra los derechos reproductivos, en servicios de salud, laboral, en el sistema educativo, en el ejercicio político, institucional, en la familia, contra la libertad sexual, cualquier otra forma.</span></li>
                                </ul>
                            </li>
                            <li><span class="nodo-principal">INTERVENCIÓN POLICIAL Y PROCESO PENAL</span>
                                <ul>
                                    <li><span class="subtitulo-mapa">4. Intervención Policial:</span> <span class="punto-referencial">Ámbito de aplicación, prevención (coordinación, difusión, capacitación, evitar nuevas agresiones), detección, acción directa, actuaciones de comprobación.</span></li>
                                    <li><span class="subtitulo-mapa">5. Reacción de la Víctima:</span> <span class="punto-referencial">Definición, reacciones variables, evaluación de riesgo preliminar, medidas de protección.</span></li>
                                    <li><span class="subtitulo-mapa">6. Recepción de la Denuncia:</span> <span class="punto-referencial">Definición, formas (verbal, escrita, telefónica, etc.), lineamientos (no revictimización, no formalismo, gratuidad, espacio adecuado, escucha activa).</span></li>
                                    <li><span class="subtitulo-mapa">7. Delitos investigados por la FELCV:</span> <span class="punto-referencial">Contra la vida, integridad y libertad sexual, contra la familia, modificaciones por Ley 348.</span></li>
                                    <li><span class="subtitulo-mapa">8. Actos Investigativos:</span> <span class="punto-referencial">Recepción de declaración, acciones, documentación, investigación preliminar, actas, recolección de indicios, certificado médico forense, cadena de custodia.</span></li>
                                    <li><span class="subtitulo-mapa">9. Etapas y Plazos:</span> <span class="punto-referencial">Etapa preliminar, informe preliminar, etapa preparatoria, juicio oral, testimonio.</span></li>
                                </ul>
                            </li>
                        </ul>
                    </div>
                `,
                guion: "<strong>Mini Guion:</strong> El Tema 10 es crucial. Aborda la violencia de género e intrafamiliar desde un marco legal robusto: la Constitución, la Ley 348, la Ley 260 y tratados internacionales como la CEDAW y Belém do Pará. Definimos los múltiples tipos de violencia: física, psicológica, económica, sexual, etc. La intervención policial debe ser inmediata, especializada y centrada en la víctima, evitando la revictimización. Evaluamos el riesgo, activamos medidas de protección y recibimos la denuncia sin formalismos. La FELCV investiga estos delitos, preservando evidencias y coordinando con fiscalía y forenses. Finalmente, acompañamos el proceso penal hasta el juicio oral.",
                preguntas: [
                    { p: "¿Qué ley integral garantiza a las mujeres una vida libre de violencia en Bolivia?", r: "La Ley N.º 348." },
                    { p: "Mencione tres tipos de violencia contra las mujeres según la Ley 348.", r: "Física, psicológica, sexual, económica, patrimonial, simbólica, etc." },
                    { p: "¿Qué es la revictimización y cómo se evita?", r: "Es el daño adicional que sufre la víctima por parte del sistema (repetición de relatos, culpabilización). Se evita con escucha activa, espacio privado, no exigiéndole repetir los hechos innecesariamente y no culpabilizándola." },
                    { p: "¿Qué es la evaluación de riesgo preliminar?", r: "Es un proceso inmediato para estimar la probabilidad y gravedad de nuevas agresiones, considerando amenazas, armas, celos, consumo de sustancias, etc." },
                    { p: "¿Cuál es la función de la FELCV?", r: "Es el organismo especializado de la Policía Boliviana para la prevención, auxilio, investigación, identificación y aprehensión de presuntos responsables en casos de violencia contra las mujeres, bajo dirección funcional fiscal." }
                ]
            },
            // --- TEMA 11 ---
            {
                titulo: "Tema 11: Legislación Policial y Seguridad Ciudadana",
                introduccion: "La legislación policial y de seguridad ciudadana constituye el marco normativo que orienta, limita y legitima la actuación de la Policía Boliviana. Su estudio no debe reducirse a la memorización de disposiciones aisladas, sino comprenderse como un sistema articulado en el que la Constitución Política del Estado, las leyes sectoriales, el régimen orgánico y disciplinario, los instrumentos de administración pública y los mecanismos de responsabilidad funcional se relacionan para garantizar una intervención estatal legal, eficiente, proporcional y respetuosa de los derechos fundamentales.",
                mapa: `
                    <div class="mapa-conceptual">
                        <ul>
                            <li><span class="nodo-principal">BLOQUE DE CONSTITUCIONALIDAD Y LEYES SECTORIALES</span>
                                <ul>
                                    <li><span class="subtitulo-mapa">I. Bloque de Constitucionalidad:</span> <span class="punto-referencial">CPE (garantía suprema), Ley N.º 264 y D.S. 1436 (Sistema Nacional de Seguridad Ciudadana).</span></li>
                                    <li><span class="subtitulo-mapa">II. Leyes Sectoriales Específicas:</span>
                                        <ul>
                                            <li><span class="punto-referencial">2.1. Ley N.º 259 y D.S. 1347 (Control de bebidas alcohólicas).</span></li>
                                            <li><span class="punto-referencial">2.2. Ley N.º 263 y D.S. 1486 (Trata y tráfico de personas).</span></li>
                                            <li><span class="punto-referencial">2.3. Ley N.º 348 y D.S. 2145 (Violencia contra la mujer).</span></li>
                                            <li><span class="punto-referencial">2.4. Otras leyes y normas sectoriales.</span></li>
                                        </ul>
                                    </li>
                                </ul>
                            </li>
                            <li><span class="nodo-principal">INSTITUCIONALIDAD Y RÉGIMEN DISCIPLINARIO</span>
                                <ul>
                                    <li><span class="subtitulo-mapa">III. Régimen Orgánico y Disciplinario:</span>
                                        <ul>
                                            <li><span class="punto-referencial">3.1.1. Ley N.º 734 (Ley Orgánica de la Policía).</span></li>
                                            <li><span class="punto-referencial">3.1.2. Ley N.º 101 (Régimen Disciplinario).</span></li>
                                            <li><span class="punto-referencial">3.1.3. Órganos disciplinarios (Fiscalía Policial, Tribunales).</span></li>
                                        </ul>
                                    </li>
                                </ul>
                            </li>
                            <li><span class="nodo-principal">DESCONCENTRACIÓN, POLICÍA COMUNITARIA Y TECNOLOGÍA</span>
                                <ul>
                                    <li><span class="subtitulo-mapa">IV. Modelo de Desconcentración Policial y Policía Comunitaria (EPIs y Módulos).</span></li>
                                    <li><span class="subtitulo-mapa">V. Desconcentración Policial (R.A. 272/2014 y R.M. 097/2015).</span></li>
                                    <li><span class="subtitulo-mapa">VI. Filosofía Comunitaria (modelo proactivo).</span></li>
                                    <li><span class="subtitulo-mapa">VII. Roles Operativos en EPIs.</span></li>
                                    <li><span class="subtitulo-mapa">VIII. Participación Ciudadana y Tecnología (BOL-110, CADI, videovigilancia, georreferenciación).</span></li>
                                    <li><span class="subtitulo-mapa">IX. Mecanismos de Participación (Escuelas, Brigadas Vecinales/Escolares, Voluntariado).</span></li>
                                </ul>
                            </li>
                            <li><span class="nodo-principal">GESTIÓN PÚBLICA Y RESPONSABILIDAD</span>
                                <ul>
                                    <li><span class="subtitulo-mapa">X. El Estado y su definición.</span></li>
                                    <li><span class="subtitulo-mapa">XI. Sistemas de la Ley N.º 1178 (SAFCO):</span> <span class="punto-referencial">Planificación (SPIE, POA), Organización (SOA), Presupuesto (SP), Ejecución (SAP, SABS, STCP, SCI), Control (interno y externo).</span></li>
                                    <li><span class="subtitulo-mapa">XII. Responsabilidad por la Función Pública:</span> <span class="punto-referencial">Tipología (administrativa, ejecutiva, civil, penal), aspectos procesales (exención, prescripción).</span></li>
                                </ul>
                            </li>
                        </ul>
                    </div>
                `,
                guion: "<strong>Mini Guion:</strong> El Tema 11 es muy amplio. Comienza con el bloque de constitucionalidad y leyes clave como la 264 de Seguridad Ciudadana. Luego detalla leyes sectoriales sobre alcohol, trata y violencia. Aborda el régimen orgánico y disciplinario de la Policía (Leyes 734 y 101). Un punto central es el modelo de desconcentración con las EPIs y la filosofía de policía comunitaria, que integra a la ciudadanía. También menciona el rol de la tecnología (BOL-110, CADI) y los mecanismos de participación. Finalmente, conecta la función policial con la gestión pública a través de la Ley 1178 (SAFCO) y los tipos de responsabilidad por la función pública.",
                preguntas: [
                    { p: "¿Qué ley organiza la seguridad ciudadana como una responsabilidad coordinada y participativa?", r: "La Ley N.º 264 'Para una Vida Segura'." },
                    { p: "¿Qué ley regula el régimen disciplinario de la Policía Boliviana?", r: "La Ley N.º 101." },
                    { p: "¿Qué son las EPIs y cuál es su finalidad?", r: "Son Estaciones Policiales Integrales. Su finalidad es acercar los servicios policiales a la comunidad, integrando prevención, auxilio y atención de denuncias en el nivel territorial." },
                    { p: "¿Qué sistema de la Ley 1178 se encarga de la planificación y organización?", r: "El Sistema de Planificación Integral del Estado (SPIE), el Sistema de Programación de Operaciones (POA) y el Sistema de Organización Administrativa (SOA)." },
                    { p: "Mencione los cuatro tipos de responsabilidad por la función pública.", r: "Responsabilidad administrativa, ejecutiva, civil y penal." }
                ]
            },
            // --- TEMA 12 ---
            {
                titulo: "Tema 12: Expresión Oral, Ética y Relaciones Humanas",
                introduccion: "La expresión oral, la ética y las relaciones humanas son elementos fundamentales en la formación y el desempeño profesional del servidor policial. Estos conocimientos permiten actuar con responsabilidad, disciplina, respeto y vocación de servicio, tanto dentro de la institución como en la atención a la ciudadanía. La Unidad Temática N.º 12 comprende aspectos relacionados con la deontología y doctrina policial, el liderazgo, la correspondencia policial, las relaciones humanas y públicas, así como la expresión oral y escrita.",
                mapa: `
                    <div class="mapa-conceptual">
                        <ul>
                            <li><span class="nodo-principal">DEONTOLOGÍA Y LIDERAZGO</span>
                                <ul>
                                    <li><span class="subtitulo-mapa">1. Deontología Policial y Doctrina:</span> <span class="punto-referencial">Definición, naturaleza, principios, mística, vocación de servicio, Código de Ética, honor y disciplina.</span></li>
                                    <li><span class="subtitulo-mapa">2. Liderazgo:</span> <span class="punto-referencial">Definición operativa, mando y subordinación voluntaria, naturaleza del mando, obediencia reflexiva vs. ciega.</span>
                                        <ul>
                                            <li><span class="punto-referencial">2.2. Jefe Coercitivo vs. Líder Institucional (poder formal vs. influencia).</span></li>
                                            <li><span class="punto-referencial">2.3. Estilos de Liderazgo: Autocrático (operaciones de alto riesgo), Democrático (planificación), Laissez-Faire (peligros), Transformacional (EPIs).</span></li>
                                        </ul>
                                    </li>
                                </ul>
                            </li>
                            <li><span class="nodo-principal">CORRESPONDENCIA Y RELACIONES HUMANAS</span>
                                <ul>
                                    <li><span class="subtitulo-mapa">3. Correspondencia Policial:</span> <span class="punto-referencial">Definición, características, clasificación (naturaleza, confidencialidad), importancia (institucional, valor probatorio), documentación policial (definición, características).</span></li>
                                    <li><span class="subtitulo-mapa">4. Relaciones Humanas, Públicas y Trato Social:</span> <span class="punto-referencial">Concepto, tipos, relaciones públicas, buen trato, normas de trato social, comportamiento individual/grupal, relacionamiento con el público, imperativos éticos, imagen personal e institucional, normas de trato al público, liderazgo y relaciones internas, líderes vs. jefes.</span></li>
                                </ul>
                            </li>
                            <li><span class="nodo-principal">EXPRESIÓN ORAL Y ESCRITA</span>
                                <ul>
                                    <li><span class="subtitulo-mapa">5. Expresión Oral y Escrita:</span> <span class="punto-referencial">La comunicación, lenguaje y gramática, oratoria y discurso (objetivo, miedo escénico), estructura del discurso (introducción, desarrollo, conclusión), lenguaje y voz.</span></li>
                                </ul>
                            </li>
                        </ul>
                    </div>
                `,
                guion: "<strong>Mini Guion:</strong> El Tema 12 integra tres dimensiones: ética, liderazgo y comunicación. La deontología policial nos marca los deberes profesionales. El liderazgo no es solo mandar; es influir positivamente. Diferenciamos al jefe coercitivo del líder institucional, y vemos estilos como el autocrático (para emergencias) y el democrático (para planificación). La correspondencia policial es clave para la trazabilidad y el valor probatorio. Las relaciones humanas y el buen trato son fundamentales para la legitimidad. Finalmente, la expresión oral y escrita, con la oratoria y la estructura del discurso, nos permite comunicar eficazmente nuestras decisiones y órdenes.",
                preguntas: [
                    { p: "¿Cuál es la diferencia entre un jefe coercitivo y un líder institucional?", r: "El jefe coercitivo se basa en el temor y la amenaza; el líder institucional combina autoridad legal con influencia positiva, ejemplo y desarrollo del personal." },
                    { p: "¿Qué es la obediencia reflexiva?", r: "Es cumplir órdenes comprendiendo su finalidad, legalidad y límites, a diferencia de la obediencia ciega que no analiza." },
                    { p: "Mencione dos características de la correspondencia policial.", r: "Formalidad, claridad, concisión, objetividad, exactitud, oportunidad, jerarquía y trazabilidad." },
                    { p: "¿Qué es el 'buen trato' en el ámbito policial?", r: "Es una práctica profesional basada en la dignidad, igualdad, cortesía, empatía y ausencia de discriminación, ejerciendo la autoridad sin humillación." },
                    { p: "¿Cuáles son las tres partes de la estructura del discurso?", r: "Introducción, desarrollo y conclusión." }
                ]
            },
            // --- TEMA 13 ---
            {
                titulo: "Tema 13: Psicología General y Aplicada",
                introduccion: "La psicología general y aplicada proporciona un marco científico para comprender la conducta, los procesos mentales y las relaciones humanas que se manifiestan en la vida cotidiana y, de manera particularmente intensa, en la labor policial. Su estudio permite interpretar cómo una persona percibe un hecho, procesa información, recuerda acontecimientos, regula emociones, toma decisiones y responde ante situaciones de amenaza, conflicto o crisis.",
                mapa: `
                    <div class="mapa-conceptual">
                        <ul>
                            <li><span class="nodo-principal">INTRODUCCIÓN Y PROCESOS PSICOLÓGICOS</span>
                                <ul>
                                    <li><span class="subtitulo-mapa">1. Introducción a la Psicología:</span> <span class="punto-referencial">Concepto, concepción bio-psico-social, campos de acción.</span></li>
                                    <li><span class="subtitulo-mapa">2. Funciones y Procesos Psicológicos:</span> <span class="punto-referencial">Sensación, percepción, atención, memoria, aprendizaje, pensamiento y lenguaje, motivación y emoción.</span></li>
                                </ul>
                            </li>
                            <li><span class="nodo-principal">PSICOLOGÍA DEL TESTIMONIO Y PERSONALIDAD</span>
                                <ul>
                                    <li><span class="subtitulo-mapa">3. Psicología del Testimonio:</span> <span class="punto-referencial">Concepto, entrevista a sospechosos, interferencias en la percepción, pautas para entrevistar testigos, psicología de los gestos y sintomatología de la mentira (reacciones orgánicas, simulación, disimulación, sobresimulación), pruebas psicotécnicas.</span></li>
                                    <li><span class="subtitulo-mapa">4. La Personalidad:</span> <span class="punto-referencial">Concepto, estructura, características y factores, carácter, temperamento y personalidad (clases).</span></li>
                                </ul>
                            </li>
                            <li><span class="nodo-principal">CRIMINALIDAD, FORENSE Y SALUD MENTAL</span>
                                <ul>
                                    <li><span class="subtitulo-mapa">5. La Personalidad Criminal:</span> <span class="punto-referencial">Psicología forense, diferencia con psiquiatría forense, personalidad criminal, concepto diferencial del delincuente (anormales: psicótico, psicópata, neurótico; normales: por crisis, profesionales, por instintos primitivos), agresividad, violencia (tipos).</span></li>
                                    <li><span class="subtitulo-mapa">6. Introducción a la Psicología Forense:</span> <span class="punto-referencial">Antecedentes, delimitación, ciencias afines (criminal, criminalística, penitenciaria).</span></li>
                                    <li><span class="subtitulo-mapa">7. Primeros Auxilios Psicológicos (PAP):</span> <span class="punto-referencial">Introducción, qué son, contención emocional, contribución del policía, componentes, desencadenantes de crisis.</span></li>
                                    <li><span class="subtitulo-mapa">8. Salud Mental:</span> <span class="punto-referencial">Concepto, en la función policial, estrés laboral, Síndrome de Burnout.</span></li>
                                    <li><span class="subtitulo-mapa">9. Personalidad Psicopática y Criminalidad:</span> <span class="punto-referencial">Características, conducta delictiva, instrumentos, comportamiento penitenciario.</span></li>
                                    <li><span class="subtitulo-mapa">10. Delincuente Sexual y Criminalidad:</span> <span class="punto-referencial">Características, trastornos y desviaciones (identidad sexual, parafilias), violación, incesto.</span></li>
                                </ul>
                            </li>
                        </ul>
                    </div>
                `,
                guion: "<strong>Mini Guion:</strong> El Tema 13 nos da una base psicológica para la función policial. Entender procesos como percepción, memoria y atención es clave para la psicología del testimonio. Aprendemos a entrevistar testigos sin sugestionar y a interpretar gestos con cautela. Estudiamos la personalidad y sus trastornos, diferenciando conceptos como psicópata, psicótico y neurótico. La psicología forense nos ayuda a delimitar nuestro campo. Los Primeros Auxilios Psicológicos (PAP) son una herramienta humanitaria para crisis. Finalmente, abordamos la salud mental del propio policía y el estudio de la personalidad criminal y delincuentes sexuales.",
                preguntas: [
                    { p: "¿Por qué la memoria no es una grabación literal de los hechos?", r: "Porque es una reconstrucción susceptible a olvidos, interferencias, sugerencias y reorganizaciones posteriores." },
                    { p: "¿Cuál es la diferencia entre psicología forense y psiquiatría forense?", r: "La psicología forense se centra en la evaluación psicológica (conducta, cognición); la psiquiatría forense es una especialidad médica orientada al diagnóstico y tratamiento de trastornos mentales, incluyendo medicación." },
                    { p: "¿Qué son los Primeros Auxilios Psicológicos (PAP)?", r: "Son acciones inmediatas de protección, escucha, orientación y enlace con recursos para personas afectadas por crisis, buscando reducir el impacto inicial." },
                    { p: "Mencione dos características de la personalidad psicopática.", r: "Insensibilidad, manipulación, mentira persistente, escaso remordimiento, irresponsabilidad." },
                    { p: "¿Qué es el Síndrome de Burnout?", r: "Es un estado de agotamiento relacionado con estrés laboral crónico, caracterizado por cansancio emocional, distanciamiento y disminución de la eficacia percibida." }
                ]
            },
            // --- TEMA 14 ---
            {
                titulo: "Tema 14: Soporte Vital Básico",
                introduccion: "El soporte vital básico comprende un conjunto de actuaciones iniciales destinadas a reconocer amenazas inmediatas para la vida, mantener las funciones esenciales y reducir el deterioro de una persona lesionada o enferma hasta que reciba atención sanitaria de mayor complejidad. En el ámbito policial, estas competencias adquieren especial relevancia porque el personal puede ser el primer respondiente en accidentes de tránsito, hechos violentos, intervenciones operativas, desastres o situaciones comunitarias en las que existen hemorragias, compromiso de la vía aérea o paro cardiorrespiratorio.",
                mapa: `
                    <div class="mapa-conceptual">
                        <ul>
                            <li><span class="nodo-principal">ATENCIÓN DE HEMORRAGIAS Y SHOCK</span>
                                <ul>
                                    <li><span class="subtitulo-mapa">1. Atención de Hemorragias:</span> <span class="punto-referencial">Pulsos y puntos de presión, evaluación de la situación, descubrimiento de la herida, signos y síntomas, volúmenes y pérdidas, características (capilar, venosa, arterial), verificación de heridas, colocación de apósito, control (presión directa/indirecta, vendaje de presión, empaquetadura, torniquete CAT, agentes hemostáticos).</span></li>
                                    <li><span class="subtitulo-mapa">1.10. Shock:</span> <span class="punto-referencial">Identificación (piel fría, taquicardia, hipotensión), tipos (hipovolémico, neurogénico), manejo (posición, control de hemorragia, evitar hipotermia).</span></li>
                                    <li><span class="subtitulo-mapa">1.11-1.13. Objetivos del tratamiento, hemorragia interna/externa, clasificación de heridas (abrasivas, cortantes, punzantes, por arma de fuego), manejo inicial, objetos empalados.</span></li>
                                </ul>
                            </li>
                            <li><span class="nodo-principal">VÍA AÉREA Y RESPIRACIÓN</span>
                                <ul>
                                    <li><span class="subtitulo-mapa">2. Verificación de Vías Aéreas:</span> <span class="punto-referencial">Tipos de obstrucción (parcial, total).</span></li>
                                    <li><span class="subtitulo-mapa">2.2. Técnicas de Respiración:</span> <span class="punto-referencial">Artificial, boca a boca, boca a dispositivo, boca barrera (mascarilla).</span></li>
                                </ul>
                            </li>
                            <li><span class="nodo-principal">REANIMACIÓN CARDIOPULMONAR (RCP)</span>
                                <ul>
                                    <li><span class="subtitulo-mapa">2.3. Reanimación Cardiopulmonar (RCP):</span> <span class="punto-referencial">Maniobras para mantener circulación y oxigenación, compresiones torácicas, uso de DEA.</span></li>
                                </ul>
                            </li>
                        </ul>
                    </div>
                `,
                guion: "<strong>Mini Guion:</strong> El Tema 14 es vital para el primer respondiente. El Soporte Vital Básico se centra en reconocer y tratar amenazas inmediatas. La prioridad número uno es el control de hemorragias: evaluamos la escena, descubrimos la herida y aplicamos presión directa, vendaje de presión, empaquetadura o torniquete según la gravedad. También reconocemos los signos de shock. Luego, nos enfocamos en la vía aérea: verificamos si hay obstrucción parcial o total y aplicamos técnicas de respiración artificial. Finalmente, la Reanimación Cardiopulmonar (RCP) con compresiones torácicas de alta calidad y el uso del DEA son esenciales para mantener la circulación en un paro cardiorrespiratorio.",
                preguntas: [
                    { p: "¿Cuál es la primera medida para controlar una hemorragia externa grave?", r: "La presión directa sobre la herida con un apósito o material limpio." },
                    { p: "Mencione tres signos de shock.", r: "Piel fría y pálida, taquicardia (pulso rápido) e hipotensión (presión arterial baja)." },
                    { p: "¿Qué es el torniquete táctico (tipo CAT) y cuándo se usa?", r: "Es un dispositivo para controlar hemorragias graves de extremidades cuando la presión directa no es suficiente. Se coloca proximal a la herida, ajustando hasta detener el sangrado y registrando la hora." },
                    { p: "¿Cuál es la diferencia entre una obstrucción parcial y total de la vía aérea?", r: "En la parcial, la persona puede toser o emitir sonidos; en la total, no puede hablar, toser eficazmente ni respirar, siendo una emergencia crítica." },
                    { p: "¿En qué consiste la Reanimación Cardiopulmonar (RCP) básica en adultos?", r: "Se basa en compresiones torácicas de alta calidad, minimización de interrupciones y uso temprano de un desfibrilador externo automático (DEA) cuando esté disponible." }
                ]
            },
            // --- TEMA 15 ---
            {
                titulo: "Tema 15: Metodología de la Investigación Científica",
                introduccion: "La metodología de la investigación científica constituye un sistema ordenado de decisiones conceptuales, técnicas y operativas destinado a estudiar un problema de manera verificable, coherente y útil para la toma de decisiones. En el ámbito policial, su aplicación permite transformar hechos observables —como variaciones en la incidencia delictiva, deficiencias de procedimientos, necesidades de capacitación o problemas de relación con la comunidad— en objetos de estudio delimitados, susceptibles de ser analizados mediante evidencia.",
                mapa: `
                    <div class="mapa-conceptual">
                        <ul>
                            <li><span class="nodo-principal">PLANTEAMIENTO Y SUSTENTO TEÓRICO</span>
                                <ul>
                                    <li><span class="subtitulo-mapa">1. Planteamiento del Problema:</span> <span class="punto-referencial">Identificación, descripción, pregunta de investigación, justificación (social, técnica, institucional, jurídica), delimitación (temática, espacial, temporal), objetivos (general, específicos).</span></li>
                                    <li><span class="subtitulo-mapa">2. Sustento Teórico:</span> <span class="punto-referencial">Marco conceptual, marco teórico, marco legal, marco institucional.</span></li>
                                </ul>
                            </li>
                            <li><span class="nodo-principal">METODOLOGÍA Y ANÁLISIS</span>
                                <ul>
                                    <li><span class="subtitulo-mapa">3. Metodología General:</span> <span class="punto-referencial">Enfoque (cuantitativo, cualitativo, mixto), tipo y diseño de investigación, población y muestra.</span></li>
                                    <li><span class="subtitulo-mapa">3.4. Técnicas de Investigación:</span> <span class="punto-referencial">Observación, entrevista, encuesta.</span></li>
                                    <li><span class="subtitulo-mapa">3.5. Instrumentos:</span> <span class="punto-referencial">Guía de observación, guía de entrevista, cuestionario.</span></li>
                                    <li><span class="subtitulo-mapa">4. Análisis e Interpretación de Datos:</span> <span class="punto-referencial">Diagnóstico y presentación de resultados (observación, entrevista, cuestionario), interpretación.</span></li>
                                </ul>
                            </li>
                            <li><span class="nodo-principal">PROPUESTA, CONCLUSIONES Y REFERENCIAS</span>
                                <ul>
                                    <li><span class="subtitulo-mapa">5. Propuesta de la Investigación (si corresponde):</span> <span class="punto-referencial">Título, objetivo, desarrollo.</span></li>
                                    <li><span class="subtitulo-mapa">6. Conclusiones y Recomendaciones.</span></li>
                                    <li><span class="subtitulo-mapa">7. Referencias Bibliográficas (APA 7).</span></li>
                                    <li><span class="subtitulo-mapa">8. Anexos.</span></li>
                                    <li><span class="subtitulo-mapa">9. Conclusión General.</span></li>
                                </ul>
                            </li>
                        </ul>
                    </div>
                `,
                guion: "<strong>Mini Guion:</strong> El Tema 15 nos enseña a investigar. Todo comienza con el planteamiento del problema: identificar una situación, describirla, formular una pregunta y justificar por qué es importante. Luego, construimos el sustento teórico con conceptos, teorías y leyes. La metodología define el camino: elegimos un enfoque (cuantitativo, cualitativo o mixto), un diseño, y seleccionamos técnicas e instrumentos como la entrevista o la encuesta. Posteriormente, analizamos e interpretamos los datos para generar un diagnóstico. Si corresponde, formulamos una propuesta de solución. Finalmente, presentamos conclusiones, recomendaciones y las referencias bibliográficas.",
                preguntas: [
                    { p: "¿Cuál es la diferencia entre el objetivo general y los objetivos específicos?", r: "El objetivo general sintetiza el propósito principal del estudio, mientras que los específicos descomponen ese propósito en resultados parciales y ordenados que contribuyen a lograrlo." },
                    { p: "Mencione tres técnicas de investigación.", r: "Observación, entrevista y encuesta." },
                    { p: "¿Qué es el marco teórico?", r: "Es la integración de enfoques, proposiciones y antecedentes científicos que explican o permiten comprender el fenómeno estudiado, relacionando conceptos y orientando la interpretación." },
                    { p: "¿Cuál es la diferencia entre población y muestra?", r: "La población es el conjunto total de unidades que cumplen los criterios de estudio; la muestra es una parte de esa población seleccionada para obtener información." },
                    { p: "¿Qué debe contener una conclusión de investigación?", r: "Debe responder de forma directa a cada objetivo, señalar los hallazgos más relevantes y mantener un nivel de certeza acorde con el diseño utilizado, sin ser un resumen extenso ni opiniones personales." }
                ]
            }
        ];

        // Variables de estado
        let currentSlide = 0;
        const totalSlides = temas.length;
        let menuOpen = false;

        // Elementos del DOM
        const menuList = document.getElementById('menu-list');
        const slideContainer = document.getElementById('slide-container');
        const progressInfo = document.getElementById('progress-info');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('overlay');

        // Generar el menú y las diapositivas
        function init() {
            temas.forEach((tema, index) => {
                // Menú
                const li = document.createElement('li');
                li.textContent = tema.titulo;
                li.onclick = () => {
                    goToSlide(index);
                    toggleMenu(); // Cierra el menú al seleccionar
                };
                menuList.appendChild(li);

                // Diapositiva (Estructura de dos columnas)
                const slideDiv = document.createElement('div');
                slideDiv.className = `slide ${index === 0 ? 'active' : ''}`;
                slideDiv.id = `slide-${index}`;

                let preguntasHTML = '';
                tema.preguntas.forEach((q, i) => {
                    preguntasHTML += `
                        <details>
                            <summary>${i + 1}. ${q.p}</summary>
                            <p>${q.r}</p>
                        </details>
                    `;
                });

                slideDiv.innerHTML = `
                    <!-- COLUMNA IZQUIERDA: Título, Intro, Mapa, Guion -->
                    <div class="col-izq">
                        <h2>${tema.titulo}</h2>
                        <div class="introduccion">
                            <strong>Introducción:</strong> ${tema.introduccion}
                        </div>
                        <div class="mapa-conceptual">
                            ${tema.mapa}
                        </div>
                        <div class="guion">
                            ${tema.guion}
                        </div>
                    </div>

                    <!-- COLUMNA DERECHA: Preguntas -->
                    <div class="col-der">
                        <h3>Preguntas y Respuestas Clave</h3>
                        ${preguntasHTML}
                    </div>
                `;
                slideContainer.appendChild(slideDiv);
            });

            updateUI();
        }

        // Función para abrir/cerrar menú
        function toggleMenu() {
            menuOpen = !menuOpen;
            if (menuOpen) {
                sidebar.classList.add('open');
                overlay.classList.add('active');
            } else {
                sidebar.classList.remove('open');
                overlay.classList.remove('active');
            }
        }

        // Función para cambiar de diapositiva
        function goToSlide(index) {
            if (index < 0 || index >= totalSlides) return;
            
            // Ocultar actual
            document.querySelector('.slide.active').classList.remove('active');
            
            // Mostrar nueva
            currentSlide = index;
            document.getElementById(`slide-${currentSlide}`).classList.add('active');
            
            // Actualizar menú
            updateUI();
            
            // Resetear scroll de las columnas al inicio
            document.querySelectorAll('.col-izq, .col-der').forEach(el => el.scrollTop = 0);
        }

        // Actualizar la interfaz
        function updateUI() {
            Array.from(menuList.children).forEach((li, i) => {
                li.classList.toggle('active', i === currentSlide);
            });

            prevBtn.disabled = currentSlide === 0;
            nextBtn.disabled = currentSlide === totalSlides - 1;

            progressInfo.textContent = `${currentSlide + 1} / ${totalSlides}`;
        }

        // Navegación
        function changeSlide(direction) {
            goToSlide(currentSlide + direction);
        }

        // Inicializar
        init();
    </script>
</body>
</html>
